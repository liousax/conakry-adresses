<style>
/* Itina Geo, design « Phare » : une police à nous (Saira), la nuit en encre profonde, le jour en gris froid ; le vert lumineux pour agir
   (texte foncé dessus, lisible en plein soleil), le bleu électrique pour le trajet ; le jaune et le rouge du drapeau pour signaler et arriver */
@font-face{font-family:"Saira";src:url(fonts/saira.woff2) format("woff2");font-weight:400 800;font-stretch:75% 100%;font-display:swap}
:root{--accent:#0a7a47;--on-accent:#ffffff;--accent-soft:#e3f6ec;--vif:#19d67c;--on-vif:#03170c;--cyan:#0b63c9;--jaune:#ffc400;--rouge:#e5383b;--panel2:#eef2f6;
  --ombre:0 10px 28px -8px rgba(10,22,40,.30),0 2px 6px rgba(10,22,40,.07);--verre:rgba(255,255,255,.84);--fil:rgba(10,22,40,.10);
  --font:"Saira",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--display:var(--font);--body:var(--font);--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease-out:cubic-bezier(.23,1,.32,1);--ease-drawer:cubic-bezier(.32,.72,0,1);
  --bg:#eef2f6;--panel:#ffffff;--fg:#0a1220;--muted:#526073;--line:#e2e8ef;--soft:#eef2f6;--green:#0a7a47;--on-green:#fff;--green-soft:#e3f6ec;--yellow:#e8b100;--red:#e5383b;--warn:#8a5a00;--blue:#2f5fa8;
  --route:#0a6cff;--route-c:#ffffff;--route-alt:#9aa7b8;--on-route:#ffffff;--moi:#0a6cff;
  --paper:#e9eef2;--dehors:#d6dde5;--street:#ffffff;--casing:#c6cfda;--major:#ffd76a;--major-casing:#d6a536;--text:#283241;--halo:#f7fafc;--quartier:#a8483b;--provisoire:#677485;
  --street-prop:#0f7a46;--street-keep:#3e5a8a;--street-todo:#b9a07a;--circ:#d9650b;--tram:#7b2d8e}
:root[data-theme="dark"]{--accent:#3df59e;--on-accent:#02140a;--accent-soft:#0e271b;--vif:#2bf08f;--on-vif:#02140a;--cyan:#4fd9ff;--jaune:#ffcf33;--rouge:#ff5a5f;--panel2:#141c27;
  --ombre:0 14px 36px -10px rgba(0,0,0,.8),0 2px 8px rgba(0,0,0,.45);--verre:rgba(12,18,27,.80);--fil:rgba(255,255,255,.09);
  --bg:#05080d;--panel:#0c121b;--fg:#e9eff7;--muted:#8d9aae;--line:#1b2431;--soft:#141c27;--green:#3df59e;--on-green:#02140a;--green-soft:#0e271b;--yellow:#ffcf33;--red:#ff5a5f;--warn:#ffcf33;--blue:#7fb2ff;
  --route:#2ee6ff;--route-c:#05242e;--route-alt:#5b687c;--on-route:#03141a;--moi:#2ee6ff;
  --paper:#070c13;--dehors:#04070b;--street:#202c3c;--casing:#03060a;--major:#3a4a64;--major-casing:#0b111a;--text:#c9d3df;--halo:#070c13;--quartier:#ff9f8a;--provisoire:#8794a6;
  --street-prop:#3fc483;--street-keep:#8fb0ea;--street-todo:#8a7a60;--circ:#ff9a45;--tram:#d08be6;color-scheme:dark}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg)}
#map{position:fixed;inset:0;background:var(--paper)}
button{font-family:inherit}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
/* barre du haut */
.haut{position:fixed;z-index:20;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:10px;pointer-events:none}
.haut>*{pointer-events:auto}
.barre{flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:54px;padding:0 7px 0 0;border-radius:999px;background:var(--panel);box-shadow:var(--ombre)}
.barre-q{flex:1;min-width:0;height:100%;display:flex;align-items:center;gap:10px;padding:0 4px 0 16px;border:0;border-radius:999px;background:none;color:var(--muted);cursor:pointer;text-align:left;font:600 16px var(--font)}
.barre .q{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ville{flex:none;display:inline-flex;align-items:center;gap:4px;height:40px;padding:0 12px;border:0;border-radius:999px;background:var(--panel2);color:var(--fg);font:700 14px var(--font);cursor:pointer}
.ville .ic{width:16px;height:16px}
.rond{flex:none;width:54px;height:54px;border:0;border-radius:50%;background:var(--panel);color:var(--fg);box-shadow:var(--ombre);display:grid;place-items:center;cursor:pointer}
.menu-villes{position:fixed;z-index:30;top:calc(env(safe-area-inset-top,0px) + 72px);right:max(78px,env(safe-area-inset-right,0px));list-style:none;margin:0;padding:6px;background:var(--panel);border-radius:16px;box-shadow:var(--ombre);min-width:200px}
.menu-villes a{display:flex;align-items:center;min-height:46px;padding:0 14px;border-radius:12px;color:var(--fg);text-decoration:none;font-weight:600}
.menu-villes a:hover,.menu-villes a:focus-visible{background:var(--panel2)}
.menu-villes .sep{padding:10px 14px 4px;font:700 11px var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.menu-villes .gm{margin-top:4px;border-top:1px solid var(--line);padding-top:4px}.menu-villes .gm a{font-weight:500;color:var(--muted)}
.menu-villes .tout button{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:0 14px;border:0;border-radius:12px;background:none;color:var(--accent);font:700 15px var(--font);cursor:pointer;text-align:left}
.menu-villes .tout button:hover,.menu-villes .tout button:focus-visible{background:var(--panel2)}.menu-villes .tout .ic{width:20px;height:20px}
.menu-villes .tout{border-bottom:1px solid var(--line);margin-bottom:4px;padding-bottom:4px}
.menu-villes a[aria-current="page"]{color:var(--accent)}.menu-villes a[aria-current="page"]::after{content:"";margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--accent)}
/* boutons ronds sur la carte */
.fabs{position:fixed;z-index:15;right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 80px);display:flex;flex-direction:column;gap:10px}
.fab{width:48px;height:48px;border:0;border-radius:50%;background:var(--panel);color:var(--fg);box-shadow:var(--ombre);display:grid;place-items:center;cursor:pointer;font:800 11px var(--font)}
.fab[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.fab-zoom{display:flex;flex-direction:column;border-radius:24px;background:var(--panel);box-shadow:var(--ombre);overflow:hidden}
.fab-zoom .fab{box-shadow:none;border-radius:0;font:500 28px/1 var(--font)}.fab-zoom .fab+.fab{border-top:1px solid var(--line)}
.fab-zoom .fab:disabled{color:var(--line);cursor:default}
.maj{position:fixed;z-index:25;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 76px);width:min(520px,calc(100vw - 24px));display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;border-radius:18px;background:var(--panel);color:var(--fg);box-shadow:var(--ombre);font:600 14px/1.35 var(--font)}
.maj span{flex:1}.maj button{flex:none;height:40px;padding:0 14px;border:0;border-radius:12px;background:var(--accent);color:var(--on-accent);font:700 14px var(--font);cursor:pointer}
.maj .majx{width:40px;padding:0;background:var(--panel2);color:var(--fg);font-size:20px}
.fab.boussole svg{transition:transform .2s}
.signaler{position:fixed;z-index:16;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(var(--feuille,160px) + 14px);width:62px;height:62px;border:0;border-radius:20px;background:var(--jaune);color:#2b2100;box-shadow:0 6px 18px rgba(0,0,0,.3);display:grid;place-items:center;cursor:pointer}
.signaler svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
/* petits écrans (iPhone SE…) : colonne de boutons resserrée, pour ne pas passer sous le bouton jaune « Signaler » */
@media (max-width:899px) and (max-height:700px){.fabs{top:calc(env(safe-area-inset-top,0px) + 72px);gap:6px}.fab{width:42px;height:42px}.fab-zoom .fab{font-size:24px}
  .signaler{width:52px;height:52px;border-radius:17px}.signaler svg{width:28px;height:28px}}
@media (max-width:899px) and (max-height:520px){.signaler{right:calc(max(12px,env(safe-area-inset-right,0px)) + 54px)}}
/* feuille du bas (à gauche sur ordinateur) */
.feuille{position:fixed;z-index:18;left:0;right:0;bottom:0;max-height:min(40vh,560px);overflow:auto;overscroll-behavior:contain;background:var(--panel);color:var(--fg);border-radius:24px 24px 0 0;box-shadow:0 -6px 28px rgba(0,0,0,.2);padding:0 18px calc(18px + env(safe-area-inset-bottom,0px));transition:max-height .25s}
.feuille.grande{max-height:88vh}
.feuille.replie{max-height:calc(56px + env(safe-area-inset-bottom,0px));overflow:hidden}
.poignee{position:sticky;top:0;z-index:2;display:block;width:100%;height:24px;margin:0 0 4px;border:0;background:var(--panel);cursor:pointer}
.poignee::after{content:"";position:absolute;left:50%;top:9px;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:var(--line)}
.sur{font:700 13px var(--font);color:var(--muted);display:flex;align-items:center;gap:8px;min-height:24px}
.sur.ici::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--moi);box-shadow:0 0 0 3px color-mix(in srgb,var(--moi) 25%,transparent);flex:none}
.sur.tram::before{content:"";width:10px;height:10px;border-radius:50%;border:2.5px solid var(--tram);box-sizing:border-box;flex:none}
.fermer{margin-left:auto;width:38px;height:38px;flex:none;border:0;border-radius:50%;background:var(--panel2);color:var(--fg);display:grid;place-items:center;cursor:pointer}
.fermer .ic{width:18px;height:18px}
.feuille h1{font:800 25px/1.15 var(--font);letter-spacing:-.02em;margin:4px 0 4px;text-wrap:balance}
.feuille h2{font:800 21px/1.2 var(--font);letter-spacing:-.01em;margin:4px 0 4px}
.feuille h3{font:700 13px var(--font);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:18px 0 6px}
.l2{font-size:15px;color:var(--fg)}
.info{font-size:13.5px;color:var(--muted);margin:8px 0 0;line-height:1.45}
.info.prov{color:var(--warn)}
.ded{margin:10px 0 0;padding:9px 11px;border-left:3px solid var(--quartier);background:color-mix(in srgb,var(--quartier) 8%,transparent);border-radius:0 10px 10px 0;font-size:13.5px;line-height:1.4}
.puces{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 2px}
.puce{font:600 12.5px ui-monospace,SFMono-Regular,Menlo,monospace;padding:6px 10px;border-radius:9px;background:var(--accent-soft);color:var(--accent);border:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:32px;max-width:100%;overflow-wrap:anywhere;text-align:left}
.puce.pc{background:var(--panel2);color:var(--fg)}
.puce .ic{width:14px;height:14px}
.actions{display:flex;gap:8px;margin-top:14px}
.bt{flex:1 1 auto;min-height:50px;padding:0 16px;border:0;border-radius:15px;background:var(--panel2);color:var(--fg);font:700 15px var(--font);display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none}
.bt.vert{background:var(--accent);color:var(--on-accent)}
.bt.rouge{background:color-mix(in srgb,var(--rouge) 14%,transparent);color:var(--rouge)}
.bt.carre{flex:0 0 50px;padding:0}
.bt[aria-pressed="true"]{color:var(--jaune)}
.bt[disabled]{opacity:.45;cursor:default}
.bt .ic{width:20px;height:20px}
.bt.vert .plein{fill:currentColor;stroke:none}
.plus{display:grid;gap:6px;margin-top:8px}
.plus .bt{justify-content:flex-start}
/* accueil */
.salut{font:800 24px/1.15 var(--font);letter-spacing:-.02em;margin:2px 0 2px}
.raccourcis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.racc{display:flex;align-items:center;gap:10px;padding:12px;border:0;border-radius:16px;background:var(--panel2);color:var(--fg);cursor:pointer;text-align:left;min-height:64px}
.racc b{display:block;font-size:15px}.racc .tx>span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.racc .tx{min-width:0}
.emoji{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.emoji .ic{width:21px;height:21px}
.e-maison{background:#ffe9d6;color:#c2410c}.e-travail{background:#fff1c2;color:#a16207}.e-etoile{background:#fff4c4;color:#b78a00}.e-histo{background:var(--panel2);color:var(--muted)}
.e-quartier{background:#e7e9ff;color:#4338ca}.e-gps{background:#dff3ff;color:#0369a1}.e-alerte{background:#fff1c2;color:#a16207}.e-tram{background:#f3e3fb;color:#7b2d8e}
:root[data-theme="dark"] .e-maison{background:#3a2a1e;color:#fdba74}:root[data-theme="dark"] .e-travail{background:#3a321a;color:#fcd34d}:root[data-theme="dark"] .e-etoile{background:#3a3417;color:#fde047}
:root[data-theme="dark"] .e-quartier{background:#262a52;color:#a5b4fc}:root[data-theme="dark"] .e-gps{background:#14303f;color:#7dd3fc}:root[data-theme="dark"] .e-alerte{background:#3a321a;color:#fcd34d}:root[data-theme="dark"] .e-tram{background:#35213d;color:#e9b6f7}
.liste{list-style:none;margin:0;padding:0}
.ligne{display:flex;align-items:center;gap:14px;width:100%;padding:12px 2px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--fg);text-align:left;cursor:pointer;font:inherit}
.liste li:last-child .ligne{border-bottom:0}
.ligne .tx{flex:1;min-width:0}.ligne b{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ligne small{display:block;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ligne .def{color:var(--cyan);font-weight:600}
.ligne .km{flex:none;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.avec-oter{display:flex;align-items:center;border-bottom:1px solid var(--line)}.avec-oter .ligne{border-bottom:0}.liste li.avec-oter:last-child{border-bottom:0}
.oter{flex:none;width:40px;height:40px;border:0;border-radius:50%;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.oter .ic{width:16px;height:16px}
.pied{display:flex;flex-wrap:wrap;gap:4px 16px;margin:16px 0 2px;font-size:13px;color:var(--muted)}
.pied a{color:var(--muted);font-weight:600}
/* itinéraire */
.pts{display:grid;grid-template-columns:16px 1fr;gap:8px 10px;align-items:center;font-size:14.5px;margin:8px 0}
.pts i{width:12px;height:12px;border-radius:50%;display:block;margin:0 auto}.pts .a{border:3px solid var(--moi);box-sizing:border-box}.pts .b{background:var(--rouge)}
.pts span{min-width:0;overflow-wrap:anywhere}
.lien{border:0;background:none;color:var(--cyan);font:700 13px var(--font);margin-left:8px;padding:4px 0;cursor:pointer}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--panel2);padding:4px;border-radius:14px;margin:10px 0}
.modes button{border:0;background:none;padding:9px 4px;border-radius:11px;font:700 14px var(--font);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.modes button .ic{width:18px;height:18px}
.modes button[aria-pressed="true"]{background:var(--panel);color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.trajet{display:block;width:100%;margin:8px 0 0;padding:12px 14px;border:2px solid var(--line);border-radius:18px;background:var(--panel);color:var(--fg);text-align:left;cursor:pointer;font:inherit}
.trajet[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.trajet .ha{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.trajet .du{font:800 26px/1.1 var(--font);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.trajet .ar{font-size:14px;font-weight:600;color:var(--muted)}
.trajet .ec{font-size:13px;font-weight:700;color:var(--rouge)}
.trajet .vi{font-size:14px;color:var(--muted);margin-top:2px}
.trajet .ev{display:flex;align-items:center;gap:6px;font-size:13.5px;margin-top:6px;color:var(--accent);font-weight:600}
.trajet .ev.al{color:#c2410c}:root[data-theme="dark"] .trajet .ev.al{color:#fdba74}
.trajet .ev .ic{width:16px;height:16px}
details.etapes{margin-top:12px;border-top:1px solid var(--line);padding-top:6px}
details.etapes summary{cursor:pointer;font-weight:700;font-size:14px;min-height:36px;display:flex;align-items:center;color:var(--muted)}
details.etapes ol{list-style:none;margin:0;padding:0}
details.etapes li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
details.etapes li span:last-child{color:var(--muted);white-space:nowrap}
/* panneaux plein écran : recherche et paramètres */
.panneau{position:fixed;inset:0;z-index:50;background:var(--panel);color:var(--fg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.p-tete{flex:none;display:flex;align-items:center;gap:8px;padding:12px 12px 8px}
.champ{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:54px;padding:0 8px 0 4px;border-radius:999px;background:var(--panel2)}
.champ input{flex:1;min-width:0;border:0;background:none;color:var(--fg);font:600 17px var(--font);padding:0;min-height:44px;outline:none}
.champ input::placeholder{color:var(--muted);font-weight:500}
.champ input::-webkit-search-cancel-button,.champ input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.rbt{flex:none;width:44px;height:44px;border:0;border-radius:50%;background:none;color:var(--fg);display:grid;place-items:center;cursor:pointer}
.rbt.ecoute{background:var(--rouge);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--rouge) 25%,transparent)}}
.p-titre{font:800 20px var(--font);flex:1}
.p-corps{flex:1;overflow:auto;padding:4px 16px calc(24px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.p-corps h3{font:600 14px var(--font);color:var(--muted);margin:20px 2px 4px}
.tuiles{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.tuiles::-webkit-scrollbar{display:none}
.tuile{flex:none;width:112px;min-height:88px;padding:12px 10px;border:0;border-radius:18px;background:var(--panel2);color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;font:700 14px var(--font)}
.tuile[aria-pressed="true"]{outline:2px solid var(--accent)}
.mode-choix{display:flex;align-items:center;gap:10px;margin:4px 2px 8px;padding:10px 12px;border-radius:14px;background:var(--accent-soft);color:var(--fg);font-size:14px;font-weight:600}
.vide{padding:14px 2px;color:var(--muted);font-size:14.5px;line-height:1.45}
.vide a{color:var(--cyan)}
details.commune{border-bottom:1px solid var(--line)}
details.commune summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:54px;font-weight:700;font-size:16px}
details.commune summary::-webkit-details-marker{display:none}
details.commune summary small{color:var(--muted);font-weight:600}
/* paramètres, comme les réglages de Waze */
.reglage{border-bottom:1px solid var(--line)}
.reglage>summary{list-style:none;display:flex;align-items:center;gap:14px;min-height:64px;cursor:pointer;font-size:16.5px;font-weight:600}
.reglage>summary::-webkit-details-marker{display:none}
.reglage>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2.4px solid var(--muted);border-bottom:2.4px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
.reglage[open]>summary::after{transform:rotate(45deg)}
.pastille{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff}
.pastille .ic{width:21px;height:21px}
.r-corps{padding:2px 0 16px 56px;display:grid;gap:12px;font-size:15px}
.r-ligne{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.r-ligne small{display:block;color:var(--muted);font-size:13px}
.inter{position:relative;flex:none;width:52px;height:32px;border:0;border-radius:16px;background:var(--line);cursor:pointer;transition:background .15s}
.inter::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.inter[aria-checked="true"]{background:var(--accent)}.inter[aria-checked="true"]::after{left:23px}
.segs{display:flex;gap:4px;background:var(--panel2);padding:4px;border-radius:12px}
.segs button{flex:1;border:0;background:none;padding:8px 6px;border-radius:9px;font:700 13.5px var(--font);color:var(--muted);cursor:pointer}
.segs button[aria-pressed="true"]{background:var(--panel);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.p-version{text-align:center;color:var(--muted);font-size:13px;margin:22px 0 8px}
/* signalements */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.m-boite{width:min(520px,100%);background:var(--panel);color:var(--fg);border-radius:26px 26px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.35)}
.m-boite h2{font:800 21px var(--font);margin:0 0 4px;display:flex;align-items:center}
.m-boite p{margin:0 0 12px;color:var(--muted);font-size:14px}
.sig-g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sig-b{border:0;background:var(--panel2);color:var(--fg);border-radius:18px;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;font:700 13.5px/1.2 var(--font);text-align:center}
.sig-r{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff}
.sig-r svg,.mk-sig svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.mk-sig{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4);cursor:pointer}
.mk-sig svg{width:20px;height:20px}
/* repères, position, messages */
.pin{width:32px;height:44px;margin:-44px 0 0 -16px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.me{width:20px;height:20px;border-radius:50%;background:var(--moi);border:3px solid #fff;box-shadow:0 0 0 7px color-mix(in srgb,var(--moi) 24%,transparent),0 2px 6px rgba(0,0,0,.3)}
/* en mouvement : flèche tournée dans le sens de la marche (l'élément intérieur tourne ; la carte place l'élément extérieur) */
.me i{display:none}.me.cap{width:34px;height:34px;background:none;border:0;box-shadow:none}
.me.cap i{display:block;width:34px;height:34px}.me.cap svg{display:block;width:34px;height:34px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.45))}
.toast{position:fixed;z-index:70;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 76px);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.pick{position:fixed;z-index:25;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 78px);background:var(--panel);color:var(--fg);border:2px solid var(--cyan);border-radius:16px;padding:8px 8px 8px 14px;font-weight:700;display:flex;gap:10px;align-items:center;box-shadow:var(--ombre);max-width:calc(100% - 24px)}
.pick .bt{min-height:40px;flex:none}
.status{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:var(--bg);padding:24px;text-align:center}
.status div{max-width:440px}
.status .logo{width:72px;height:72px;margin:0 auto 14px;display:block}
.status h3{font:800 20px var(--font);margin:0 0 6px}
.status .err-act{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0 0}.status .err-act .bt{text-decoration:none;flex:0 0 auto}
.maplibregl-ctrl-bottom-right{bottom:calc(var(--feuille,160px) + 4px)}
.maplibregl-ctrl-bottom-left{bottom:calc(var(--feuille,160px) + 4px)}
.ici{position:fixed;z-index:16;left:50%;transform:translateX(-50%);bottom:calc(var(--feuille,160px) + 18px);max-width:min(56vw,420px);padding:10px 18px;border-radius:999px;background:#0b0f14;color:#fff;font:800 16px/1.2 var(--font);text-align:center;box-shadow:var(--ombre);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.vit{position:fixed;z-index:16;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(var(--feuille,160px) + 14px);width:62px;height:62px;border-radius:50%;background:var(--panel);color:var(--fg);box-shadow:var(--ombre);display:grid;align-content:center;justify-items:center;line-height:1;pointer-events:none}
.vit b{font:800 23px var(--font);font-variant-numeric:tabular-nums}.vit small{font:600 10px var(--font);color:var(--muted);margin-top:2px}
body.avec-vit .maplibregl-ctrl-bottom-left{bottom:calc(var(--feuille,160px) + 84px)}

.maplibregl-ctrl-attrib,.maplibregl-ctrl-attrib.maplibregl-compact{background:color-mix(in srgb,var(--panel) 85%,transparent);color:var(--fg)}.maplibregl-ctrl-attrib a{color:var(--fg)}
.maplibregl-ctrl-group{background:var(--panel)}.maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:var(--icones,none)}
:root[data-theme="dark"]{--icones:invert(1)}
.maplibregl-ctrl-scale{background:color-mix(in srgb,var(--panel) 70%,transparent);color:var(--fg);border-color:var(--fg)}
@media (max-width:899px){.maplibregl-ctrl-zoom-in,.maplibregl-ctrl-zoom-out,.maplibregl-ctrl-compass,.maplibregl-ctrl-scale{display:none!important}}
/* établissements, comme sur Google Maps */
.cat-r{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff}
.cat-r svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cat-r.petit{width:24px;height:24px}.cat-r.petit svg{width:14px;height:14px}
.etat-o{color:#12a05c;font-weight:700}.etat-f{color:#d1343a;font-weight:700}
:root[data-theme="dark"] .etat-o{color:#2fd27e}:root[data-theme="dark"] .etat-f{color:#ff7a7f}
.badge{display:inline-flex;align-items:center;font:700 11.5px var(--font);padding:3px 8px;border-radius:999px}
.badge.ok{background:#dcfce7;color:#166534}.badge.att{background:#fef3c7;color:#92400e}
:root[data-theme="dark"] .badge.ok{background:#14532d;color:#bbf7d0}:root[data-theme="dark"] .badge.att{background:#422006;color:#fde68a}
.horaires{list-style:none;margin:0;padding:0}.horaires li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}.horaires li:last-child{border-bottom:0}
.horaires li span:last-child{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.coord{list-style:none;margin:0;padding:0}.coord li{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:15px}.coord a{color:var(--cyan);font-weight:600;text-decoration:none;overflow-wrap:anywhere}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:2px -16px 4px;padding:2px 16px 8px}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 6px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:600 14px var(--font);cursor:pointer}
.chip .cat-r{width:28px;height:28px}.chip .cat-r svg{width:16px;height:16px}
.filtre-cat{position:fixed;z-index:19;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;align-items:center;gap:8px;padding:5px;border-radius:999px;background:var(--panel);color:var(--fg);box-shadow:var(--ombre);font-weight:700;max-width:calc(100% - 140px);white-space:nowrap}
.filtre-cat span{overflow:hidden;text-overflow:ellipsis}.filtre-cat .cat-r{width:30px;height:30px}.filtre-cat .cat-r svg{width:17px;height:17px}.filtre-cat .fermer{width:32px;height:32px;margin:0}
.e-ajout{background:#dcfce7;color:#15803d}:root[data-theme="dark"] .e-ajout{background:#14532d;color:#86efac}
#fAjout{display:grid;gap:4px;padding-bottom:20px}
.a-pos{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--panel2);margin:4px 0 8px}
.a-pos .tx{flex:1;min-width:0}.a-pos b{display:block}.a-pos small{display:block;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.a-l{display:block;font-weight:700;font-size:14.5px;margin-top:12px}
.a-l small{font-weight:500;color:var(--muted)}
.a-in{width:100%;min-height:48px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--fg);font:500 16px var(--font)}
textarea.a-in{resize:vertical;line-height:1.4}
.a-in:focus{outline:2px solid var(--accent);outline-offset:0}
.a-err{margin:2px 0 0;color:var(--rouge);font-size:13.5px;font-weight:600}.a-err:empty{display:none}
.a-c{display:flex;align-items:flex-start;gap:10px;font-size:14.5px;margin-top:12px;line-height:1.35}.a-c input{width:20px;height:20px;flex:none;margin:1px 0 0;accent-color:var(--accent)}
.a-cats{display:grid;gap:10px;max-height:330px;overflow:auto;border:1px solid var(--line);border-radius:16px;padding:10px;margin-top:6px}
.a-gt{font:700 11.5px var(--font);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:2px 0 6px}
.a-grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:6px}
.a-cat{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:12px;border:2px solid transparent;background:var(--panel2);color:var(--fg);font:600 13px/1.2 var(--font);text-align:left;cursor:pointer;min-height:44px}
.a-cat .cat-r{width:30px;height:30px}.a-cat .cat-r svg{width:17px;height:17px}
.a-cat[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.a-h{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.a-h select{grid-column:1/-1}.a-h label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.a-n{justify-self:end;color:var(--muted);font-size:12px}
.a-ok{margin-top:16px;width:100%}
.piege{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.code-box{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:12px;padding:14px;border-radius:16px;background:var(--accent-soft)}
.code-box small{flex:1 0 100%;color:var(--muted);font-weight:600}.code-box b{flex:1;font:800 22px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em}.code-box .bt{flex:none;min-height:42px}
.mini{display:grid;gap:8px;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:16px}
.mini label{display:grid;gap:4px;font-weight:600;font-size:14px}.mini input,.mini textarea{min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--fg);font:500 15px var(--font)}
.segs.col{flex-wrap:wrap}.segs.col button{flex:1 1 45%}
.pick #pickMoi{flex:none}
/* photos des lieux : galerie de la fiche, visionneuse, formulaire */
.photos{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:12px -18px 2px;padding:0 18px}.photos::-webkit-scrollbar{display:none}
.ph{position:relative;flex:none;height:132px;min-width:96px;max-width:230px;padding:0;border:0;border-radius:14px;overflow:hidden;background:var(--panel2);cursor:zoom-in}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph-att{position:absolute;left:6px;bottom:6px;font:700 11px var(--font);background:rgba(0,0,0,.62);color:#fff;padding:3px 8px;border-radius:999px}
.visio{position:fixed;inset:0;z-index:95;background:#000;display:grid;place-items:center;touch-action:pan-y}
.visio img{max-width:100%;max-height:calc(100% - 120px);object-fit:contain;user-select:none;-webkit-user-drag:none}
.v-haut{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px 18px;color:#fff;font-weight:700;background:linear-gradient(rgba(0,0,0,.6),transparent)}
.v-haut span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-fermer,.v-nav{border:0;border-radius:50%;width:46px;height:46px;display:grid;place-items:center;background:rgba(255,255,255,.14);color:#fff;cursor:pointer}
.v-nav{position:absolute;top:50%;transform:translateY(-50%)}.v-prec{left:12px}.v-suiv{right:12px}
.v-compte{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);left:0;right:0;text-align:center;color:#e5e7eb;font-size:14px;font-weight:600}
.a-photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.a-photos:empty{display:none}
.a-ph{position:relative;width:86px;height:86px;border-radius:12px;overflow:hidden;background:var(--panel2)}
.a-ph img{width:100%;height:100%;object-fit:cover;display:block}
.a-ph button{position:absolute;top:4px;right:4px;min-width:28px;height:28px;padding:0 6px;border-radius:999px;border:0;background:rgba(0,0,0,.66);color:#fff;display:grid;place-items:center;font:700 11px var(--font);cursor:pointer}
.a-ph button .ic{width:14px;height:14px}
.a-ajph{justify-self:start;margin-top:8px;cursor:pointer;min-height:44px}
.actions.defile{overflow-x:auto;scrollbar-width:none;margin-left:-18px;margin-right:-18px;padding:0 18px 2px}.actions.defile::-webkit-scrollbar{display:none}
.actions.defile .bt{flex:none;white-space:nowrap}.actions.defile .bt.vert{padding:0 22px}.actions.defile .bt.carre{width:50px}
/* ---------- bienvenue : premier lancement (présentation, position, moyen de transport, découverte), comme Coyote et Waze ---------- */
.bv{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);overflow:hidden;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);transition:opacity .28s}
.bv.sortie{opacity:0;pointer-events:none}
.bv-ecran{position:relative;flex:1;display:flex;flex-direction:column;min-height:0;width:100%;max-width:520px;margin:0 auto;padding:12px 24px 22px;box-sizing:border-box;animation:bvIn .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes bvIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.bv-haut{display:flex;justify-content:flex-end;align-items:center;min-height:40px}
.bv-passer{border:0;background:none;color:var(--muted);font:700 15px var(--font);padding:10px 6px;cursor:pointer}
.bv-illu{flex:1;min-height:110px;display:grid;place-items:center;padding:4px 0 14px}
.bv-illu svg{height:100%;width:auto;max-height:320px;max-width:100%}
.bv-vide{flex:1;min-height:12px}
.bv h1{font:800 clamp(25px,7vw,32px)/1.15 var(--font);letter-spacing:-.02em;margin:0 0 10px;outline:none}
.bv p{font-size:16px;line-height:1.5;color:var(--muted);margin:0}
.bv-bas{display:flex;flex-direction:column;gap:4px;margin-top:22px}
.bv-go{min-height:56px;border:0;border-radius:18px;background:var(--accent);color:var(--on-accent);font:800 17px var(--font);cursor:pointer;width:100%;transition:background .2s,transform .1s}
.bv-go:active{transform:scale(.98)}
.bv-go:disabled{background:var(--panel2);color:var(--muted);cursor:default;transform:none}
.bv-lien{border:0;background:none;color:var(--muted);font:700 15px var(--font);padding:12px;cursor:pointer}
.bv-note{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-top:16px;font-size:14.5px;line-height:1.45;color:var(--fg)}
.bv-note .ic{width:22px;height:22px;color:var(--accent)}
.bv .bv-disque{fill:var(--panel2)}.bv .bv-disque-rues{stroke:var(--panel)}
/* l'écran d'accueil : le vert du logo, des rues et un trajet qui avance jusqu'à la porte */
.bv.marque{background:#0d3a28;color:#fff;color-scheme:dark}
.bv-fond{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.bv.marque .bv-ecran{justify-content:flex-end}
.bv.marque p{color:#cfe6d8;font-size:17px}
.bv-nom{display:inline-block;font:800 13px var(--font);letter-spacing:.14em;text-transform:uppercase;color:#fcd116;margin-bottom:12px}
.bv.marque h1{font-size:clamp(30px,8.6vw,40px)}
.bv-go.jaune{background:#fcd116;color:#1d1a00}
.bv-trace{stroke-dasharray:16 14;animation:bvTrace 1.4s linear infinite}
@keyframes bvTrace{to{stroke-dashoffset:-30}}
.bv-onde{transform-box:fill-box;transform-origin:center;animation:bvOnde 2.2s ease-out infinite}
.bv-onde.d2{animation-delay:1.1s}
@keyframes bvOnde{from{transform:scale(.4);opacity:.75}to{transform:scale(1.7);opacity:0}}
/* moyen de transport */
.bv-modes{display:grid;gap:12px;margin-top:22px}
.bv-mode{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;border:2px solid var(--line);background:var(--panel);color:var(--fg);font:inherit;text-align:left;cursor:pointer;transition:border-color .15s,background .15s}
.bv-mode .ic{width:28px;height:28px;padding:11px;box-sizing:content-box;border-radius:15px;background:var(--panel2)}
.bv-mode b{display:block;font-size:17px}
.bv-mode small{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.bv-mode::after{content:"";margin-left:auto;flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);box-sizing:border-box}
.bv-mode[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.bv-mode[aria-checked="true"] .ic{background:var(--accent);color:var(--on-accent)}
.bv-mode[aria-checked="true"]::after{border:7px solid var(--accent)}
/* découverte : des écrans qui glissent au doigt, avec des points */
.bv-fen{flex:1;min-height:0;overflow:hidden;margin:0 -24px;touch-action:pan-y}
.bv-piste{display:flex;height:100%;transition:transform .38s cubic-bezier(.2,.8,.2,1)}
.bv-piste.glisse{transition:none}
.bv-diapo{flex:0 0 100%;min-width:0;display:flex;flex-direction:column;padding:0 24px;box-sizing:border-box}
.bv-points{display:flex;gap:7px;justify-content:center;margin-top:18px}
.bv-points i{width:8px;height:8px;border-radius:4px;background:var(--line);transition:width .25s,background .25s}
.bv-points i.on{width:24px;background:var(--accent)}
@media (prefers-reduced-motion:reduce){.bv,.bv *{animation:none!important;transition:none!important}}

<script>
(()=>{
const $=id=>document.getElementById(id),CA=window.ConakryAdresses;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
let toastT;const toast=m=>{const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},3400)};
const fmtD=m=>m<1000?Math.round(m/10)*10+' m':(m/1000).toFixed(m<10000?1:0).replace('.',',')+' km';
/* durée : minutes arrondies d'abord (1 h 59 min 40 s donne « 2 h 00 », jamais « 1 h 60 ») */
const fmtT=s=>{if(s<60)return'1 min';const m=Math.round(s/60);return m<60?m+' min':Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')};
const heure=d=>d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
const ilya=t=>{const m=Math.round((Date.now()-t)/60000);return m<1?'à l\'instant':m<60?'il y a '+m+' min':m<1440?'il y a '+Math.round(m/60)+' h':'il y a '+Math.round(m/1440)+' j'};
const glyphOk=c=>{const n=c.codePointAt(0);return n<1024||(n>=7680&&n<7936)||(n>=8192&&n<8448)};
const safe=t=>[...String(t||'')].map(c=>glyphOk(c)?c:[...c.normalize('NFD')].filter(glyphOk).join('')).join('');
const lire=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k)||'null');return v==null?d:v}catch(e){return d}};
const ecrire=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const distLL=(a,b)=>Math.hypot((a[0]-b[0])*110574,(a[1]-b[1])*111320*Math.cos(a[0]*Math.PI/180));
const tel=()=>matchMedia('(max-width:899px)').matches;
/* icônes (24 × 24) */
const P=d=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const I={
  fermer:P('<path d="M6 6l12 12M18 6 6 18"/>'),copie:P('<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>'),
  maison:P('<path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/>'),travail:P('<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5h6v2M3 13h18"/>'),
  etoile:P('<path d="m12 3 2.8 5.8 6.2.9-4.5 4.4 1.1 6.2L12 17.4l-5.6 2.9 1.1-6.2L3 9.7l6.2-.9z"/>'),histo:P('<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>'),
  rue:P('<path d="M7 21 10 3M17 21 14 3M12 6v2M12 11v2M12 16v2"/>'),lieu:P('<path d="M12 21s7-6.6 7-12a7 7 0 0 0-14 0c0 5.4 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>'),
  quartier:P('<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>'),
  gps:P('<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>'),alerte:P('<path d="M12 3 22 20H2z"/><path d="M12 10v4M12 17v.5"/>'),
  tram:P('<rect x="6" y="3" width="12" height="14" rx="3"/><path d="M6 11h12M9 21l1.5-4M15 21l-1.5-4M10 7h4"/>'),code:P('<path d="M4 7V5h4M20 7V5h-4M4 17v2h4M20 17v2h-4M8 12h8"/>'),
  partager:P('<circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.6-4.5M8.2 13.2l7.6 4.5"/>'),
  plus3:P('<circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/>'),aller:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path class="plein" d="M12 2 4.5 20.3l.7.7L12 18l6.8 3 .7-.7z"/></svg>',
  voiture:P('<path d="M5 16V11l2-5h10l2 5v5M5 16h14M5 16v3M19 16v3"/><circle cx="8" cy="13.5" r="1"/><circle cx="16" cy="13.5" r="1"/>'),moto:P('<circle cx="5.5" cy="16.5" r="3.5"/><circle cx="18.5" cy="16.5" r="3.5"/><path d="M5.5 16.5 9 10h5l4.5 6.5M14 10l-2-4h-2M15 6h3"/>'),
  pied:P('<circle cx="13" cy="4" r="2"/><path d="M10 21l2-6-3-3 1-5 4 3 3 1M9 12l-3 2"/>'),ok:P('<path d="m5 12 5 5L20 7"/>'),apercu:P('<path d="M5 19c4-10 9-2 11-9s4-4 4-6"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="5" r="2"/>'),
  carte:P('<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>'),voix:P('<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>'),
  nav:P('<path d="M12 2 4.5 20.3l.7.7L12 18l6.8 3 .7-.7z"/>'),cloche:P('<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/>'),
  nuage:P('<path d="M7 18a4.5 4.5 0 0 1-.4-9A6 6 0 0 1 18 10.5 3.8 3.8 0 0 1 17.5 18z"/><path d="M12 11v5M9.5 13.5 12 16l2.5-2.5"/>'),ville:P('<path d="M3 21h18M5 21V9l5-3v15M10 21V4l9 4v13M13 10h3M13 13h3M13 16h3"/>'),
  info:P('<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>'),
  ajout:P('<path d="M12 21s7-6.6 7-12a7 7 0 0 0-14 0c0 5.4 7 12 7 12z"/><path d="M12 6v6M9 9h6"/>'),
  tel:P('<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>'),
  wa:P('<path d="M3.5 20.5l1.3-4.2A8.5 8.5 0 1 1 8 19.4z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 .8a4 4 0 0 1-1.8-1.8l.8-1-1-2z"/>'),
  web:P('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/>'),
  crayon:P('<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/>'),
  photo:P('<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>'),
  aide:P('<circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.4M12 17v.4"/>'),
  cadenas:P('<rect x="5" y="11" width="14" height="10" rx="2.2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'),appareils:P('<rect x="2" y="5" width="13" height="10" rx="1.6"/><path d="M1 18.5h15"/><rect x="17" y="8" width="6" height="12" rx="1.6"/><path d="M19.6 17.4h.8"/>')
};
/* ---------- signalements : comme sur Waze, ce que les conducteurs voient sur la route ---------- */
const GS=(window.GuidageConakry&&GuidageConakry.SIGNALEMENTS)||{};
/* durée de vie (heures) et effet sur les itinéraires : route coupée ou inondée, jamais ; embouteillage, trois fois plus lent */
const REGLES={bouchon:{ttl:3,eviter:{r:180,facteur:3}},accident:{ttl:6,eviter:{r:90,facteur:2}},police:{ttl:2,eviter:{r:40,facteur:1.2}},travaux:{ttl:168,eviter:{r:70,facteur:2}},
  inondation:{ttl:24,eviter:{r:50,facteur:Infinity}},coupee:{ttl:72,eviter:{r:35,facteur:Infinity}},danger:{ttl:24,eviter:{r:40,facteur:1.3}}};
const SIGS=Object.fromEntries(Object.entries(REGLES).map(([k,v])=>[k,Object.assign({nom:k,c:'#64748b',ic:'<circle cx="12" cy="12" r="8"/>'},GS[k],v)]));
const svgSig=k=>`<svg viewBox="0 0 24 24" aria-hidden="true">${SIGS[k].ic}</svg>`;
const CLE_SIG='itina-geo-signalements';
let SIG=lire(CLE_SIG,[]);if(!Array.isArray(SIG))SIG=[];
const actifs=()=>{const n=Date.now();return SIG.filter(s=>s&&SIGS[s.type]&&isFinite(s.lat)&&isFinite(s.lng)&&n-(s.vu||s.t)<SIGS[s.type].ttl*3600000)};
const garderSig=()=>{SIG=actifs().slice(-200);ecrire(CLE_SIG,SIG)};
garderSig();
/* signalements partagés que j'ai dits « plus là » (ou effacés) : le service ne les remontre pas sur ce téléphone */
const CLE_MASQ='itina-geo-signalements-masques';
let MASQ=lire(CLE_MASQ,{});if(!MASQ||typeof MASQ!=='object'||Array.isArray(MASQ))MASQ={};
const garderMasq=()=>{const n=Date.now();for(const k in MASQ)if(!(n-MASQ[k]<8*86400000))delete MASQ[k];ecrire(CLE_MASQ,MASQ)};

/* ---------- ville. Dans l'ordre : celle d'un identifiant partagé (#GN-85002-… : Labé), même si le lien dit une autre ville ;
   celle d'une position partagée (#11.31,-12.28 : la ville la plus proche, à 50 km au plus) ; ?ville=labe ; la dernière ouverte ; Conakry ---------- */
const VILLES={conakry:{nom:'Conakry',dossier:'data/'},boke:{nom:'Boké',dossier:'data/boke/'},faranah:{nom:'Faranah',dossier:'data/faranah/'},kankan:{nom:'Kankan',dossier:'data/kankan/'},kindia:{nom:'Kindia',dossier:'data/kindia/'},labe:{nom:'Labé',dossier:'data/labe/'},mamou:{nom:'Mamou',dossier:'data/mamou/'},nzerekore:{nom:'N\'Zérékoré',dossier:'data/nzerekore/'},siguiri:{nom:'Siguiri',dossier:'data/siguiri/'}};
/* centre de chaque ville (les villes sont à plus de 100 km les unes des autres) */
const CENTRES={conakry:[9.6,-13.62],boke:[10.932,-14.291],faranah:[10.041,-10.743],kankan:[10.385,-9.306],kindia:[10.057,-12.866],labe:[11.318,-12.283],mamou:[10.375,-12.091],nzerekore:[7.756,-8.818],siguiri:[11.423,-9.169]};
/* code postal → ville : 81 Boké, 82 Faranah, 83 Kankan (Siguiri 83400), 84 Kindia, 85 Labé, 86 Mamou, 87 N'Zérékoré, 88-89 Conakry */
const PREFIXES=[['810','boke'],['820','faranah'],['830','kankan'],['834','siguiri'],['840','kindia'],['850','labe'],['860','mamou'],['870','nzerekore'],['88','conakry'],['89','conakry']];
/* les 33 préfectures du cadre national (lib/guinee.js, le même que Guinée Maps) : un préfixe de 3 chiffres chacune (Boffa 811, Pita 862…) */
const GMP=window.GuineeMaps&&Array.isArray(window.GuineeMaps.plans)?window.GuineeMaps.plans.filter(p=>p&&/^[a-z]+$/.test(p.code)):[];
for(const p of GMP){if(!VILLES[p.code])VILLES[p.code]={nom:p.nom,dossier:'data/'+p.code+'/'};if(!CENTRES[p.code])CENTRES[p.code]=p.centre;
  if(p.code!=='conakry'&&/^\d{3}$/.test(p.cp)&&!PREFIXES.some(x=>x[1]===p.code))PREFIXES.push([p.cp,p.code])}
const villeDuCode=id=>{const m=String(id||'').match(/^GN-(\d{5})-/i);if(!m)return null;const p=PREFIXES.find(([x])=>m[1].startsWith(x));return p?p[1]:null};
const villeDuPoint=(lat,lng)=>{if(!isFinite(lat)||!isFinite(lng))return null;let b=null,bd=50000;for(const[k,c]of Object.entries(CENTRES)){const d=distLL([+lat,+lng],c);if(d<bd){bd=d;b=k}}
  if(b)return b;
  /* loin d'un centre : la préfecture dont le carré contient le point (la plus proche s'il y en a plusieurs) */
  let m=null,md=Infinity;for(const p of GMP){const x=p.bbox;if(Array.isArray(x)&&+lat>=x[0]&&+lat<=x[2]&&+lng>=x[1]&&+lng<=x[3]){const d=distLL([+lat,+lng],p.centre);if(d<md){md=d;m=p.code}}}
  return m};
const aVille=k=>typeof k==='string'&&Object.prototype.hasOwnProperty.call(VILLES,k);
const dec=t=>{try{return decodeURIComponent(t)}catch(e){return t}};
/* liens d'une adresse : #GN-…@lat,lng (l'identifiant et l'épingle), #lat,lng (lieu sans rue proche), #GN-… (applis, anciens liens) */
const LIEN=/^(?:(GN-\d{5}-[A-Z0-9]{1,40}-\d{1,5})@)?(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)$/i;
const cleLien=(id,lat,lng)=>(id?id+'@':'')+(+lat).toFixed(6)+','+(+lng).toFixed(6);
const VILLE_MEMO='conakry-ville',lireMemo=()=>{try{return localStorage.getItem(VILLE_MEMO)}catch(e){return null}};
const H0=dec(location.hash.slice(1)),PT0=H0.match(LIEN);
let VILLE=villeDuCode(H0),deMemoire=false;
/* ville ouverte d'office (ni identifiant, ni position, ni ?ville= dans le lien) : le GPS peut ouvrir celle où l'on est */
const VILLE_IMPLICITE=!VILLE&&!PT0&&!new URLSearchParams(location.search).get('ville');
/* plans publiés connus de la dernière visite : un lien vers un endroit sans plan publié ne choisit pas ce plan-là */
const PUB0=(()=>{try{const x=JSON.parse(localStorage.getItem('itina-geo-publies')||'null');return Array.isArray(x)?x:null}catch(e){return null}})();
const LIEU_SEUL=new URLSearchParams(location.search).get('lieu')==='1'||(()=>{try{const x=sessionStorage.getItem('itina-lieu')==='1';sessionStorage.removeItem('itina-lieu');return x}catch(e){return false}})();
if(!aVille(VILLE)&&PT0&&!LIEU_SEUL){const c=villeDuPoint(+PT0[2],+PT0[3]);if(!PUB0||PUB0.includes(c))VILLE=c}
if(!aVille(VILLE))VILLE=new URLSearchParams(location.search).get('ville');
if(!aVille(VILLE)&&(location.hash.length<2||PT0)&&aVille(lireMemo())){VILLE=lireMemo();deMemoire=true}
if(!aVille(VILLE))VILLE='conakry';
try{localStorage.setItem(VILLE_MEMO,VILLE)}catch(e){}
/* l'adresse de la page dit la ville affichée, quand un identifiant ou une position d'une autre ville est passé avant ?ville= */
if(!window.ITINA_DEMO){const q=new URLSearchParams(location.search);if(q.has('ville')&&q.get('ville')!==VILLE){q.set('ville',VILLE);try{history.replaceState(null,'',location.pathname+'?'+q+location.hash)}catch(e){}}}
/* la ville est toujours écrite dans les liens (partage, autres pages du site) */
const VI=VILLES[VILLE],SUFFIXE='?ville='+VILLE;
const lienVille=(code,h)=>'./?ville='+encodeURIComponent(code)+(h||'');
/* changer de ville. Version d'essai (artefact) : la ville passe par l'appareil, ?ville= est retiré de l'adresse de la page
   (sinon il rouvrirait la même ville) et la page se recharge sur le même lien (#…) */
function allerVille(code,h){
  if(!aVille(code))return;
  h=h&&h.length>1?h:'';
  if(window.ITINA_DEMO){let gardee=false;try{localStorage.setItem(VILLE_MEMO,code);gardee=true}catch(e){}
    if(gardee||villeDuCode(dec(h.slice(1)))===code||(h&&(m=>m&&villeDuPoint(+m[2],+m[3])===code)(dec(h.slice(1)).match(LIEN)))){history.replaceState(null,'',location.pathname+h);location.reload();return}}
  location.href=lienVille(code,h);
}
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href^="./?ville="]');if(!a||!window.ITINA_DEMO)return;e.preventDefault();const u=new URL(a.getAttribute('href'),location.href);allerVille(u.searchParams.get('ville'),u.hash)});
let VLIST=null;

/* ---------- réglages (gardés sur l'appareil) ---------- */
const REG=Object.assign({theme:'auto',sat:false,grille:false,circ:false,lim:true,tram:false,couleur:'plan',annonces:true,mode:'voiture',eviter:true,bis:true,alertes:true,auto:true},lire('itina-geo-reglages',{}));
(()=>{const r=lire('conakry-rendu',null);if(r&&!localStorage.getItem('itina-geo-reglages')){if(r.mode==='suivi')REG.couleur='suivi';for(const k of['grille','circ','lim','tram'])if(typeof r[k]==='boolean')REG[k]=r[k]}})();
if(!['voiture','moto','pied'].includes(REG.mode))REG.mode='voiture';
const garderReg=()=>ecrire('itina-geo-reglages',REG);
/* lieux : domicile, travail, enregistrés, récents (sur l'appareil seulement) */
const LIEUX=Object.assign({domicile:null,travail:null,favoris:[],recents:[]},lire('itina-geo-lieux',{}));
for(const k of['favoris','recents'])if(!Array.isArray(LIEUX[k]))LIEUX[k]=[];
const garderLieux=()=>{ecrire('itina-geo-lieux',LIEUX);synchroPlus()};
const lieuDe=a=>({t:a.ligne1,s:a.ligne2,id:a.id||null,v:VILLE,lat:+a.position.lat.toFixed(6),lng:+a.position.lng.toFixed(6)});
const memeLieu=(x,y)=>x&&y&&(x.id&&y.id?x.id===y.id:Math.abs(x.lat-y.lat)<2e-5&&Math.abs(x.lng-y.lng)<2e-5);
/* ville d'un lieu gardé : notée depuis le 15 novembre 2026 ; pour les plus anciens, d'après l'identifiant (GN-85… : Labé) ou la position */
const villeDe=o=>!o?null:aVille(o.v)?o.v:villeDuCode(o.id)||villeDuPoint(o.lat,o.lng);
const ailleurs=o=>{const v=villeDe(o);return v&&v!==VILLE?v:null};
/* adresse d'un lieu gardé ou d'un lien (identifiant et épingle) : l'épingle reste où elle a été posée ; le nom et le numéro restent
   ceux de l'identifiant tant qu'il désigne le même endroit (au bout d'une rue, le point d'un numéro peut être plus près de la rue qui croise) */
function adresseLien(id,lat,lng){
  if(!ref)return null;
  const p=isFinite(lat)&&isFinite(lng)&&lat!==null&&lng!==null?ref.adresse(+lat,+lng):null;
  if(p&&(!id||p.id===id))return p;
  const q=id?ref.position(id):null;
  if(q&&(!p||distLL([q.position.lat,q.position.lng],[+lat,+lng])<25))return q;
  return p||q||null;
}
const adresseDe=o=>!o||ailleurs(o)?null:adresseLien(o.id,o.lat,o.lng);
const nomVilleDe=o=>{const v=ailleurs(o);return v&&!String(o.s||'').includes(VILLES[v].nom)?' · '+VILLES[v].nom:''};
/* ouvrir un lieu gardé : ici, ou dans le plan de sa ville (la page change de ville et rouvre l'épingle) */
function ouvrirGarde(o,route){
  if(!o)return;
  const v=ailleurs(o);
  if(v){toast('Ouverture du plan de '+VILLES[v].nom+'…');allerVille(v,'#'+cleLien(o.id,o.lat,o.lng));return}
  const a=adresseDe(o);
  if(!a){toast('Adresse introuvable sur ce plan : choisissez-la à nouveau.');return}
  if(route)startRoute(a);else showAddress(a,'liste');
}
const ajouterRecent=a=>{if(!a||!a.position)return;const o=lieuDe(a);LIEUX.recents=[o].concat(LIEUX.recents.filter(x=>!memeLieu(x,o))).slice(0,12);garderLieux()};
const estFavori=a=>a&&LIEUX.favoris.some(x=>memeLieu(x,lieuDe(a)));

/* ---------- thème : jour, nuit, ou automatique (nuit de 19 h à 7 h, ou si le téléphone est en mode sombre) ---------- */
const themeEffectif=()=>{if(REG.theme==='jour')return'light';if(REG.theme==='nuit')return'dark';const h=new Date().getHours();return matchMedia('(prefers-color-scheme: dark)').matches||h>=19||h<7?'dark':'light'};
const poserTheme=()=>{const t=themeEffectif();document.documentElement.dataset.theme=t;const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==='dark'?'#1b222c':'#12a05c';return t};
poserTheme();
/* erreur de démarrage : une explication et des boutons de retour, au lieu d'un chargement sans fin */
function erreurDemarrage(titre,texte,retour){
  $('status').hidden=false;
  $('status').innerHTML=`<div><h3>${esc(titre)}</h3><p class="hint">${texte}</p><p class="err-act"><button class="bt vert" type="button" id="stRe">Réessayer</button>${retour&&VILLE!=='conakry'?`<a class="bt" href="./?ville=conakry">Carte de Conakry</a>`:''}</p></div>`;
  $('stRe').onclick=()=>location.reload();
}
if(!window.maplibregl||!CA){erreurDemarrage('La carte ne peut pas démarrer','Un fichier de la carte n\'a pas pu être chargé. Vérifiez la connexion internet et utilisez un navigateur récent (Chrome, Safari, Edge).');return}
$('status').querySelector('.hint').textContent='Chargement du plan de '+VI.nom+'…';

/* ---------- carte ---------- */
/* version d'essai (artefact) : ni fond de carte distant, ni GPS, ni appli hors ligne */
const SANS_FOND=!!window.ITINA_SANS_FOND,DEMO=!!window.ITINA_DEMO;
const ESRI='https://server.arcgisonline.com/ArcGIS/rest/services/';

   son plan (Labé, Kindia…) : d'abord ses rues jusqu'à la sortie de la ville, puis la route (guidage en trois temps, de porte à porte).

function reseauPays(){

/* départ d'une autre ville qui a son plan des rues (Labé, Kindia…) : ses rues jusqu'à la sortie de la ville, puis la route.

/* où poser la bulle d'un trajet : là où il s'écarte le plus des autres (au milieu s'il est seul) */
function pointBulle(rs,i){

/* le moment signature du design : un nouveau trajet s'allume, une lumière le parcourt du départ à l'arrivée (une seule fois, 1,2 s) ;
   ensuite il reste bleu électrique avec sa lueur. allumer(clé) : nouvelle clé = nouvelle traversée ; allumer(null) : repeindre (thème) */

function degradeRoute(t){
  const c=css('--route'),tete=themeEffectif()==='dark'?'#e6fdff':'#9fd0ff',rien='rgba(0,0,0,0)';

  const b=Math.max(.002,Math.min(t,.996)),a=b-.08,L=['interpolate',['linear'],['line-progress'],0,a>0?c:tete];

function allumer(cle){

const ICT={adresse:I.lieu,voie:I.rue,quartier:I.quartier,commune:I.ville,pluscode:I.code,position:I.gps};
/* ---------- chercher dans toute la Guinée ----------
   Depuis Labé, on trouve aussi une adresse de Conakry : « Kipé », « Rue Nana Asmaou », un code postal 88…, un identifiant GN-…
   Les petits index des autres plans (noms des quartiers et des communes, quelques Ko) disent de quelle ville il s'agit ; le plan
   de cette ville est alors chargé à la demande (deux au plus en mémoire, gardés ensuite pour le hors-ligne) et ses adresses
   s'affichent avec le nom de la ville. Sinon, des puces « Chercher à : Conakry, Kindia… » le proposent.
   Toucher un résultat ouvre ce plan sur la porte ; « Y aller » guide ensuite depuis l'endroit où l'on est. */
const AUTRES=new Map(),RES_AILLEURS=new Map(),NOMS_AILLEURS=new Map();let IDX_AUTRES=null,CHOIX_AILLEURS=null;

const autresVilles=()=>(VLIST||[]).filter(v=>v&&aVille(v.code)&&v.code!==VILLE);

function indexAutres(){
  if(IDX_AUTRES)return IDX_AUTRES;
  if(!VLIST)return Promise.resolve();
  const l=autresVilles();l.forEach(v=>nomAilleurs(VILLES[v.code].nom,v.code));
  IDX_AUTRES=Promise.all(l.map(v=>fetch(new URL(VILLES[v.code].dossier+'index.json',location.href).href).then(r=>r.ok?r.json():null).then(ix=>{if(!ix)return;
    couvertureAutres(ix,v.code);(ix.communes||[]).forEach(c=>nomAilleurs(c&&c.nom,v.code));(ix.quartiers||[]).forEach(q=>nomAilleurs(Array.isArray(q)?q[0]:q&&q.nom,v.code))}).catch(()=>{})))
    .then(()=>{const q=$('q');if(q&&!$('recherche').hidden&&q.value.trim())rendreResultats()});
  return IDX_AUTRES;
}
function planAutre(code){
  if(!AUTRES.has(code)){if(AUTRES.size>=2)AUTRES.delete(AUTRES.keys().next().value);
    const pr=CA.charger({base:new URL(VILLES[code].dossier,location.href).href});pr.catch(()=>AUTRES.delete(code));AUTRES.set(code,pr)}

/* quelles villes la recherche vise : identifiant GN-… ou code postal (sûr), sinon un nom de ville, de commune ou de quartier */
function villesVisees(v){
  const par=c=>c&&c!==VILLE&&autresVilles().some(x=>x.code===c)?c:null,id=v.toUpperCase().match(/GN-\d{5}-[A-Z0-9]{1,40}-\d{1,5}/),cp=v.match(/(?:^|\D)(\d{5})(?!\d)/);
  if(id){const c=par(villeDuCode(id[0]));if(c)return{codes:[c],fort:true}}

  for(const [k,set] of NOMS_AILLEURS)if(n.includes(' '+k+' '))for(const c of set)if(par(c))vus.set(c,Math.max(vus.get(c)||0,k.length));

/* les autres villes : celles visées d'abord, puis Conakry, puis les plus proches */
function ordreAutres(premiers){
  const o=mePos?[mePos.lat,mePos.lng]:CENTRES[VILLE],d=c=>o&&CENTRES[c]?distLL(o,CENTRES[c]):0,rg=c=>{const i=premiers.indexOf(c);return i<0?99:i};
  return autresVilles().map(v=>v.code).sort((a,b)=>rg(a)-rg(b)||((b==='conakry')-(a==='conakry'))||d(a)-d(b));

const sansNomVille=(v,code)=>{const n=NORM(VILLES[code].nom),w=v.split(/\s+/);if(!w.some(x=>NORM(x)===n))return v;return w.filter(x=>NORM(x)!==n&&!/^(à|a)$/i.test(x)).join(' ')};

      RES_AILLEURS.set(k,r2.chercher(q,{max:8}).map(r=>{if(!r.adresse&&r.type!=='quartier'&&r.type!=='commune'){const a=r2.adresse(r.lat,r.lng);if(a)r.adresse=a}return r}))},

      :st.length?`<ul class="liste">${st.map((r,i)=>{const t=r.adresse?r.adresse.ligne1:r.libelle.split(' · ')[0],x=r.adresse?r.adresse.ligne2:r.libelle.split(' · ').slice(1).join(' · ')||r.type;

  const reste=ordreAutres(vis.codes).filter(c=>c!==code);

const erreurA=(c,m)=>{const p=$('fAjout')&&$('fAjout').querySelector(`[data-err="${c}"]`);if(p)p.textContent=m};

const codeLocal=()=>{const a='ABCDEFGHJKMNPQRSTUVWXYZ23456789',o=new Uint8Array(12);try{crypto.getRandomValues(o)}catch(e){for(let i=0;i<12;i++)o[i]=Math.random()*256}const c=[...o].map(x=>a[x%a.length]).join('');return c.slice(0,4)+'-'+c.slice(4,8)+'-'+c.slice(8)};
async function poster(route,corps,ms){
  const r=await fetch(CONNECT.lieux+route,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(corps),signal:delai(ms||10000)});
  const j=await r.json().catch(()=>null);return{r,j};
}
async function envoyerFiche(f,piege){
  const m={id:'L-local-'+hasardId(8),code:null,ville:VILLE,fiche:f,statut:'en_attente',envoye:Date.now(),local:true};
  if(CONNECT&&!DEMO){
    try{const {r,j}=await poster('/v1/proposer',{fiche:f,piege:piege||undefined});
      if(r.status===201&&j&&j.id){m.id=j.id;m.code=j.code;m.statut=j.statut;delete m.local}
      else if(r.status===409&&j&&j.erreur&&j.erreur.code==='DOUBLON'){return{doublon:j.erreur.existant&&j.erreur.existant.id}}
      else if(r.status===400&&j&&j.erreur&&j.erreur.champs){return{erreurs:j.erreur.champs}}
      else if(j&&j.erreur&&(j.erreur.code==='FICHE_INVALIDE'||r.status===429)){return{message:j.erreur.message}}
      else throw new Error('HTTP '+r.status)}               /* service mal branché ou indisponible : gardée, elle partira plus tard */
    catch(e){m.statut='a_envoyer'}                         /* pas de réseau : la fiche partira toute seule plus tard */
  }else if(!DEMO)m.statut='a_envoyer';
  else m.code=codeLocal();
  if(m.fiche.contact&&m.statut!=='a_envoyer'){m.fiche=Object.assign({},m.fiche);delete m.fiche.contact}
  MES.push(m);garderMes();fusion();return{m};
}
async function envoyerModif(l,f){
  const m=MES.find(x=>x.id===l.id);if(!m)return{message:'Fiche introuvable sur ce téléphone.'};
  if(m.local){m.fiche=Object.assign({},f);delete m.fiche.contact;garderMes();fusion();return{m}}
  if(!CONNECT){return{message:'Le service des fiches n\'est pas encore branché sur ce site.'}}
  try{const {r,j}=await poster('/v1/modifier',{id:m.id,code:m.code,fiche:f});
    if(r.ok){m.modif=Object.assign({},f);delete m.modif.contact;garderMes();return{m}}
    if(r.status===403){MES=MES.filter(x=>x!==m);garderMes();return{message:'Code de propriétaire incorrect.'}}
    if(r.status===400&&j&&j.erreur&&j.erreur.champs)return{erreurs:j.erreur.champs};
    return{message:(j&&j.erreur&&j.erreur.message)||'Envoi impossible pour l\'instant.'};
  }catch(e){return{message:'Pas de connexion : réessayez plus tard.'}}
}
/* fiches gardées sans réseau : envoyées dès que le service répond */
let envoiEnCours=false;
async function envoyerEnAttente(){
  if(!CONNECT||DEMO||envoiEnCours)return;envoiEnCours=true;
  try{for(const m of MES.filter(x=>x.statut==='a_envoyer')){
    try{const {r,j}=await poster('/v1/proposer',{fiche:Object.assign({ville:m.ville},m.fiche)});
      if(r.status===201&&j&&j.id){const avant=m.id;m.id=j.id;m.code=j.code;m.statut=j.statut;delete m.local;m.fiche=Object.assign({},m.fiche);delete m.fiche.contact;m.nouveauCode=true;
        const ph=await phLire(avant);if(ph.length){await phEcrire(m.id,ph);await phEcrire(avant,[])}}
      else if(j&&j.erreur&&(j.erreur.code==='FICHE_INVALIDE'||j.erreur.code==='DOUBLON')){m.statut='retire';m.erreur=j.erreur.message||'refusée'}
      else break;                                           /* service mal branché (401, 403, 404…) ou indisponible : la fiche reste, elle repartira */
    }catch(e){break}
  }}finally{envoiEnCours=false;garderMes();fusion()}
}
/* ---------- signalements partagés (Itina Geo Connect) : ceux de tous les conducteurs de la ville ----------
   Seuls le type et l'endroit de l'incident partent, jamais le nom, la position ou un identifiant du téléphone. */
let sigMinuteur=0;
async function envoyerSignal(x){
  const ici=()=>SIG.find(z=>z.id===x.id);
  try{const {r,j}=await poster('/v1/signalement',{ville:x.v||VILLE,type:x.type,lat:x.lat,lng:x.lng},10000);
    const y=ici();if(!y)return;
    if((r.status===201||r.status===200)&&j&&typeof j.id==='string'){SIG=SIG.filter(z=>z===y||z.sid!==j.id);y.sid=j.id;delete y.attente}
    else if(r.status>=400&&r.status<500&&r.status!==429)delete y.attente;
    else y.attente=true;
  }catch(e){const y=ici();if(y)y.attente=true}
  garderSig();
}
async function chargerSignaux(){
  if(!CONNECT||DEMO||document.hidden)return;
  for(const x of SIG.filter(y=>y.attente&&!y.sid&&y.par==='moi'))await envoyerSignal(x);   /* faits sans connexion */
  let j;try{const r=await fetch(CONNECT.lieux+'/v1/signalements?ville='+encodeURIComponent(VILLE),{signal:delai(8000)});if(!r.ok)return;j=await r.json()}catch(e){return}
  const L=j&&Array.isArray(j.signalements)?j.signalements:null;if(!L)return;
  const vus=new Set(),n=Date.now();
  for(const s of L.slice(0,2000)){
    if(!s||typeof s.id!=='string'||!/^S-[a-z2-9]{10}$/.test(s.id)||!SIGS[s.type]||!isFinite(s.lat)||!isFinite(s.lng))continue;
    vus.add(s.id);if(MASQ[s.id])continue;
    const t=Math.min(+s.t||n,n),vu=Math.min(Math.max(+s.vu||t,t),n),x=SIG.find(y=>y.sid===s.id);
    if(x){if(vu>(x.vu||x.t))x.vu=vu}
    else SIG.push({id:'p-'+s.id,sid:s.id,type:s.type,lat:+(+s.lat).toFixed(6),lng:+(+s.lng).toFixed(6),t,vu,par:'autre',v:VILLE});
  }
  SIG=SIG.filter(y=>!(y.sid&&(y.v||VILLE)===VILLE&&!vus.has(y.sid)));          /* fini ou retiré pour tous */
  garderSig();dessinerSignaux();
}
/* « Toujours là ? » : la réponse met à jour ce téléphone et, s'il est partagé, le signalement de tous */
function avisSignal(id,encore){
  const x=SIG.find(y=>y.id===id);if(!x)return;
  if(encore)x.vu=Date.now();else{SIG=SIG.filter(y=>y!==x);if(x.sid){MASQ[x.sid]=Date.now();garderMasq()}}
  garderSig();
  if(x.sid&&CONNECT&&!DEMO)poster('/v1/signalement/avis',{id:x.sid,ville:x.v||VILLE,encore:!!encore}).catch(()=>{});
}
function partageDemarrer(){
  if(!CONNECT||DEMO)return;
  chargerSignaux();clearInterval(sigMinuteur);sigMinuteur=setInterval(chargerSignaux,180000);
  document.addEventListener('visibilitychange',()=>{if(document.hidden){if(synMin){clearTimeout(synMin);synMin=0;synchroniser()}}else{chargerSignaux();synchroPlus(1500)}});
  if(SYN)synchroPlus(800);
  setInterval(()=>{if(!document.hidden)synchroPlus(0)},300000);
}

/* ---------- mes appareils : synchronisation par code, sans compte (Itina Geo Connect) ----------
   Domicile, travail, lieux enregistrés et mes établissements (avec leurs codes de propriétaire) passent d'un appareil à l'autre.
   Chiffré sur l'appareil (AES-GCM, clé tirée du code par PBKDF2) : le service ne reçoit qu'un texte illisible et une empreinte du code.
   Fusion à trois (dernier état commun, cet appareil, les autres) : un ajout ou un changement fait ailleurs n'efface rien ici. */
const CLE_SYN='itina-geo-synchro',SYN_A='ABCDEFGHJKMNPQRSTUVWXYZ23456789',SYN_RE=/^[A-HJKMNP-Z2-9]{16}$/;

async function clesSyn(code){
  if(SYN_CLES.has(code))return SYN_CLES.get(code);

  const acces=[...new Uint8Array(await S.digest('SHA-256',te.encode('itina-synchro-acces:'+code)))].map(x=>x.toString(16).padStart(2,'0')).join('');
  const k=await S.deriveKey({name:'PBKDF2',salt:te.encode('itina-synchro-chiffre:v1'),iterations:150000,hash:'SHA-256'},await S.importKey('raw',te.encode(code),'PBKDF2',false,['deriveKey']),{name:'AES-GCM',length:256},false,['encrypt','decrypt']);

async function chiffrerSyn(k,o){

}
/* ce qui voyage : jamais l'historique (récents), jamais une fiche pas encore envoyée (elle part de son appareil) */
const SYN_CHAMPS=['id','code','ville','fiche','statut','envoye','modif','erreur'];
const synLieu=x=>x&&typeof x==='object'&&isFinite(x.lat)&&isFinite(x.lng)&&Math.abs(x.lat)<=90&&Math.abs(x.lng)<=180?{t:String(x.t||'').slice(0,160),s:String(x.s||'').slice(0,200),id:typeof x.id==='string'?x.id.slice(0,60):null,v:typeof x.v==='string'?x.v.slice(0,20):null,lat:+x.lat,lng:+x.lng}:null;
const synVoyage=m=>m&&typeof m.id==='string'&&ID_ETAB.test(m.id)&&!/^L-local-/.test(m.id)&&!m.local&&m.statut!=='a_envoyer'&&m.fiche&&typeof m.fiche==='object';
const synMien=m=>{const o={};for(const k of SYN_CHAMPS)if(m[k]!==undefined&&m[k]!==null)o[k]=m[k];return o};
const etatSyn=()=>({format:'itina-synchro',v:1,lieux:{domicile:synLieu(LIEUX.domicile),travail:synLieu(LIEUX.travail),favoris:LIEUX.favoris.map(synLieu).filter(Boolean).slice(0,50)},mes:MES.filter(synVoyage).map(synMien)});
const synPropre=o=>{const l=o&&o.lieux&&typeof o.lieux==='object'?o.lieux:{};
  return{format:'itina-synchro',v:1,lieux:{domicile:synLieu(l.domicile),travail:synLieu(l.travail),favoris:(Array.isArray(l.favoris)?l.favoris:[]).map(synLieu).filter(Boolean).slice(0,50)},
    mes:(Array.isArray(o&&o.mes)?o.mes:[]).filter(m=>synVoyage(m)&&typeof m.fiche.nom==='string'&&isFinite(m.fiche.lat)&&isFinite(m.fiche.lng)&&typeof m.ville==='string'&&/^[a-z]{2,20}$/.test(m.ville)).slice(-100).map(synMien)}};
function fusion3(B,L,R,cle){
  const mB=new Map(B.map(x=>[cle(x),x])),mL=new Map(L.map(x=>[cle(x),x])),mR=new Map(R.map(x=>[cle(x),x])),eq=(a,b)=>canon(a)===canon(b),g=new Map();
  for(const k of new Set([...mB.keys(),...mL.keys(),...mR.keys()])){

    if(l&&r)v=eq(l,r)||eq(r,b)?l:eq(l,b)?r:l;          /* changé des deux côtés : celui de cet appareil */
    else if(l)v=b&&eq(l,b)?null:l;                     /* retiré ailleurs, pas changé ici : retiré */
    else if(r)v=b&&eq(r,b)?null:r;                     /* retiré ici, pas changé ailleurs : retiré */
    if(v)g.set(k,v);

}
const fusion1=(b,l,r)=>{const eq=(x,y)=>canon(x)===canon(y);return eq(l,r)||eq(r,b)?l:eq(l,b)?r:l};
function fusionSyn(B,L,R){
  const vide={lieux:{domicile:null,travail:null,favoris:[]},mes:[]};B=B&&B.lieux?B:vide;R=R&&R.lieux?R:vide;
  const cleF=x=>x.id||x.lat.toFixed(5)+','+x.lng.toFixed(5),gF=fusion3(B.lieux.favoris,L.lieux.favoris,R.lieux.favoris,cleF);

  const fav=[],vu=new Set(),dansB=new Set(B.lieux.favoris.map(cleF)),pousser=x=>{const k=cleF(x);if(gF.has(k)&&!vu.has(k)){vu.add(k);fav.push(gF.get(k))}};
  L.lieux.favoris.filter(x=>!dansB.has(cleF(x))).forEach(pousser);R.lieux.favoris.forEach(pousser);L.lieux.favoris.forEach(pousser);
  const gM=fusion3(B.mes||[],L.mes||[],R.mes||[],m=>m.id);
  return{format:'itina-synchro',v:1,lieux:{domicile:fusion1(B.lieux.domicile,L.lieux.domicile,R.lieux.domicile),travail:fusion1(B.lieux.travail,L.lieux.travail,R.lieux.travail),
    favoris:fav.filter((x,i)=>!fav.slice(0,i).some(y=>memeLieu(x,y))).slice(0,50)},
    mes:[...gM.values()].sort((a,b)=>(a.envoye||0)-(b.envoye||0)||(a.id<b.id?-1:1)).slice(-100)};
}
function appliquerSyn(M){
  synApplique=true;
  try{
    if(canon(etatSyn().lieux)!==canon(M.lieux)){LIEUX.domicile=M.lieux.domicile;LIEUX.travail=M.lieux.travail;LIEUX.favoris=M.lieux.favoris.map(x=>Object.assign({},x));garderLieux();if(feuille.dataset.vue==='accueil')accueil()}
    const parId=new Map(MES.map(m=>[m.id,m])),nouveaux=[];
    for(const x of M.mes){const m=parId.get(x.id);if(m&&synVoyage(m)){for(const k of SYN_CHAMPS)if(!(k in x))delete m[k];Object.assign(m,JSON.parse(JSON.stringify(x)));nouveaux.push(m)}else if(!m)nouveaux.push(JSON.parse(JSON.stringify(x)))}
    const avant=canon(MES.filter(synVoyage).map(synMien));
    MES=MES.filter(m=>!synVoyage(m)).concat(nouveaux).sort((a,b)=>(a.envoye||0)-(b.envoye||0));
    if(canon(MES.filter(synVoyage).map(synMien))!==avant){garderMes();if(GL&&ref)fusion()}
  }finally{synApplique=false}
}
function synchroniser(opt){
  if(!synEnCours)synEnCours=synTour(opt||{}).finally(()=>{synEnCours=null});
  return synEnCours;
}
const texteEtatSyn=()=>!SYN?'':SYN.etat==='hors_ligne'?'Pas de connexion : elle reprendra toute seule.':SYN.etat==='erreur'?(SYN.msg||'Erreur'):SYN.maj?'Synchronisé '+ilya(SYN.maj):'En cours…';
function synFin(moi,ok,msg,etat){
  if(SYN===moi){if(ok){moi.maj=Date.now();moi.etat='ok';delete moi.msg;synVu=canon(etatSyn())}else{moi.etat=etat||'erreur';moi.msg=msg}if(moi.maj)garderSyn()}
  const z=$('synEtat');if(z)z.textContent=texteEtatSyn();

async function synTour(opt){
  const moi=SYN;if(!moi||!CONNECT||DEMO)return{ok:false,message:'Le service en ligne n\'est pas branché.'};
  try{
    const {acces,k}=await clesSyn(moi.code);
    let {r,j}=await poster('/v1/synchro/lire',{cle:acces},12000),R=null,v=0;
    if(r.status===200&&j&&typeof j.donnees==='string'){R=synPropre(await dechiffrerSyn(k,j.donnees));v=j.version|0}
    else if(r.status===404){if(opt.rejoindre)return synFin(moi,false,'Ce code n\'existe pas : vérifiez-le, ou créez-le sur l\'appareil qui a déjà vos lieux.')}
    else return synFin(moi,false,(j&&j.erreur&&j.erreur.message)||'Service indisponible ('+r.status+').');
    if(opt.creer&&R)return synFin(moi,false,'Ce code est déjà pris : réessayez.');
    for(let essai=0;essai<4;essai++){
      if(SYN!==moi)return{ok:false};
      const M=fusionSyn(moi.base,etatSyn(),R);
      appliquerSyn(M);
      if(R&&canon(M)===canon(R)){moi.base=M;moi.version=v;return synFin(moi,true)}
      let d=await chiffrerSyn(k,M);
      while(d.length>120000&&M.mes.length){M.mes.shift();d=await chiffrerSyn(k,M)}
      ({r,j}=await poster('/v1/synchro/ecrire',{cle:acces,donnees:d,version:v},15000));
      if(SYN!==moi)return{ok:false};
      if((r.status===200||r.status===201)&&j){moi.base=M;moi.version=j.version|0;return synFin(moi,true)}

      return synFin(moi,false,(j&&j.erreur&&j.erreur.message)||'Service indisponible ('+r.status+').');
    }

  }catch(e){return /illisibles/.test(e&&e.message)?synFin(moi,false,e.message):synFin(moi,false,'Pas de connexion.','hors_ligne')}
}
/* après un changement (domicile, enregistré, établissement) : envoi 4 secondes plus tard, une seule fois pour plusieurs changements */
