<script>if(window.top!==window.self){document.documentElement.style.display='none';try{window.top.location=window.self.location.href}catch(e){}}</script>
<style>
html,body{height:100%;overflow:hidden}
#map{position:fixed;inset:0;background:var(--paper)}
.top{position:fixed;z-index:20;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(12px,env(safe-area-inset-left,0px));width:min(420px,calc(100vw - 24px))}
.find{display:flex;align-items:center;gap:4px;background:var(--panel);border-radius:999px;box-shadow:0 2px 12px rgba(0,0,0,.25);padding:4px 4px 4px 16px;height:52px}
.find input{border:0;background:transparent;min-height:44px;padding:0;font-size:16px;flex:1;min-width:0;outline-offset:-2px}
.find .btn{border-radius:999px;min-height:44px}
.sugg{list-style:none;margin:8px 0 0;padding:6px;background:var(--panel);border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.22);max-height:min(60vh,420px);overflow:auto}
.sugg li button{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:1px;width:100%;padding:9px 10px;border-radius:10px;cursor:pointer}
.sugg li button:hover,.sugg li button[aria-selected="true"]{background:var(--green-soft)}
.sugg b{font-weight:600}.sugg small{color:var(--muted);font-size:12px}
.sugg .empty{padding:10px;color:var(--muted);font-size:14px}
.card{position:fixed;z-index:15;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(420px,calc(100vw - 24px));max-height:min(58vh,560px);overflow:auto;background:var(--panel);border-radius:18px;box-shadow:0 6px 28px rgba(0,0,0,.28);padding:16px}
.eyebrow{font:600 13px/1.3 var(--body);color:var(--muted);display:flex;align-items:center;gap:7px}
.eyebrow.ici::before{content:"";width:10px;height:10px;border-radius:50%;background:#2a7de1;box-shadow:0 0 0 3px rgba(42,125,225,.25);flex:none}
.eyebrow.tram::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--panel);border:2.5px solid var(--tram);box-sizing:border-box;flex:none}
.card h1{font:800 24px/1.15 var(--display);margin:2px 0 4px;text-wrap:balance}
.card .intro{margin:0;font-size:15px}
.chiffres{margin:12px 0 0;font-size:13px;color:var(--muted)}
.avert{margin:4px 0 0;font-size:13px;color:var(--muted)}
.avert summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--warn);min-height:28px}
.avert summary::-webkit-details-marker{display:none}
.avert summary::after{content:"";width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .15s}
.avert[open] summary::after{transform:rotate(-135deg) translateY(-1px)}
.avert p{margin:4px 0 0;line-height:1.45}
.liens{display:flex;flex-wrap:wrap;gap:4px 18px;margin:12px 0 0;font-size:14px}
.liens a{font-weight:600;text-decoration:none;min-height:28px;display:inline-flex;align-items:center}
.liens a:hover{text-decoration:underline}
.btn.big{min-height:48px;font-size:15px}
.btn svg{flex:none}
.card h2{font:800 21px/1.2 var(--display);margin:2px 0 4px}
.l2{font-size:15px;color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.chip{font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;padding:5px 9px;border-radius:7px;background:var(--green-soft);color:var(--green);border:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:30px;max-width:100%;overflow-wrap:anywhere;text-align:left}
.chip svg{flex:none;opacity:.75}
.chip.pc{background:var(--soft);color:var(--fg)}
.st{font-size:13px;color:var(--muted);margin:6px 0 0}
.st.prov{color:var(--warn)}
.ded{margin:8px 0 0;padding:8px 10px;border-left:3px solid var(--quartier);background:color-mix(in srgb,var(--quartier) 7%,transparent);border-radius:0 8px 8px 0;font-size:13px;line-height:1.4;color:var(--fg)}
.ded b{font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.row .btn{flex:1 1 auto}
.villes{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}.villes a{font:600 13px var(--body);padding:6px 11px;border-radius:999px;border:1px solid var(--line);color:var(--fg);text-decoration:none;background:var(--panel)}.villes a[aria-current="page"]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--soft);padding:4px;border-radius:12px;margin:10px 0}
.modes button{all:unset;text-align:center;padding:9px 4px;border-radius:9px;font:600 14px var(--body);cursor:pointer;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--panel);color:var(--green);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.sum{display:flex;gap:14px;align-items:baseline}.sum b{font:800 26px var(--display)}.sum span{color:var(--muted);font-size:14px}
.pts{display:grid;grid-template-columns:14px 1fr;gap:6px 10px;align-items:center;font-size:14px;margin:6px 0}
.pts i{width:12px;height:12px;border-radius:50%;display:block}
.lien{all:unset;cursor:pointer;color:var(--green);font-weight:600;font-size:13px;margin-left:10px;padding:4px 0}.lien:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:4px}.pts .a{background:var(--blue)}.pts .b{background:var(--red)}
.steps{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--line)}
.steps li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.steps li span:last-child{color:var(--muted);white-space:nowrap}
.fabs{position:fixed;z-index:15;right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;align-items:flex-end;gap:10px}
:root{--street-prop:#0f7a46;--street-keep:#3e5a8a;--street-todo:#b9a07a;--circ:#d9650b;--tram:#7b2d8e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--street-prop:#3fc483;--street-keep:#8fb0ea;--street-todo:#8a7a60;--circ:#ff9a45;--tram:#d08be6}}
:root[data-theme="dark"]{--street-prop:#3fc483;--street-keep:#8fb0ea;--street-todo:#8a7a60;--circ:#ff9a45;--tram:#d08be6}
/* menu « Rendu », comme sur la carte de Kaloum */
.rendu{background:var(--panel);border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.28);max-width:min(250px,calc(100vw - 24px))}
.rendu>button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:44px;padding:0 14px;font:800 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rendu>button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:14px}
.rendu .rb{display:grid;gap:9px;padding:2px 14px 13px;font-size:14px;max-height:calc(100vh - env(safe-area-inset-top,0px) - 250px);overflow:auto}
@media (max-width:640px){.rendu .rb{max-height:calc(100vh - env(safe-area-inset-top,0px) - var(--card,140px) - 230px)}}
.rendu label{display:flex;gap:9px;align-items:center;cursor:pointer;font-weight:500;min-height:26px}
.rendu input{width:18px;height:18px;margin:0;accent-color:var(--green);flex:none}
.rleg{display:grid;gap:4px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}.rleg i{display:inline-block;width:20px;height:5px;border-radius:3px;margin-right:7px;vertical-align:middle}
.tram-info b{color:var(--tram)}
.fab{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;border:0;background:var(--panel);color:var(--fg);box-shadow:0 2px 10px rgba(0,0,0,.28);cursor:pointer;font:700 12px var(--body)}
.fab[aria-pressed="true"]{background:var(--green);color:var(--on-green)}
.toast{position:fixed;z-index:40;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 76px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.status{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 85%,transparent);padding:24px;text-align:center}
.status div{max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
.status h3{font:800 19px var(--display);margin:0 0 6px}
.pin{width:30px;height:42px;margin:-42px 0 0 -15px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.me{width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#2a7de1;border:3px solid #fff;box-shadow:0 0 0 6px rgba(42,125,225,.25)}
.pick{position:fixed;z-index:25;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 76px);background:var(--panel);border:2px solid var(--blue);border-radius:12px;padding:8px 12px;font-weight:600;display:flex;gap:10px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.2);max-width:calc(100% - 24px)}
.maplibregl-ctrl-bottom-right{bottom:calc(env(safe-area-inset-bottom,0px) + 4px)}
@media (min-width:641px){.maplibregl-ctrl-bottom-left{left:calc(min(420px,100vw - 24px) + 18px)}}
.maplibregl-ctrl-attrib,.maplibregl-ctrl-attrib.maplibregl-compact{background:color-mix(in srgb,var(--panel) 88%,transparent);color:var(--fg)}.maplibregl-ctrl-attrib a{color:var(--fg)}
.k-north .maplibregl-ctrl-compass{display:none}
@media (max-width:640px){
  .card{left:0;right:0;width:auto;bottom:0;border-radius:18px 18px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));max-height:52vh}
  .maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{bottom:calc(var(--card,140px) + 4px)}
  .maplibregl-ctrl-zoom-in,.maplibregl-ctrl-zoom-out{display:none!important}
  .maplibregl-ctrl-bottom-right .maplibregl-ctrl-attrib{max-width:calc(100vw - 118px)}
  .rendu .rb{gap:5px;font-size:14px}
  .rendu label{min-height:30px}
}
</style>
</head>
<body>
<div id="map" role="application" aria-label="Carte de Conakry : touchez une porte pour obtenir son adresse"></div>
<header class="top">
  <form class="find" id="find" role="search" autocomplete="off">
    <input type="search" id="q" placeholder="Adresse, quartier ou Plus Code" aria-label="Chercher une adresse" aria-controls="sugg" maxlength="120" enterkeyhint="search">
    <button class="btn primary" type="submit">Chercher</button>
  </form>
  <ul class="sugg" id="sugg" role="listbox" hidden></ul>
</header>
<div class="fabs">
  <button class="fab" type="button" id="fabLoc" aria-label="Ma position"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
  <button class="fab" type="button" id="fabSat" aria-label="Vue satellite" aria-pressed="false">SAT</button>
  <div class="rendu" id="rendu" hidden>
    <button type="button" id="renduBtn" aria-expanded="false" aria-controls="renduCorps">Rendu <span id="renduFl" aria-hidden="true">▸</span></button>
    <div class="rb" id="renduCorps" hidden>
      <label><input type="radio" name="rendu" value="plan"> Plan de ville</label>
      <label><input type="radio" name="rendu" value="suivi"> Suivi des noms</label>
      <label><input type="checkbox" id="grilleOn"> Quadrillage</label>
      <label><input type="checkbox" id="circOn"> Circulation</label>
      <label><input type="checkbox" id="limOn"> Limites des communes</label>
      <label id="tramLab"><input type="checkbox" id="tramOn"> Projet de tramway</label>
      <div class="rleg" id="legSuivi" hidden><span><i style="background:var(--street-keep)"></i>Nom conservé</span><span><i style="background:var(--street-prop)"></i>Nom proposé</span><span><i style="background:var(--street-todo)"></i>À nommer</span></div>
      <div class="rleg" id="legCirc" hidden><span><i style="background:var(--circ)"></i>Sens unique (flèches au zoom)</span></div>
    </div>
  </div>
</div>
<div class="pick" id="pick" hidden><span id="pickTxt">Touchez la carte pour choisir le départ</span><button class="btn" type="button" id="pickNo">Annuler</button></div>
<section class="card" id="card" aria-live="polite"></section>
<div class="toast" id="toast" role="status" hidden></div>
<div class="status" id="status"><div><h3>Chargement du plan…</h3><p class="hint">Les rues et les quartiers arrivent.</p></div></div>
<script src="lib/maplibre-gl.js"></script>
<script src="sdk/conakry-adresses.js"></script>
<script src="sdk/guidage.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id),CA=window.ConakryAdresses;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
let toastT;const toast=m=>{const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},3200)};
const fmtD=m=>m<1000?Math.round(m/10)*10+' m':(m/1000).toFixed(1).replace('.',',')+' km';
const fmtT=s=>s<60?'moins d\'1 min':s<3600?Math.round(s/60)+' min':Math.floor(s/3600)+' h '+String(Math.round(s%3600/60)).padStart(2,'0');
const glyphOk=c=>{const n=c.codePointAt(0);return n<1024||(n>=7680&&n<7936)||(n>=8192&&n<8448)};
const safe=t=>[...String(t||'')].map(c=>glyphOk(c)?c:[...c.normalize('NFD')].filter(glyphOk).join('')).join('');
/* ville : ?ville=labe, ou d'après le code postal d'un identifiant partagé (#GN-85002-…), sinon Conakry */
const VILLES={conakry:{nom:'Conakry',dossier:'data/'},boke:{nom:'Boké',dossier:'data/boke/'},faranah:{nom:'Faranah',dossier:'data/faranah/'},kankan:{nom:'Kankan',dossier:'data/kankan/'},kindia:{nom:'Kindia',dossier:'data/kindia/'},labe:{nom:'Labé',dossier:'data/labe/'},mamou:{nom:'Mamou',dossier:'data/mamou/'},nzerekore:{nom:'N\'Zérékoré',dossier:'data/nzerekore/'},siguiri:{nom:'Siguiri',dossier:'data/siguiri/'}};
/* code postal → ville : 81 Boké, 82 Faranah, 83 Kankan (Siguiri 83400), 84 Kindia, 85 Labé, 86 Mamou, 87 N'Zérékoré, 88-89 Conakry */
const PREFIXES=[['810','boke'],['820','faranah'],['830','kankan'],['834','siguiri'],['840','kindia'],['850','labe'],['860','mamou'],['870','nzerekore'],['88','conakry'],['89','conakry']];
const villeDuCode=id=>{const m=String(id||'').match(/^GN-(\d{5})-/i);if(!m)return null;const p=PREFIXES.find(([x])=>m[1].startsWith(x));return p?p[1]:null};
let VILLE=new URLSearchParams(location.search).get('ville');
const aVille=k=>typeof k==='string'&&Object.prototype.hasOwnProperty.call(VILLES,k);
const dec=t=>{try{return decodeURIComponent(t)}catch(e){return t}};   /* un lien abîmé (« #% ») ne bloque pas la carte */
/* ville ouverte : ?ville=labe, sinon celle d'un identifiant partagé (#GN-85002-…),
   sinon la dernière ville ouverte sur ce téléphone (adresse du site sans rien derrière), sinon Conakry */
const VILLE_MEMO='conakry-ville',lireMemo=()=>{try{return localStorage.getItem(VILLE_MEMO)}catch(e){return null}};
let deMemoire=false;
if(!aVille(VILLE)){VILLE=villeDuCode(dec(location.hash.slice(1)));if(!VILLE&&location.hash.length<2&&aVille(lireMemo())){VILLE=lireMemo();deMemoire=true}}
if(!aVille(VILLE))VILLE='conakry';
try{localStorage.setItem(VILLE_MEMO,VILLE)}catch(e){}
const VI=VILLES[VILLE],SUFFIXE=VILLE==='conakry'?'':'?ville='+VILLE;
$('status').querySelector('h3').textContent='Chargement du plan de '+VI.nom+'…';
let VLIST=null;
if(!window.maplibregl||!CA){$('status').innerHTML='<div><h3>La carte ne peut pas démarrer</h3><p class="hint">Vérifiez la connexion internet et utilisez un navigateur récent (Chrome, Safari, Edge).</p></div>';return}

/* ---------- carte ---------- */
const ESRI='https://server.arcgisonline.com/ArcGIS/rest/services/';
const dark=()=>matchMedia('(prefers-color-scheme: dark)').matches&&document.documentElement.dataset.theme!=='light';
const CLE_VUE='conakry-carte-vue'+(VILLE==='conakry'?'':'-'+VILLE);
/* dernière vue gardée par ce navigateur : vérifiée, sinon oubliée (une vue abîmée empêcherait la carte de démarrer) */
let vue=null;try{const v=JSON.parse(localStorage.getItem(CLE_VUE)||'null'),n=x=>typeof x==='number'&&isFinite(x);
  if(v&&n(v.lat)&&n(v.lng)&&n(v.z)&&Math.abs(v.lat)<85&&Math.abs(v.lng)<=180&&v.z>=0&&v.z<=22)vue={lat:v.lat,lng:v.lng,z:v.z,b:n(v.b)?v.b:0,p:n(v.p)?Math.min(Math.max(v.p,0),60):0};else localStorage.removeItem(CLE_VUE)}catch(e){}
const map=new maplibregl.Map({container:'map',attributionControl:false,maxPitch:60,
  style:{version:8,glyphs:new URL('glyphs/{fontstack}/{range}.pbf',location.href).href.replace('%7Bfontstack%7D','{fontstack}').replace('%7Brange%7D','{range}'),
    sources:{plan:{type:'raster',tiles:[ESRI+'Canvas/'+(dark()?'World_Dark_Gray_Base':'World_Light_Gray_Base')+'/MapServer/tile/{z}/{y}/{x}'],tileSize:256,maxzoom:16,attribution:'Fond © Esri'},
      sat:{type:'raster',tiles:[ESRI+'World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256,maxzoom:18,attribution:'Images © Esri, Maxar'}},
    layers:[{id:'bg',type:'background',paint:{'background-color':css('--paper')}},{id:'plan',type:'raster',source:'plan',paint:{'raster-opacity':.55}},{id:'sat',type:'raster',source:'sat',layout:{visibility:'none'}}]},
  center:vue?[vue.lng,vue.lat]:[-13.62,9.60],zoom:vue?vue.z:11,bearing:vue?vue.b:0,pitch:vue?vue.p:0,
  locale:{'NavigationControl.ZoomIn':'Zoomer','NavigationControl.ZoomOut':'Dézoomer','NavigationControl.ResetBearing':'Remettre le nord en haut','AttributionControl.ToggleAttribution':'Sources','Popup.Close':'Fermer'}});
map.addControl(new maplibregl.AttributionControl({compact:true,customAttribution:'Rues © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> · plan provisoire'}),'bottom-right');
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'bottom-right');
map.addControl(new maplibregl.ScaleControl({unit:'metric',maxWidth:90}),'bottom-left');
const north=()=>map.getContainer().classList.toggle('k-north',Math.abs(map.getBearing())<.5&&map.getPitch()<.5);map.on('rotate',north);map.on('pitch',north);north();
let saveT;map.on('moveend',()=>{clearTimeout(saveT);saveT=setTimeout(()=>{const c=map.getCenter();try{localStorage.setItem(CLE_VUE,JSON.stringify({lat:+c.lat.toFixed(5),lng:+c.lng.toFixed(5),z:+map.getZoom().toFixed(2),b:+map.getBearing().toFixed(1),p:+map.getPitch().toFixed(1)}))}catch(e){}},400)});
$('fabSat').onclick=()=>{const on=$('fabSat').getAttribute('aria-pressed')!=='true';$('fabSat').setAttribute('aria-pressed',on?'true':'false');map.setLayoutProperty('sat','visibility',on?'visible':'none');map.setLayoutProperty('plan','visibility',on?'none':'visible');map.setPaintProperty('bg','background-color',on?'#20251f':css('--paper'))};

/* ---------- données ---------- */
let ref=null,pin=null,me=null,mePos=null,mePosT=0,route=null,picking=false;
const FC=f=>({type:'FeatureCollection',features:f||[]});
function addLayers(){

  <p class="intro">Touchez la carte pour obtenir l'adresse d'une porte, ou cherchez une adresse.</p>
  ${VLIST&&VLIST.length>1?`<nav class="villes" aria-label="Villes">${VLIST.map(v=>`<a href="${lienVille(v.code)}"${v.code===VILLE?' aria-current="page"':''}>${esc(v.nom)}</a>`).join('')}</nav>`:''}
  <div class="row"><button class="btn primary big" type="button" id="ouSuisJe">${IGPS}Où suis-je ?</button></div>
  ${chiffres?`<p class="chiffres">${chiffres}</p>`:''}
  ${ref&&ref.info.avertissement?`<details class="avert"><summary>Plan provisoire, non officiel</summary><p>${esc(ref.info.avertissement)}</p></details>`:''}
  <p class="liens"><a href="developpeurs.html${SUFFIXE}">Pour les applis</a><a href="choisir.html${SUFFIXE}">Choisir une adresse</a></p>`;
  $('ouSuisJe').onclick=ouSuisJe;
}
const STAT={officiel:'Nom officiel',propose:'Nom proposé, en attendant le choix de la commune',usage:'Nom d\'usage (OpenStreetMap)',a_nommer:'Rue à nommer (plan de Kaloum)',provisoire:'Code provisoire'};
const statut=a=>a.voie.statut==='propose'&&a.commune&&a.commune.code==='KAL'?'Nom proposé par le plan de Kaloum':STAT[a.voie.statut]||'';
/* « Rue du Bembeya Jazz » → « Bembeya Jazz » : à qui la rue est dédiée */
const honore=n=>String(n).replace(/^(Rue|Avenue|Boulevard|Impasse|Chemin|Passage|Allée)\s+/,'').replace(/^(du|des|de la|de l'|de|d')\s*/,'').replace(/^./,c=>c.toUpperCase());
/* from : 'tap' (la carte ne bouge pas), 'gps' (« Où suis-je ? »), sinon recherche ou lien partagé */
function showAddress(a,from,garderVue){
  if(!a){toast('Hors de la zone de '+VI.nom+'.');return}
  const gps=from==='gps',acc=gps&&mePos?mePos.acc:0;
  if(gps){pin&&pin.remove()}else placePin(a.position);
  card.dataset.vue=gps?'gps':'adresse';
  const infos=[];
  if(a.voie){infos.push(esc(statut(a)));if(a.voie.nomUsuel)infos.push('connue comme « '+esc(a.voie.nomUsuel)+' »');if(a.distanceRue>25)infos.push('à '+a.distanceRue+' m de la rue')}
  const cr=RENDU.grille&&carreau(a.position);if(cr)infos.push('carreau '+cr);
  card.innerHTML=`${gps?'<div class="eyebrow ici">Vous êtes ici</div>':`<div class="eyebrow">${a.precision==='porte'?'Adresse':'Lieu sans rue proche'}</div>`}
    <h1>${esc(a.ligne1)}</h1><div class="l2">${esc(a.ligne2)}</div>
    ${gps&&acc?`<p class="st${acc>100?' prov':''}">${acc>100?`Position approximative, à ${acc} m près : attendez un peu à découvert, puis touchez « Actualiser ».`:`Position du GPS, à ${acc} m près.`}</p>`:''}
    ${a.voie?`<p class="st${a.voie.statut==='a_nommer'?' prov':''}">${infos.join(' · ')}</p>${a.voie.dedicace?`<p class="ded"><b>${esc(honore(a.voie.nom))}</b> · ${esc(a.voie.dedicace)}</p>`:''}`:`<p class="st">Aucune rue à moins de 60 m : le Plus Code situe ${gps?'l\'endroit':'la porte'} à 3 m près${cr?' · carreau '+cr:''}.</p>`}
    <div class="chips">${a.id?`<button class="chip" type="button" data-copy="${esc(a.id)}" aria-label="Copier l'identifiant ${esc(a.id)}">${ICOPIE}${esc(a.id)}</button>`:''}<button class="chip pc" type="button" data-copy="${esc(a.plusCodeCourt)}" aria-label="Copier le Plus Code ${esc(a.plusCodeCourt)}">${ICOPIE}${esc(a.plusCodeCourt)}</button></div>
    <div class="row">${gps?'<button class="btn primary" type="button" id="share">Partager mon adresse</button><button class="btn" type="button" id="maj">Actualiser</button>'
      :'<button class="btn primary" type="button" id="goHere">Y aller</button><button class="btn" type="button" id="share">Partager</button>'}</div>`;
  card.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copy(b.dataset.copy));
  if(gps)$('maj').onclick=ouSuisJe;else $('goHere').onclick=()=>startRoute(a);
  $('share').onclick=()=>share(a,gps);
  const h='#'+(a.id||a.position.lat.toFixed(6)+','+a.position.lng.toFixed(6));if(location.hash!==h)history.replaceState(null,'',h);
  if(from!=='tap'&&!garderVue){map.easeTo({center:[a.position.lng,a.position.lat],zoom:Math.max(map.getZoom(),gps?17.5:17.2),duration:600})}
}
/* la fiche affichée suit les réglages (carreau du quadrillage) */
function rafraichirFiche(){
  if(!ref)return;
  if(card.dataset.vue==='adresse'&&pin){const p=pin.getLngLat();showAddress(ref.adresse(p.lat,p.lng),'tap')}
  else if(card.dataset.vue==='gps'&&mePos)showAddress(ref.adresse(mePos.lat,mePos.lng),'gps',true);
}
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copié : '+t)).catch(()=>toast(t))}
function share(a,moi){
  const url=location.origin+location.pathname+SUFFIXE+'#'+(a.id||a.position.lat.toFixed(6)+','+a.position.lng.toFixed(6));
  const text=(moi?'Je suis ici : ':'')+a.texte+'\nPlus Code : '+a.plusCodeCourt;
  if(navigator.share)navigator.share({title:'Adresse',text,url}).catch(()=>{});
  else window.open('https://wa.me/?text='+encodeURIComponent(text+'\n'+url),'_blank','noopener,noreferrer');
}
function placePin(p){
  if(!pin){const el=document.createElement('div');el.innerHTML='<svg class="pin" viewBox="0 0 30 42" aria-hidden="true"><path d="M15 41C15 41 28 25 28 14.5A13 13 0 0 0 2 14.5C2 25 15 41 15 41z" fill="#c8312a" stroke="#fff" stroke-width="2"/><circle cx="15" cy="14.5" r="5" fill="#fff"/></svg>';pin=new maplibregl.Marker({element:el,anchor:'top-left'})}
  pin.setLngLat([p.lng,p.lat]).addTo(map);
}

/* ---------- itinéraire ---------- */
let RT={de:null,deTxt:'',a:null,mode:'voiture'};
function startRoute(a){
  RT.a=a;RT.de=null;
  const choisir=m=>{if(m)toast(m);picking=true;$('pickTxt').textContent='Touchez la carte pour choisir le départ';$('pick').hidden=false};
  const depuis=p=>{RT.de=p;RT.deTxt='Ma position';computeRoute()};
  if(mePos&&Date.now()-mePosT<120000&&ref.quartierDe(mePos.lat,mePos.lng))return depuis(mePos);
  if(!navigator.geolocation)return choisir();
  toast('Recherche de votre position…');
  navigator.geolocation.getCurrentPosition(p=>{setMe(p);$('toast').hidden=true;
    if(ref.quartierDe(mePos.lat,mePos.lng))depuis(mePos);else choisir('Vous n\'êtes pas à '+VI.nom+' : touchez la carte pour choisir le départ.')},
    ()=>choisir('Position introuvable : touchez la carte pour choisir le départ.'),{enableHighAccuracy:true,timeout:10000,maximumAge:30000});
}
$('pickNo').onclick=()=>{picking=false;$('pick').hidden=true};
/* « Ma position » comme départ (sur place) */
function departGps(){
  if(!navigator.geolocation){toast('Ce navigateur ne donne pas la position.');return}
  toast('Recherche de votre position…');
  navigator.geolocation.getCurrentPosition(p=>{setMe(p);$('toast').hidden=true;
    if(ref.quartierDe(mePos.lat,mePos.lng)){RT.de=mePos;RT.deTxt='Ma position';computeRoute()}
    else toast('Vous n\'êtes pas à '+VI.nom+' : gardez le départ choisi sur la carte.')},
    ()=>toast('Position introuvable : autorisez la localisation.'),{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}
function computeRoute(){
  const r=ref.itineraire(RT.de,RT.a.position,{mode:RT.mode});route=r;
  map.getSource('route').setData(FC(r?[{type:'Feature',properties:{},geometry:{type:'LineString',coordinates:r.ligne.map(p=>[p[1],p[0]])}}]:[]));
  card.dataset.vue='itineraire';
  /* comme Google Maps : guidage en direct depuis « Ma position », sinon aperçu du trajet (étape par étape, démonstration) */
  const gpsDepart=RT.deTxt==='Ma position';
  card.innerHTML=`<div class="eyebrow">Itinéraire</div><h2>${esc(RT.a.ligne1)}</h2>
    <div class="pts"><i class="a"></i><span>${esc(RT.deTxt)}<button class="lien" type="button" id="rDe">Changer</button>${gpsDepart?'':'<button class="lien" type="button" id="rMoi">Ma position</button>'}</span><i class="b"></i><span>${esc(RT.a.ligne1)} · ${esc(RT.a.ligne2)}</span></div>
    <div class="modes" role="group" aria-label="Mode de transport">${[['voiture','Voiture'],['moto','Moto'],['pied','À pied']].map(([k,t])=>`<button type="button" data-m="${k}" aria-pressed="${RT.mode===k}">${t}</button>`).join('')}</div>
    ${r?`<div class="sum"><b>${fmtT(r.duree)}</b><span>${fmtD(r.distance)} · estimation sans bouchons</span></div>`:'<p class="st">Aucun chemin trouvé : le départ ou l\'arrivée est trop loin d\'une rue, ou les sens uniques bloquent le passage.</p>'}
    <div class="row">${r?(gpsDepart?'<button class="btn primary" type="button" id="rGo">Démarrer</button><button class="btn" type="button" id="rApercu">Aperçu</button>':'<button class="btn primary" type="button" id="rApercu">Aperçu du trajet</button>'):''}<button class="btn" type="button" id="rBack">Retour</button></div>
    ${r&&!gpsDepart?'<p class="st">Départ choisi sur la carte : l\'aperçu montre le trajet étape par étape et le joue en démonstration. Le guidage en direct part de votre position GPS, une fois sur place.</p>':''}
    ${r?`<ol class="steps">${r.etapes.map(e=>`<li><span>${esc(e.instruction)}</span><span>${fmtD(e.distance)}</span></li>`).join('')}</ol>`:''}`;
  card.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{RT.mode=b.dataset.m;computeRoute()});
  if(r){if(gpsDepart)$('rGo').onclick=()=>guider('direct');$('rApercu').onclick=()=>guider('apercu')}
  $('rDe').onclick=()=>{picking=true;$('pickTxt').textContent='Touchez la carte pour choisir le départ';$('pick').hidden=false};
  if(!gpsDepart)$('rMoi').onclick=departGps;
  $('rBack').onclick=()=>{map.getSource('route').setData(FC());showAddress(RT.a,'tap')};
  if(r){const xs=r.ligne.map(p=>p[1]),ys=r.ligne.map(p=>p[0]);map.fitBounds([[Math.min(...xs),Math.min(...ys)],[Math.max(...xs),Math.max(...ys)]],{padding:{top:90,bottom:matchMedia('(max-width:640px)').matches?card.offsetHeight+30:40,left:matchMedia('(max-width:640px)').matches?30:460,right:60},maxZoom:17,duration:600})}
}

/* ---------- guidage pas à pas, sur cette carte ---------- */
let guide=null;
function guider(vue){
  if(guide)return;
  if(!window.GuidageConakry){toast('Guidage indisponible : rechargez la page.');return}
  const box=document.createElement('div');document.body.appendChild(box);
  try{
    guide=GuidageConakry.ouvrir(box,ref,RT.a,{mode:RT.mode,itineraire:route,vue:vue==='apercu'?'apercu':'direct',fond:true,
      surFin:raison=>{guide=null;box.remove();if(raison==='arrive')showAddress(RT.a,'tap');else computeRoute()}});
  }catch(e){guide=null;box.remove();toast('Le guidage ne peut pas démarrer : '+e.message)}
}

/* ---------- interactions ---------- */
map.on('click',e=>{
  if(!ref)return;
  /* sur téléphone, toucher la carte referme d'abord le menu « Rendu » */
  if(tel()&&!$('renduCorps').hidden&&!picking){ouvrirRendu(false);return}
  const ll=e.lngLat;
  if(!picking&&map.getLayer('tram-st')&&map.getLayoutProperty('tram-st','visibility')!=='none'){
    /* la station la plus proche du doigt ; plusieurs stations collées (vue large) : on zoome dessus */
    const vu=new Set(),f=map.queryRenderedFeatures([[e.point.x-12,e.point.y-12],[e.point.x+12,e.point.y+12]],{layers:['tram-st']})
      .filter(g=>!vu.has(g.properties.k)&&vu.add(g.properties.k)).map(g=>{const q=map.project(g.geometry.coordinates);return{k:g.properties.k,d:Math.hypot(q.x-e.point.x,q.y-e.point.y)}}).sort((a,b)=>a.d-b.d);
    if(f.length>1&&f[1].d-f[0].d<8&&map.getZoom()<14){map.easeTo({center:e.lngLat,zoom:Math.min(map.getZoom()+2.5,15),duration:500});return}
    if(f.length){station(f[0].k);return}
  }
  if(picking){picking=false;$('pick').hidden=true;const a=ref.adresse(ll.lat,ll.lng);RT.de={lat:ll.lat,lng:ll.lng};RT.deTxt=a?a.ligne1:'Point choisi';computeRoute();return}
  showAddress(ref.adresse(ll.lat,ll.lng),'tap');
});
function setMe(p){
  mePos={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy||0)};mePosT=Date.now();
  if(!me){const el=document.createElement('div');el.className='me';me=new maplibregl.Marker({element:el})}
  me.setLngLat([mePos.lng,mePos.lat]).addTo(map);
  /* cercle de précision (au-delà de 3 km, le GPS n'a pas encore trouvé) */
  const r=Math.min(mePos.acc,3000),k=111320*Math.cos(mePos.lat*Math.PI/180),c=[];
  if(r>=5)for(let i=0;i<=48;i++){const t=i/48*2*Math.PI;c.push([mePos.lng+r*Math.cos(t)/k,mePos.lat+r*Math.sin(t)/110574])}
  if(map.getSource('moi'))map.getSource('moi').setData(FC(c.length?[{type:'Feature',properties:{},geometry:{type:'Polygon',coordinates:[c]}}]:[]));
}
/* « Où suis-je ? » : l'adresse de l'endroit où l'on se trouve, à partager */
function ouSuisJe(){
  if(!navigator.geolocation){toast('Ce navigateur ne donne pas la position.');return}
  if(window.isSecureContext===false){toast('La position ne marche que sur la carte en ligne (adresse en https).');return}
  if(!ref){toast('Le plan se charge encore : réessayez dans un instant.');return}
  toast('Recherche de votre position…');
  navigator.geolocation.getCurrentPosition(p=>{
    setMe(p);$('toast').hidden=true;
    const a=ref.adresse(mePos.lat,mePos.lng);
    if(a)showAddress(a,'gps');else horsZone(mePos);
  },err=>toast(err.code===1?'Localisation refusée : autorisez-la pour ce site dans les réglages du navigateur, puis réessayez.':'Position introuvable : réessayez à découvert, loin des murs.'),{enableHighAccuracy:true,timeout:20000,maximumAge:0});
}
$('fabLoc').onclick=ouSuisJe;
/* hors de la ville affichée : proposer la carte d'une autre ville en ligne, si l'on y est */
function horsZone(p){
  const proche=(VLIST||[]).filter(v=>v&&v.code!==VILLE&&aVille(v.code)&&Array.isArray(v.centre)&&isFinite(v.centre[0])&&isFinite(v.centre[1])).map(v=>({v,d:distLL([p.lat,p.lng],v.centre)})).sort((x,y)=>x.d-y.d)[0];
  map.easeTo({center:[p.lng,p.lat],zoom:Math.min(Math.max(map.getZoom(),12),15),duration:600});
  if(!proche||proche.d>25000){toast('Vous n\'êtes pas dans la zone de '+VI.nom+' : cette carte couvre '+VI.nom+' seulement.');return}
  pin&&pin.remove();card.dataset.vue='ailleurs';
  const nom=esc(VILLES[proche.v.code].nom);
  card.innerHTML=`<div class="eyebrow ici">Vous êtes ici</div><h2>Près de ${nom}</h2>
    <p class="l2">Cette carte couvre ${esc(VI.nom)}. Le plan de ${nom} est aussi en ligne.</p>
    <div class="row"><a class="btn primary" href="${lienVille(proche.v.code,'#'+p.lat.toFixed(6)+','+p.lng.toFixed(6))}">Ouvrir la carte de ${nom}</a><button class="btn" type="button" id="hzBack">Retour</button></div>`;
  $('hzBack').onclick=accueil;
}
/* recherche avec suggestions */
let sel=-1,last=[];
const sugg=$('sugg');
function renderSugg(list){
  last=list;sel=-1;
  if(!$('q').value.trim()){sugg.hidden=true;return}
  sugg.hidden=false;
  sugg.innerHTML=list.length?list.map((r,i)=>`<li><button type="button" role="option" data-i="${i}"><b>${esc(r.adresse?r.adresse.ligne1:r.libelle.split(' · ')[0])}</b><small>${esc(r.adresse?r.adresse.ligne2:r.libelle.split(' · ').slice(1).join(' · ')||r.type)}${r.limite?' · la rue s\'arrête au n° '+r.limite:''}</small></button></li>`).join(''):'<li class="empty">Aucun résultat. Essayez « 12 Avenue de la République », un quartier ou un Plus Code.</li>';
  sugg.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
}
function pick(i){const r=last[i];if(!r)return;sugg.hidden=true;$('q').blur();
  const a=r.adresse||ref.adresse(r.lat,r.lng);
  if(r.type==='quartier'||r.type==='commune'){map.flyTo({center:[r.lng,r.lat],zoom:r.type==='commune'?13.5:15.5});return}
  if(a)showAddress(a);else map.flyTo({center:[r.lng,r.lat],zoom:16});
}
let qT;$('q').addEventListener('input',()=>{clearTimeout(qT);qT=setTimeout(()=>{if(ref)renderSugg(ref.chercher($('q').value,{max:7}))},160)});
$('q').addEventListener('keydown',e=>{
  const items=sugg.querySelectorAll('[data-i]');if(!items.length)return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sel=(sel+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items.forEach((b,i)=>b.setAttribute('aria-selected',i===sel?'true':'false'))}
  if(e.key==='Escape')sugg.hidden=true;
});
$('find').addEventListener('submit',e=>{e.preventDefault();if(!ref)return;if(sel>=0)return pick(sel);const r=ref.chercher($('q').value,{max:7});if(r.length===1||(r[0]&&r[0].score>=1))pick(0);else renderSugg(r)});
document.addEventListener('click',e=>{if(!e.target.closest('.top'))sugg.hidden=true});
function openHash(){
  const h=dec(location.hash.slice(1)).slice(0,200);if(!h||!ref)return false;
  let a=null;
  if(/^GN-/i.test(h)){a=ref.position(h);const autre=villeDuCode(h);if(!a&&autre&&autre!==VILLE){location.href='./?ville='+autre+location.hash;return true}}
  else{const m=h.match(/^(-?\d+\.\d+),(-?\d+\.\d+)$/);if(m)a=ref.adresse(+m[1],+m[2]);else if(/^q=/.test(h)){const r=ref.chercher(h.slice(2));if(r[0])a=r[0].adresse||ref.adresse(r[0].lat,r[0].lng)}}
  if(a){map.jumpTo({center:[a.position.lng,a.position.lat],zoom:17.5});showAddress(a,'hash');return true}
  return false;
}
window.addEventListener('hashchange',openHash);

/* ---------- démarrage ---------- */
accueil();
fetch('data/villes.json').then(r=>r.ok?r.json():null).then(j=>{VLIST=j&&Array.isArray(j.villes)?j.villes:null;if(card.dataset.vue==='accueil')accueil()}).catch(()=>{});
CA.charger({base:VI.dossier}).then(r=>{
  ref=r;window.__ref=r;
  const go=()=>{addLayers();initRendu();$('status').hidden=true;accueil();
    if(!openHash()&&!vue){const b=ref.bbox,tel=matchMedia('(max-width:640px)').matches;map.fitBounds([[b[0],b[1]],[b[2],b[3]]],{padding:{top:80,left:30,right:tel?30:70,bottom:tel?card.offsetHeight+20:40},duration:0})}
    drawNums()};
  /* le plan s'affiche dès que le style est prêt, même si le fond de carte (Esri) ne répond pas */
  const essai=()=>{if(map.isStyleLoaded())go();else setTimeout(essai,80)};essai();
}).catch(e=>{
  /* la dernière ville ouverte n'est plus en ligne : on revient à Conakry */
  if(deMemoire){try{localStorage.removeItem(VILLE_MEMO)}catch(x){}location.replace('./?ville=conakry');return}
  $('status').innerHTML='<div><h3>Plan de '+esc(VI.nom)+' pas encore publié</h3><p class="hint">Le référentiel n\'est pas dans le dossier <code>'+esc(VI.dossier)+'</code>. Ouvrez l\'<a href="atelier.html'+SUFFIXE+'">atelier</a> pour le fabriquer'+(VILLE==='conakry'?'':', ou revenez à la <a href="./?ville=conakry">carte de Conakry</a>')+'.</p><p class="hint">'+esc(e.message)+'</p></div>'});
})();
</script>
</body>
</html>
