function setMe(p){
  mePos={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy||0)};mePosT=Date.now();
  if(!me){const el=document.createElement('div');el.className='me';el.innerHTML='<i><svg viewBox="0 0 34 34" aria-hidden="true"><path d="M17 2.5 29 31 17 23.5 5 31Z" fill="#2a7de1" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/></svg></i>';me=new maplibregl.Marker({element:el})}
  me.setLngLat([mePos.lng,mePos.lat]).addTo(map);
  const r=Math.min(mePos.acc,3000),k=111320*Math.cos(mePos.lat*Math.PI/180),c=[];
  if(r>=5)for(let i=0;i<=48;i++){const t=i/48*2*Math.PI;c.push([mePos.lng+r*Math.cos(t)/k,mePos.lat+r*Math.sin(t)/110574])}
  if(map.getSource('moi'))map.getSource('moi').setData(FC(c.length?[{type:'Feature',properties:{},geometry:{type:'Polygon',coordinates:[c]}}]:[]));
}
function localiser(f){
  if(!navigator.geolocation){toast('Ce navigateur ne donne pas la position.');return}
  if(window.isSecureContext===false){toast('La position ne marche que sur la carte en ligne (adresse en https).');return}
  if(!ref){toast('Le plan se charge encore : réessayez dans un instant.');return}
  toast('Recherche de votre position…');
  navigator.geolocation.getCurrentPosition(p=>{setMe(p);$('toast').hidden=true;f()},
    err=>toast(err.code===1?'Localisation refusée : autorisez-la pour ce site dans les réglages du navigateur, puis réessayez.':'Position introuvable : réessayez à découvert, loin des murs.'),{enableHighAccuracy:true,timeout:20000,maximumAge:0});
}
function ouSuisJe(){localiser(()=>{const a=ref.adresse(mePos.lat,mePos.lng);if(a)showAddress(a,'gps');else horsZone(mePos)})}
$('fabLoc').onclick=()=>{if(mePos&&Date.now()-mePosT<60000){SUIVI.actif=true;if(SUIVI.id==null)suivreMoi();centrerMoi(true);return}ouSuisJe();suivreMoi()};

/* ---------- comme Waze : à l'ouverture, la carte se place sur ma position, au niveau de la rue, puis me suit ----------
   - dernière position connue (gardée sur l'appareil) dès l'ouverture, puis le GPS ;
   - la carte suit tant que l'on ne la déplace pas soi-même (le bouton de position la recentre) ;
   - en bas : le nom de la rue où l'on est et la vitesse (celle du GPS, sinon estimée d'après les deux dernières positions) ;
   - dans une autre ville publiée que celle ouverte d'office (mémoire, défaut), son plan s'ouvre. */
const CLE_MOI='itina-geo-moi',SUIVI={id:null,actif:false,zoomer:true,prec:null,tGarde:0,ville:false,premier:true};
const lireMoi=()=>{try{const v=JSON.parse(localStorage.getItem(CLE_MOI)||'null');return v&&isFinite(v.lat)&&isFinite(v.lng)&&Date.now()-v.t<12*3600e3?v:null}catch(e){return null}};
function centrerMoi(zoomer){if(!mePos)return;map.easeTo({center:[mePos.lng,mePos.lat],zoom:zoomer?Math.max(map.getZoom(),17):map.getZoom(),padding:marges(),duration:zoomer?800:500})}
function vitesseMoi(p){
  /* vitesse et sens de marche du GPS ; vides (null, ou -1 sur iPhone) : estimés d'après les deux dernières positions.
     Attention : en JavaScript, null >= 0 est vrai, d'où le test du type. */
  const num=x=>typeof x==='number'&&isFinite(x)&&x>=0;
  let v=p.coords.speed,c=p.coords.heading;const t=p.timestamp||Date.now(),q=SUIVI.prec,ici={lat:p.coords.latitude,lng:p.coords.longitude,t};SUIVI.prec=ici;
  const dt=q?(t-q.t)/1000:0,d=q?distLL([q.lat,q.lng],[ici.lat,ici.lng]):0,fiable=q&&(p.coords.accuracy||0)<=60&&dt>0.4&&dt<15;
  if(!num(v))v=fiable&&d>=1.5?Math.min(d/dt,70):0;
  if(!num(c)&&fiable&&d>4){const k=Math.cos(ici.lat*Math.PI/180);c=(Math.atan2((ici.lng-q.lng)*k,ici.lat-q.lat)*180/Math.PI+360)%360}
  $('vitN').textContent=Math.round(v*3.6);$('vit').style.setProperty('--p',Math.min(v*3.6/130,1).toFixed(3));
  /* en mouvement, le point devient une flèche tournée dans le sens de la marche (0° = vers le haut de l'écran) */
  const el=me&&me.getElement();if(el){const ok=num(c)&&v>1.5,i=el.firstElementChild;el.classList.toggle('cap',ok);if(i)i.style.transform=ok?'rotate('+(c-map.getBearing())+'deg)':''}
}
function majIci(){
  const accueilVu=feuille.dataset.vue==='accueil'&&!guide,frais=mePos&&Date.now()-mePosT<120000;
  let rue='';if(frais&&accueilVu&&ref){const a=ref.adresse(mePos.lat,mePos.lng);if(a&&a.voie&&!(a.distanceRue>60))rue=a.voie.nom}
  $('ici').textContent=rue;$('ici').hidden=!rue;
  const vitVue=!!(frais&&accueilVu&&SUIVI.id!=null);$('vit').hidden=!vitVue;document.body.classList.toggle('avec-vit',vitVue);
}
function suivreMoi(){
  if(DEMO||!navigator.geolocation||window.isSecureContext===false||SUIVI.id!=null)return;
  SUIVI.actif=true;
  SUIVI.id=navigator.geolocation.watchPosition(p=>{
    setMe(p);vitesseMoi(p);
    if(Date.now()-SUIVI.tGarde>30000){SUIVI.tGarde=Date.now();try{localStorage.setItem(CLE_MOI,JSON.stringify({lat:mePos.lat,lng:mePos.lng,t:Date.now()}))}catch(e){}}
    /* ville choisie (menu, lien) et position hors de son plan : la carte reste sur la ville choisie */
    if(SUIVI.premier){SUIVI.premier=false;if(!VILLE_IMPLICITE&&!ref.quartierDe(mePos.lat,mePos.lng))SUIVI.actif=false}
    if(SUIVI.ville){SUIVI.ville=false;const k=villeDuPoint(mePos.lat,mePos.lng);
      if(k&&k!==VILLE&&(VLIST||[]).some(v=>v&&v.code===k)){toast('Vous êtes à '+VILLES[k].nom+' : ouverture de son plan…');setTimeout(()=>allerVille(k),900);return}
      if(!ref.quartierDe(mePos.lat,mePos.lng))toast(k&&k!==VILLE?'Le plan de '+VILLES[k].nom+' n\'est pas encore en ligne : la carte vous montre quand même.':'Vous êtes hors des plans d\'Itina Geo : les adresses couvrent la Guinée. Choisissez une ville en haut.')}
    if(SUIVI.actif&&!guide&&feuille.dataset.vue==='accueil'){centrerMoi(SUIVI.zoomer);SUIVI.zoomer=false}
    majIci();
  },err=>{if(err&&err.code===1){try{navigator.geolocation.clearWatch(SUIVI.id)}catch(x){}SUIVI.id=null;SUIVI.actif=false;majIci()}},{enableHighAccuracy:true,maximumAge:3000,timeout:25000});
}
/* pendant le guidage, un seul suivi GPS (celui du guidage) : celui de l'accueil se met en pause, puis reprend */
function suspendreSuivi(){if(SUIVI.id!=null){try{navigator.geolocation.clearWatch(SUIVI.id)}catch(e){}SUIVI.id=null;SUIVI.repr=true}}
function reprendreSuivi(){if(SUIVI.repr){SUIVI.repr=false;SUIVI.zoomer=false;suivreMoi()}}
/* la carte déplacée au doigt : elle ne suit plus (le bouton de position la recentre) */
map.on('dragstart',e=>{if(e&&e.originalEvent)SUIVI.actif=false});

/* ---------- toucher la carte ---------- */
map.on('click',e=>{
  if(!ref)return;
  if(e.originalEvent&&e.originalEvent.target&&e.originalEvent.target.closest&&e.originalEvent.target.closest('.mk-sig,.bulle-m'))return;
  $('villeMenu').hidden=true;
  const ll=e.lngLat;
  if(picking){
    const pk=picking;picking=null;$('pick').hidden=true;
    if(pk.but==='signal'){ajouterSignal(pk.type,{lat:ll.lat,lng:ll.lng});return}
    if(pk.but==='etab'){const a=ref.adresse(ll.lat,ll.lng);if(a)ouvrirAjout(a,{lat:ll.lat,lng:ll.lng},null,pk.cat);else toast('Hors de la zone de '+VI.nom+'.');return}
    if(pk.but==='etab-pos'){const a=ref.adresse(ll.lat,ll.lng);if(a&&ajout){ajout.a=a;ajout.pos={lat:ll.lat,lng:ll.lng};const t=$('aCorps').querySelector('.a-pos .tx');if(t)t.innerHTML=`<b>${esc(a.ligne1)}</b><small>${esc(a.ligne2)}${a.id?' · '+esc(a.id):''}</small>`}else toast('Hors de la zone de '+VI.nom+'.');$('ajout').hidden=false;return}
    const a=ref.adresse(ll.lat,ll.lng);
    if(pk.but==='domicile'||pk.but==='travail'){if(a){definirLieu(pk.but,a);accueil()}else toast('Hors de la zone de '+VI.nom+'.');return}
    RT.de={lat:ll.lat,lng:ll.lng};RT.deTxt=a?a.ligne1:'Point choisi';RT.deGps=false;calculer();return;
  }
  if(GL&&map.getLayer('etab-1')){
    const f=map.queryRenderedFeatures([[e.point.x-10,e.point.y-10],[e.point.x+10,e.point.y+10]],{layers:COUCHES_ETAB.filter(id=>map.getLayer(id)&&map.getLayoutProperty(id,'visibility')!=='none')});
    if(f.length){const l=etab(f[0].properties.id);if(l){ficheEtab(l,true);return}}
  }
  if(map.getLayer('tram-st')&&map.getLayoutProperty('tram-st','visibility')!=='none'){
    const vu=new Set(),f=map.queryRenderedFeatures([[e.point.x-12,e.point.y-12],[e.point.x+12,e.point.y+12]],{layers:['tram-st']})
      .filter(g=>!vu.has(g.properties.k)&&vu.add(g.properties.k)).map(g=>{const q=map.project(g.geometry.coordinates);return{k:g.properties.k,d:Math.hypot(q.x-e.point.x,q.y-e.point.y)}}).sort((a,b)=>a.d-b.d);
    if(f.length>1&&f[1].d-f[0].d<8&&map.getZoom()<14){map.easeTo({center:e.lngLat,zoom:Math.min(map.getZoom()+2.5,15),duration:500});return}
    if(f.length){station(f[0].k);return}
  }
  const a=ref.adresse(ll.lat,ll.lng);
  if(a)showAddress(a,'tap');else toucherAilleurs(ll.lat,ll.lng);
});

/* ---------- liens partagés : #GN-…, #lat,lng, #q=… ---------- */
function openHash(){
  const h=dec(location.hash.slice(1)).slice(0,200);if(!h||!ref)return false;
  let a=null;
  if(GL&&ID_ETAB.test(h)){const l=etab(h);if(l){map.jumpTo({center:[l.lng,l.lat],zoom:17.5});ficheEtab(l,true);return true}return false}
  const m=h.match(LIEN),id=m?m[1]:/^GN-/i.test(h)?h:null,autre=villeDuCode(id)||(m&&!m[1]?villeDuPoint(+m[2],+m[3]):null);
  if(autre&&autre!==VILLE&&aVille(autre)&&publie(autre)&&!LIEU_SEUL){allerVille(autre,location.hash);return true}
  if(m)a=adresseLien(m[1]?m[1].toUpperCase():null,+m[2],+m[3]);
  else if(id)a=ref.position(id);
  else if(/^q=/.test(h)){const r=ref.chercher(h.slice(2));if(r[0])a=r[0].adresse||ref.adresse(r[0].lat,r[0].lng)}
  if(a){map.jumpTo({center:[a.position.lng,a.position.lat],zoom:17.5});showAddress(a,'hash');return true}
  if(m&&!m[1]){const la=+m[2],lo=+m[3];map.jumpTo({center:[lo,la],zoom:13});if(GN_DATA)toucherAilleurs(la,lo);else LOC_ATTENTE={lat:la,lng:lo};return true}
  if(m||id)toast('Adresse introuvable sur le plan de '+VI.nom+'.');
  return false;
}
addEventListener('hashchange',openHash);

   svg:TEL('bvE4',`<g transform="translate(168 30)"><rect x="0" y="12" width="5" height="6" rx="1.2" fill="#56657a"/><rect x="8" y="8" width="5" height="10" rx="1.2" fill="#56657a"/><rect x="16" y="4" width="5" height="14" rx="1.2" fill="#56657a"/><rect x="24" y="0" width="5" height="18" rx="1.2" fill="#56657a"/><path d="M-3 -2 32 20" stroke="#ff5a5f" stroke-width="3.2" stroke-linecap="round"/></g><circle class="bv-onde" cx="130" cy="150" r="42" fill="#2fd27e" opacity=".3"/><circle cx="130" cy="150" r="42" fill="#2fd27e"/><path d="m110 151 13 13 27-29" fill="none" stroke="#04190c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="54" y="218" width="152" height="62" rx="16" fill="#243040"/><rect x="68" y="233" width="96" height="11" rx="5.5" fill="#eef2f7"/><rect x="68" y="251" width="64" height="8" rx="4" fill="#7f8b9a"/>`)}];
/* état de l'autorisation : 'granted' (déjà donnée : écran sauté), 'prompt', 'denied' (bloquée : on explique), 'absent' (aperçu, navigateur sans GPS) */
function etatPosition(){
  if(DEMO||!navigator.geolocation||window.isSecureContext===false)return Promise.resolve('absent');
  try{if(navigator.permissions&&navigator.permissions.query)return navigator.permissions.query({name:'geolocation'}).then(x=>x.state,()=>'prompt')}catch(e){}
  return Promise.resolve('prompt');
}
function ouvrirBienvenue(revoir){
  Object.assign(BV,{ouvert:true,revoir:!!revoir,choix:revoir?REG.mode:null,diapo:0,plusTard:false});
  BV.etat=etatPosition().then(x=>BV.pos=x);
  const bv=$('bienvenue');bv.hidden=false;bv.classList.remove('sortie');
  /* le reste de la page n'est plus atteignable au clavier ni par le lecteur d'écran tant que la présentation est ouverte */
  BV.inertes=[...document.body.children].filter(x=>x!==bv&&x.tagName!=='SCRIPT'&&!x.inert);BV.inertes.forEach(x=>x.inert=true);
  bvEcran('accueil');
}
function demanderPosition(){
  /* la question du téléphone arrive maintenant, juste après l'explication ; la position obtenue sert dès l'ouverture de la carte */
  try{navigator.geolocation.getCurrentPosition(p=>{try{localStorage.setItem(CLE_MOI,JSON.stringify({lat:p.coords.latitude,lng:p.coords.longitude,t:Date.now()}))}catch(e){}},()=>{},{enableHighAccuracy:true,timeout:20000,maximumAge:60000})}catch(e){}
}
function bvEcran(k){
  const bv=$('bienvenue');bv.className='bv'+(k==='accueil'?' marque':'');bv.dataset.ecran=k;bv.onkeydown=null;
  if(k==='accueil'){
    bv.innerHTML=IL.fond+`<div class="bv-ecran"><div><span class="bv-nom">Itina Geo</span><h1 id="bvT" tabindex="-1">Chaque porte de Guinée a son adresse</h1><p>Trouvez-la, partagez-la et allez-y, guidé rue par rue.</p></div>
      <div class="bv-bas"><button type="button" class="bv-go jaune" id="bvGo">Commencer</button></div></div>`;
    $('bvGo').onclick=()=>BV.etat.then(x=>bvEcran(x==='granted'?'mode':'position'));
  }else if(k==='position'){
    const x=BV.pos,refus=x==='denied';
    bv.innerHTML=`<div class="bv-ecran"><div class="bv-haut"></div><div class="bv-illu">${IL.position}</div>
      <h1 id="bvT" tabindex="-1">${refus?'Votre position est bloquée':'Autorisez votre position exacte'}</h1>
      <p>${refus?'Pour la débloquer&nbsp;: Réglages du téléphone, puis votre navigateur (Safari, Chrome…), puis Position&nbsp;: choisissez «&nbsp;Demander&nbsp;» ou «&nbsp;Autoriser&nbsp;». En attendant, vous pouvez chercher les adresses à la main.'
        :x==='absent'?'Dans cet aperçu, le navigateur ne donne pas la position. Dans l\'appli, Itina Geo vous la demandera à cet écran.'
        :'Itina Geo s\'en sert pour vous montrer sur la carte, vous donner l\'adresse où vous êtes et vous guider jusqu\'à destination. Le téléphone va vous la demander&nbsp;: répondez «&nbsp;Autoriser&nbsp;».'}</p>
      <div class="bv-note">${I.cadenas}<span>Votre position reste sur votre téléphone&nbsp;: Itina Geo ne l'envoie à personne. Pas de publicité, pas de traceur.</span></div>
      <div class="bv-bas"><button type="button" class="bv-go" id="bvGo">Continuer</button>${x==='prompt'?'<button type="button" class="bv-lien" id="bvPlusTard">Plus tard</button>':''}</div></div>`;
    $('bvGo').onclick=()=>{if(x==='prompt')demanderPosition();bvEcran('mode')};
    const pt=$('bvPlusTard');if(pt)pt.onclick=()=>{BV.plusTard=true;bvEcran('mode')};
  }else if(k==='mode'){
    const M=[['voiture','Voiture','Voiture, taxi, camionnette',I.voiture],['moto','Moto','Moto, taxi-moto',I.moto],['pied','À pied','Marche',I.pied]];
    bv.innerHTML=`<div class="bv-ecran"><div class="bv-haut"></div><h1 id="bvT" tabindex="-1">Comment vous déplacez-vous&nbsp;?</h1><p>Les trajets s'adaptent à votre moyen de transport. Vous pourrez en changer à chaque trajet.</p>
      <div class="bv-modes" role="radiogroup" aria-labelledby="bvT">${M.map(([v,t,d,ic])=>`<button type="button" class="bv-mode" role="radio" data-bvm="${v}" aria-checked="${BV.choix===v}">${ic}<span><b>${t}</b><small>${d}</small></span></button>`).join('')}</div>
      <div class="bv-vide"></div><div class="bv-bas"><button type="button" class="bv-go" id="bvGo"${BV.choix?'':' disabled'}>Suivant</button></div></div>`;
    bv.querySelectorAll('[data-bvm]').forEach(b=>b.onclick=()=>{BV.choix=b.dataset.bvm;REG.mode=BV.choix;RT.mode=BV.choix;garderReg();
      bv.querySelectorAll('[data-bvm]').forEach(y=>y.setAttribute('aria-checked',y===b));$('bvGo').disabled=false});
    $('bvGo').onclick=()=>bvEcran('tuto');
  }else{
    const n=DIAPOS.length;
    bv.innerHTML=`<div class="bv-ecran"><div class="bv-haut"><button type="button" class="bv-passer" id="bvPasser">Passer</button></div>
      <div class="bv-fen" id="bvFen"><div class="bv-piste" id="bvPiste">${DIAPOS.map((d,i)=>`<section class="bv-diapo" aria-roledescription="écran" aria-label="${i+1} sur ${n}"${i?' aria-hidden="true"':''}><div class="bv-illu">${d.svg}</div><h1${i?'':' id="bvT" tabindex="-1"'}>${d.t}</h1><p>${d.p}</p></section>`).join('')}</div></div>
      <div class="bv-points" aria-hidden="true">${DIAPOS.map((d,i)=>`<i${i?'':' class="on"'}></i>`).join('')}</div>
      <div class="bv-bas"><button type="button" class="bv-go" id="bvGo">Suivant</button></div></div>`;
    const piste=$('bvPiste'),fen=$('bvFen'),pts=bv.querySelectorAll('.bv-points i'),go=$('bvGo');
    const aller=i=>{BV.diapo=Math.max(0,Math.min(n-1,i));piste.style.transform='translateX('+(-100*BV.diapo)+'%)';
      pts.forEach((x,j)=>x.classList.toggle('on',j===BV.diapo));piste.querySelectorAll('.bv-diapo').forEach((x,j)=>x.setAttribute('aria-hidden',j===BV.diapo?'false':'true'));
      go.textContent=BV.diapo===n-1?'C\'est parti':'Suivant'};
    go.onclick=()=>BV.diapo<n-1?aller(BV.diapo+1):finirBienvenue();
    $('bvPasser').onclick=finirBienvenue;
    /* glisser au doigt : l'écran suit le doigt, puis passe au suivant (ou revient) */
    let x0=null,y0=0,dx=0,horiz=null;
    fen.addEventListener('pointerdown',e=>{x0=e.clientX;y0=e.clientY;dx=0;horiz=null});
    fen.addEventListener('pointermove',e=>{if(x0==null)return;dx=e.clientX-x0;const dy=e.clientY-y0;if(horiz==null&&(Math.abs(dx)>8||Math.abs(dy)>8))horiz=Math.abs(dx)>Math.abs(dy);
      if(horiz){piste.classList.add('glisse');piste.style.transform='translateX(calc('+(-100*BV.diapo)+'% + '+dx+'px))'}});
    const lacher=()=>{if(x0==null)return;piste.classList.remove('glisse');const d=horiz?dx:0;x0=null;if(d<-50)aller(BV.diapo+1);else if(d>50)aller(BV.diapo-1);else aller(BV.diapo)};
    fen.addEventListener('pointerup',lacher);fen.addEventListener('pointercancel',lacher);
    bv.onkeydown=e=>{if(e.key==='ArrowRight')aller(BV.diapo+1);else if(e.key==='ArrowLeft')aller(BV.diapo-1)};
  }
  const h=$('bvT');if(h)try{h.focus({preventScroll:true})}catch(e){}
}
function finirBienvenue(){
  try{localStorage.setItem(CLE_BV,'1')}catch(e){}
  const bv=$('bienvenue');bv.classList.add('sortie');bv.onkeydown=null;
  setTimeout(()=>{if(BV.ouvert)return;bv.hidden=true;bv.innerHTML='';bv.className='bv'},300);
  BV.inertes.forEach(x=>x.inert=false);BV.inertes=[];
  BV.ouvert=false;const f=BV.apres;BV.apres=null;
  if(f&&!BV.plusTard)f();
  else if(BV.revoir&&ref&&SUIVI.id==null&&!guide&&!BV.plusTard)suivreMoi();
}

/* ---------- démarrage ---------- */
accueil();
if(!bvVu()&&location.hash.length<2)ouvrirBienvenue(false);
fetch('data/villes.json').then(r=>r.ok?r.json():null).then(j=>{VLIST=j&&Array.isArray(j.villes)?j.villes:null;
  if(VLIST)try{localStorage.setItem('itina-geo-publies',JSON.stringify(VLIST.filter(v=>v&&v.code).map(v=>v.code)))}catch(e){}
  menuVilles()}).catch(()=>{});
CA.charger({base:VI.dossier}).then(r=>{
  ref=r;window.__ref=r;
  const go=()=>{addLayers();appliquerAffichage();fondLocal();$('status').hidden=true;accueil();
    replierSources();
    const cible=openHash(),moi0=cible?null:lireMoi();
    /* dernière position connue dans ce plan, ou hors de tout plan : la carte s'ouvre dessus, au niveau de la rue */
    if(moi0&&(ref.quartierDe(moi0.lat,moi0.lng)||VILLE_IMPLICITE&&!villeDuPoint(moi0.lat,moi0.lng)))map.jumpTo({center:[moi0.lng,moi0.lat],zoom:17,padding:marges()});
    else if(!cible&&!vue){const b=ref.bbox;sansMarge();map.fitBounds([[b[0],b[1]],[b[2],b[3]]],{padding:marges(),duration:0})}
    /* comme Waze : la carte se cale sur ma position et me suit (pas quand un lien ouvre une adresse) */
    if(!cible){SUIVI.ville=VILLE_IMPLICITE;if(BV.ouvert)BV.apres=suivreMoi;else if(!BV.plusTard)suivreMoi()}
    drawNums();
    chargerConnect().then(async()=>{if(GL)await chargerEtabs();partageDemarrer()})};
  const essai=()=>{if(map.isStyleLoaded())go();else setTimeout(essai,80)};essai();
}).catch(e=>{
  if(deMemoire){try{localStorage.removeItem(VILLE_MEMO)}catch(x){}if(window.ITINA_DEMO)location.reload();else location.replace('./?ville=conakry');return}
  const absent=/\(404\)/.test(e&&e.message||'');
  /* lien vers un endroit dont le plan n'est pas encore publié : on rouvre un plan publié, et la fiche du lieu s'y affiche */
  if(absent&&PT0&&!LIEU_SEUL){const q=new URLSearchParams(location.search).get('ville'),repli=q&&q!==VILLE&&aVille(q)?q:aVille(lireMemo())&&lireMemo()!==VILLE?lireMemo():'conakry';
    if(window.ITINA_DEMO){try{localStorage.setItem(VILLE_MEMO,repli);sessionStorage.setItem('itina-lieu','1')}catch(x){}history.replaceState(null,'',location.pathname+location.hash);location.reload()}
    else location.replace('./?ville='+encodeURIComponent(repli)+'&lieu=1'+location.hash);return}
  erreurDemarrage(absent?'Plan de '+VI.nom+' pas encore publié':'Le plan de '+VI.nom+' ne s\'ouvre pas',
    absent?'Ce plan n\'est pas encore sur ce site'+(DEMO?'.':' (dossier <code>'+esc(VI.dossier)+'</code>). L\'équipe le fabrique avec le <a href="studio.html'+SUFFIXE+'">studio</a>.')
      :'Pas de connexion, ou le plan n\'est pas encore gardé sur cet appareil. Réessayez une fois connecté.'+(e&&e.message?' ('+esc(e.message)+')':''),true)});
window.__itinaGeo={REG,LIEUX,actifs,ajouterSignal,get RT(){return RT},get guide(){return guide},map,BV,get GN(){return GN_OK},get GND(){return GN_DATA},get RESEAU(){return RESEAU},bienvenue:o=>ouvrirBienvenue(!!o),get BULLES(){return BULLES.length},
  get ETABS(){return ETABS},get MES(){return MES},get CONNECT(){return CONNECT},get SIG(){return SIG},get SYN(){return SYN},synchroniser,garderLieux,avisSignal,chargerSignaux,ficheEtab:id=>ficheEtab(etab(id)),chargerEtabs,ajouterLieu,phLire,get PHOTOS_BASE(){return PHOTOS_BASE}};
})();
