<style>
/* Itina Geo : jour (plan de ville) et nuit (comme Waze) ; vert, jaune et rouge du drapeau pour aller, signaler et arriver */
:root{--accent:#12a05c;--on-accent:#ffffff;--accent-soft:#e2f5eb;--cyan:#0b8fd6;--jaune:#ffc400;--rouge:#e5383b;--panel2:#f1f3f6;
  --ombre:0 6px 24px rgba(16,24,40,.18);--font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--display:var(--font);--body:var(--font);
  --bg:#eef1f4;--panel:#ffffff;--fg:#111827;--muted:#5f6b7a;--line:#e4e8ee;--soft:#f1f3f6;--green:#12a05c;--on-green:#fff;--green-soft:#e2f5eb;--yellow:#e8b100;--red:#e5383b;--warn:#8a6100;--blue:#3e5a8a;
  --paper:#f2ede3;--street:#ffffff;--casing:#cdc3b1;--major:#ffd977;--major-casing:#cf9f35;--text:#3b3128;--halo:#fffdf6;--quartier:#a34a3a;--provisoire:#7a6e5c;
  --street-prop:#0f7a46;--street-keep:#3e5a8a;--street-todo:#b9a07a;--circ:#d9650b;--tram:#7b2d8e}
:root[data-theme="dark"]{--accent:#2fd27e;--on-accent:#04190c;--accent-soft:#163528;--cyan:#33ccff;--jaune:#ffcf33;--rouge:#ff5a5f;--panel2:#262e39;--ombre:0 8px 28px rgba(0,0,0,.55);
  --bg:#0f141b;--panel:#1b222c;--fg:#eef2f7;--muted:#9aa6b5;--line:#2c3542;--soft:#262e39;--green:#2fd27e;--on-green:#04190c;--green-soft:#163528;--yellow:#ffcf33;--red:#ff5a5f;--warn:#ffcf33;--blue:#7fb2ff;
  --paper:#16202a;--street:#334050;--casing:#0d131a;--major:#5a6a82;--major-casing:#19222e;--text:#d9e0ea;--halo:#16202a;--quartier:#eaa796;--provisoire:#a9b4c2;
  --street-prop:#3fc483;--street-keep:#8fb0ea;--street-todo:#8a7a60;--circ:#ff9a45;--tram:#d08be6;color-scheme:dark}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg)}
#map{position:fixed;inset:0;background:var(--paper)}
button{font-family:inherit}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
/* barre du haut */
.haut{position:fixed;z-index:20;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:10px;pointer-events:none}
.haut>*{pointer-events:auto}
.barre{flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:54px;padding:0 7px 0 0;border-radius:999px;background:var(--panel);box-shadow:var(--ombre)}
.barre-q{flex:1;min-width:0;height:100%;display:flex;align-items:center;gap:10px;padding:0 4px 0 16px;border:0;border-radius:999px;background:none;color:var(--muted);cursor:pointer;text-align:left;font:600 16px var(--font)}
.barre .q{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ville{flex:none;display:inline-flex;align-items:center;gap:4px;height:40px;padding:0 12px;border:0;border-radius:999px;background:var(--panel2);color:var(--fg);font:700 14px var(--font);cursor:pointer}
.ville .ic{width:16px;height:16px}
.rond{flex:none;width:54px;height:54px;border:0;border-radius:50%;background:var(--panel);color:var(--fg);box-shadow:var(--ombre);display:grid;place-items:center;cursor:pointer}
.menu-villes{position:fixed;z-index:30;top:calc(env(safe-area-inset-top,0px) + 72px);right:max(78px,env(safe-area-inset-right,0px));list-style:none;margin:0;padding:6px;background:var(--panel);border-radius:16px;box-shadow:var(--ombre);min-width:200px}
.menu-villes a{display:flex;align-items:center;min-height:46px;padding:0 14px;border-radius:12px;color:var(--fg);text-decoration:none;font-weight:600}
.menu-villes a:hover,.menu-villes a:focus-visible{background:var(--panel2)}
.menu-villes .sep{padding:10px 14px 4px;font:700 11px var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.menu-villes .gm{margin-top:4px;border-top:1px solid var(--line);padding-top:4px}.menu-villes .gm a{font-weight:500;color:var(--muted)}
.menu-villes a[aria-current="page"]{color:var(--accent)}.menu-villes a[aria-current="page"]::after{content:"";margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--accent)}
/* boutons ronds sur la carte */
.fabs{position:fixed;z-index:15;right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 80px);display:flex;flex-direction:column;gap:10px}
.fab{width:48px;height:48px;border:0;border-radius:50%;background:var(--panel);color:var(--fg);box-shadow:var(--ombre);display:grid;place-items:center;cursor:pointer;font:800 11px var(--font)}
.fab[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.fab-zoom{display:flex;flex-direction:column;border-radius:24px;background:var(--panel);box-shadow:var(--ombre);overflow:hidden}
.fab-zoom .fab{box-shadow:none;border-radius:0;font:500 28px/1 var(--font)}.fab-zoom .fab+.fab{border-top:1px solid var(--line)}
.fab-zoom .fab:disabled{color:var(--line);cursor:default}
.maj{position:fixed;z-index:25;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 76px);width:min(520px,calc(100vw - 24px));display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;border-radius:18px;background:var(--panel);color:var(--fg);box-shadow:var(--ombre);font:600 14px/1.35 var(--font)}
.maj span{flex:1}.maj button{flex:none;height:40px;padding:0 14px;border:0;border-radius:12px;background:var(--accent);color:var(--on-accent);font:700 14px var(--font);cursor:pointer}
.maj .majx{width:40px;padding:0;background:var(--panel2);color:var(--fg);font-size:20px}
.fab.boussole svg{transition:transform .2s}
.signaler{position:fixed;z-index:16;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(var(--feuille,160px) + 14px);width:62px;height:62px;border:0;border-radius:20px;background:var(--jaune);color:#2b2100;box-shadow:0 6px 18px rgba(0,0,0,.3);display:grid;place-items:center;cursor:pointer}
.signaler svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
/* feuille du bas (à gauche sur ordinateur) */
.feuille{position:fixed;z-index:18;left:0;right:0;bottom:0;max-height:min(50vh,560px);overflow:auto;overscroll-behavior:contain;background:var(--panel);color:var(--fg);border-radius:24px 24px 0 0;box-shadow:0 -6px 28px rgba(0,0,0,.2);padding:0 18px calc(18px + env(safe-area-inset-bottom,0px));transition:max-height .25s}
.feuille.grande{max-height:88vh}
.poignee{position:sticky;top:0;z-index:2;display:block;width:100%;height:24px;margin:0 0 4px;border:0;background:var(--panel);cursor:pointer}
.poignee::after{content:"";position:absolute;left:50%;top:9px;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:var(--line)}
.sur{font:700 13px var(--font);color:var(--muted);display:flex;align-items:center;gap:8px;min-height:24px}
.sur.ici::before{content:"";width:10px;height:10px;border-radius:50%;background:#2a7de1;box-shadow:0 0 0 3px rgba(42,125,225,.25);flex:none}
.sur.tram::before{content:"";width:10px;height:10px;border-radius:50%;border:2.5px solid var(--tram);box-sizing:border-box;flex:none}
.fermer{margin-left:auto;width:38px;height:38px;flex:none;border:0;border-radius:50%;background:var(--panel2);color:var(--fg);display:grid;place-items:center;cursor:pointer}
.fermer .ic{width:18px;height:18px}
.feuille h1{font:800 25px/1.15 var(--font);letter-spacing:-.02em;margin:4px 0 4px;text-wrap:balance}
.feuille h2{font:800 21px/1.2 var(--font);letter-spacing:-.01em;margin:4px 0 4px}
.feuille h3{font:700 13px var(--font);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:18px 0 6px}
.l2{font-size:15px;color:var(--fg)}
.info{font-size:13.5px;color:var(--muted);margin:8px 0 0;line-height:1.45}
.info.prov{color:var(--warn)}
.ded{margin:10px 0 0;padding:9px 11px;border-left:3px solid var(--quartier);background:color-mix(in srgb,var(--quartier) 8%,transparent);border-radius:0 10px 10px 0;font-size:13.5px;line-height:1.4}
.puces{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 2px}
.puce{font:600 12.5px ui-monospace,SFMono-Regular,Menlo,monospace;padding:6px 10px;border-radius:9px;background:var(--accent-soft);color:var(--accent);border:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:32px;max-width:100%;overflow-wrap:anywhere;text-align:left}
.puce.pc{background:var(--panel2);color:var(--fg)}
.puce .ic{width:14px;height:14px}
.actions{display:flex;gap:8px;margin-top:14px}
.bt{flex:1 1 auto;min-height:50px;padding:0 16px;border:0;border-radius:15px;background:var(--panel2);color:var(--fg);font:700 15px var(--font);display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none}
.bt.vert{background:var(--accent);color:var(--on-accent)}
.bt.rouge{background:color-mix(in srgb,var(--rouge) 14%,transparent);color:var(--rouge)}
.bt.carre{flex:0 0 50px;padding:0}
.bt[aria-pressed="true"]{color:var(--jaune)}
.bt[disabled]{opacity:.45;cursor:default}
.bt .ic{width:20px;height:20px}
.bt.vert .plein{fill:currentColor;stroke:none}
.plus{display:grid;gap:6px;margin-top:8px}
.plus .bt{justify-content:flex-start}
/* accueil */
.salut{font:800 24px/1.15 var(--font);letter-spacing:-.02em;margin:2px 0 2px}
.raccourcis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.racc{display:flex;align-items:center;gap:10px;padding:12px;border:0;border-radius:16px;background:var(--panel2);color:var(--fg);cursor:pointer;text-align:left;min-height:64px}
.racc b{display:block;font-size:15px}.racc .tx>span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.racc .tx{min-width:0}
.emoji{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.emoji .ic{width:21px;height:21px}
.e-maison{background:#ffe9d6;color:#c2410c}.e-travail{background:#fff1c2;color:#a16207}.e-etoile{background:#fff4c4;color:#b78a00}.e-histo{background:var(--panel2);color:var(--muted)}
.e-quartier{background:#e7e9ff;color:#4338ca}.e-gps{background:#dff3ff;color:#0369a1}.e-alerte{background:#fff1c2;color:#a16207}.e-tram{background:#f3e3fb;color:#7b2d8e}
:root[data-theme="dark"] .e-maison{background:#3a2a1e;color:#fdba74}:root[data-theme="dark"] .e-travail{background:#3a321a;color:#fcd34d}:root[data-theme="dark"] .e-etoile{background:#3a3417;color:#fde047}
:root[data-theme="dark"] .e-quartier{background:#262a52;color:#a5b4fc}:root[data-theme="dark"] .e-gps{background:#14303f;color:#7dd3fc}:root[data-theme="dark"] .e-alerte{background:#3a321a;color:#fcd34d}:root[data-theme="dark"] .e-tram{background:#35213d;color:#e9b6f7}
.liste{list-style:none;margin:0;padding:0}
.ligne{display:flex;align-items:center;gap:14px;width:100%;padding:12px 2px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--fg);text-align:left;cursor:pointer;font:inherit}
.liste li:last-child .ligne{border-bottom:0}
.ligne .tx{flex:1;min-width:0}.ligne b{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ligne small{display:block;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ligne .def{color:var(--cyan);font-weight:600}
.ligne .km{flex:none;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.avec-oter{display:flex;align-items:center;border-bottom:1px solid var(--line)}.avec-oter .ligne{border-bottom:0}.liste li.avec-oter:last-child{border-bottom:0}
.oter{flex:none;width:40px;height:40px;border:0;border-radius:50%;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.oter .ic{width:16px;height:16px}
.pied{display:flex;flex-wrap:wrap;gap:4px 16px;margin:16px 0 2px;font-size:13px;color:var(--muted)}
.pied a{color:var(--muted);font-weight:600}
/* itinéraire */
.pts{display:grid;grid-template-columns:16px 1fr;gap:8px 10px;align-items:center;font-size:14.5px;margin:8px 0}
.pts i{width:12px;height:12px;border-radius:50%;display:block;margin:0 auto}.pts .a{border:3px solid #2a7de1;box-sizing:border-box}.pts .b{background:var(--rouge)}
.pts span{min-width:0;overflow-wrap:anywhere}
.lien{border:0;background:none;color:var(--cyan);font:700 13px var(--font);margin-left:8px;padding:4px 0;cursor:pointer}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--panel2);padding:4px;border-radius:14px;margin:10px 0}
.modes button{border:0;background:none;padding:9px 4px;border-radius:11px;font:700 14px var(--font);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.modes button .ic{width:18px;height:18px}
.modes button[aria-pressed="true"]{background:var(--panel);color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.trajet{display:block;width:100%;margin:8px 0 0;padding:12px 14px;border:2px solid var(--line);border-radius:18px;background:var(--panel);color:var(--fg);text-align:left;cursor:pointer;font:inherit}
.trajet[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.trajet .ha{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.trajet .du{font:800 26px/1.1 var(--font);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.trajet .ar{font-size:14px;font-weight:600;color:var(--muted)}
.trajet .ec{font-size:13px;font-weight:700;color:var(--rouge)}
.trajet .vi{font-size:14px;color:var(--muted);margin-top:2px}
.trajet .ev{display:flex;align-items:center;gap:6px;font-size:13.5px;margin-top:6px;color:var(--accent);font-weight:600}
.trajet .ev.al{color:#c2410c}:root[data-theme="dark"] .trajet .ev.al{color:#fdba74}
.trajet .ev .ic{width:16px;height:16px}
details.etapes{margin-top:12px;border-top:1px solid var(--line);padding-top:6px}
details.etapes summary{cursor:pointer;font-weight:700;font-size:14px;min-height:36px;display:flex;align-items:center;color:var(--muted)}
details.etapes ol{list-style:none;margin:0;padding:0}
details.etapes li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
details.etapes li span:last-child{color:var(--muted);white-space:nowrap}
/* panneaux plein écran : recherche et paramètres */
.panneau{position:fixed;inset:0;z-index:50;background:var(--panel);color:var(--fg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.p-tete{flex:none;display:flex;align-items:center;gap:8px;padding:12px 12px 8px}
.champ{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:54px;padding:0 8px 0 4px;border-radius:999px;background:var(--panel2)}
.champ input{flex:1;min-width:0;border:0;background:none;color:var(--fg);font:600 17px var(--font);padding:0;min-height:44px;outline:none}
.champ input::placeholder{color:var(--muted);font-weight:500}
.champ input::-webkit-search-cancel-button,.champ input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.rbt{flex:none;width:44px;height:44px;border:0;border-radius:50%;background:none;color:var(--fg);display:grid;place-items:center;cursor:pointer}
.rbt.ecoute{background:var(--rouge);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--rouge) 25%,transparent)}}
.p-titre{font:800 20px var(--font);flex:1}
.p-corps{flex:1;overflow:auto;padding:4px 16px calc(24px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.p-corps h3{font:600 14px var(--font);color:var(--muted);margin:20px 2px 4px}
.tuiles{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.tuiles::-webkit-scrollbar{display:none}
.tuile{flex:none;width:112px;min-height:88px;padding:12px 10px;border:0;border-radius:18px;background:var(--panel2);color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;font:700 14px var(--font)}
.tuile[aria-pressed="true"]{outline:2px solid var(--accent)}
.mode-choix{display:flex;align-items:center;gap:10px;margin:4px 2px 8px;padding:10px 12px;border-radius:14px;background:var(--accent-soft);color:var(--fg);font-size:14px;font-weight:600}
.vide{padding:14px 2px;color:var(--muted);font-size:14.5px;line-height:1.45}
.vide a{color:var(--cyan)}
details.commune{border-bottom:1px solid var(--line)}
details.commune summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:54px;font-weight:700;font-size:16px}
details.commune summary::-webkit-details-marker{display:none}
details.commune summary small{color:var(--muted);font-weight:600}
/* paramètres, comme les réglages de Waze */
.reglage{border-bottom:1px solid var(--line)}
.reglage>summary{list-style:none;display:flex;align-items:center;gap:14px;min-height:64px;cursor:pointer;font-size:16.5px;font-weight:600}
.reglage>summary::-webkit-details-marker{display:none}
.reglage>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2.4px solid var(--muted);border-bottom:2.4px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
.reglage[open]>summary::after{transform:rotate(45deg)}
.pastille{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff}
.pastille .ic{width:21px;height:21px}
.r-corps{padding:2px 0 16px 56px;display:grid;gap:12px;font-size:15px}
.r-ligne{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.r-ligne small{display:block;color:var(--muted);font-size:13px}
.inter{position:relative;flex:none;width:52px;height:32px;border:0;border-radius:16px;background:var(--line);cursor:pointer;transition:background .15s}
.inter::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.inter[aria-checked="true"]{background:var(--accent)}.inter[aria-checked="true"]::after{left:23px}
.segs{display:flex;gap:4px;background:var(--panel2);padding:4px;border-radius:12px}
.segs button{flex:1;border:0;background:none;padding:8px 6px;border-radius:9px;font:700 13.5px var(--font);color:var(--muted);cursor:pointer}
.segs button[aria-pressed="true"]{background:var(--panel);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.p-version{text-align:center;color:var(--muted);font-size:13px;margin:22px 0 8px}
/* signalements */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.m-boite{width:min(520px,100%);background:var(--panel);color:var(--fg);border-radius:26px 26px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.35)}
.m-boite h2{font:800 21px var(--font);margin:0 0 4px;display:flex;align-items:center}

.sig-g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sig-b{border:0;background:var(--panel2);color:var(--fg);border-radius:18px;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;font:700 13.5px/1.2 var(--font);text-align:center}
.sig-r{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff}
.sig-r svg,.mk-sig svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.mk-sig{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4);cursor:pointer}
.mk-sig svg{width:20px;height:20px}
/* repères, position, messages */
.pin{width:32px;height:44px;margin:-44px 0 0 -16px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.me{width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:#2a7de1;border:3px solid #fff;box-shadow:0 0 0 7px rgba(42,125,225,.25)}
.toast{position:fixed;z-index:70;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 76px);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.pick{position:fixed;z-index:25;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 78px);background:var(--panel);color:var(--fg);border:2px solid var(--cyan);border-radius:16px;padding:8px 8px 8px 14px;font-weight:700;display:flex;gap:10px;align-items:center;box-shadow:var(--ombre);max-width:calc(100% - 24px)}
.pick .bt{min-height:40px;flex:none}
.status{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:var(--bg);padding:24px;text-align:center}
.status div{max-width:440px}
.status .logo{width:72px;height:72px;margin:0 auto 14px;display:block}
.status h3{font:800 20px var(--font);margin:0 0 6px}
.status .err-act{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0 0}.status .err-act .bt{text-decoration:none;flex:0 0 auto}
.maplibregl-ctrl-bottom-right{bottom:calc(var(--feuille,160px) + 4px)}
.maplibregl-ctrl-bottom-left{bottom:calc(var(--feuille,160px) + 4px)}
.maplibregl-ctrl-attrib,.maplibregl-ctrl-attrib.maplibregl-compact{background:color-mix(in srgb,var(--panel) 85%,transparent);color:var(--fg)}.maplibregl-ctrl-attrib a{color:var(--fg)}
.maplibregl-ctrl-group{background:var(--panel)}.maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:var(--icones,none)}
:root[data-theme="dark"]{--icones:invert(1)}
.maplibregl-ctrl-scale{background:color-mix(in srgb,var(--panel) 70%,transparent);color:var(--fg);border-color:var(--fg)}
@media (max-width:899px){.maplibregl-ctrl-zoom-in,.maplibregl-ctrl-zoom-out,.maplibregl-ctrl-compass,.maplibregl-ctrl-scale{display:none!important}}
/* établissements, comme sur Google Maps */
.cat-r{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff}
.cat-r svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cat-r.petit{width:24px;height:24px}.cat-r.petit svg{width:14px;height:14px}
.etat-o{color:#12a05c;font-weight:700}.etat-f{color:#d1343a;font-weight:700}
:root[data-theme="dark"] .etat-o{color:#2fd27e}:root[data-theme="dark"] .etat-f{color:#ff7a7f}
.badge{display:inline-flex;align-items:center;font:700 11.5px var(--font);padding:3px 8px;border-radius:999px}
.badge.ok{background:#dcfce7;color:#166534}.badge.att{background:#fef3c7;color:#92400e}
:root[data-theme="dark"] .badge.ok{background:#14532d;color:#bbf7d0}:root[data-theme="dark"] .badge.att{background:#422006;color:#fde68a}
.horaires{list-style:none;margin:0;padding:0}.horaires li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}.horaires li:last-child{border-bottom:0}
.horaires li span:last-child{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.coord{list-style:none;margin:0;padding:0}.coord li{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:15px}.coord a{color:var(--cyan);font-weight:600;text-decoration:none;overflow-wrap:anywhere}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:2px -16px 4px;padding:2px 16px 8px}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 6px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:600 14px var(--font);cursor:pointer}
.chip .cat-r{width:28px;height:28px}.chip .cat-r svg{width:16px;height:16px}
.filtre-cat{position:fixed;z-index:19;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;align-items:center;gap:8px;padding:5px;border-radius:999px;background:var(--panel);color:var(--fg);box-shadow:var(--ombre);font-weight:700;max-width:calc(100% - 140px);white-space:nowrap}
.filtre-cat span{overflow:hidden;text-overflow:ellipsis}.filtre-cat .cat-r{width:30px;height:30px}.filtre-cat .cat-r svg{width:17px;height:17px}.filtre-cat .fermer{width:32px;height:32px;margin:0}
.e-ajout{background:#dcfce7;color:#15803d}:root[data-theme="dark"] .e-ajout{background:#14532d;color:#86efac}
#fAjout{display:grid;gap:4px;padding-bottom:20px}
.a-pos{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--panel2);margin:4px 0 8px}
.a-pos .tx{flex:1;min-width:0}.a-pos b{display:block}.a-pos small{display:block;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.a-l{display:block;font-weight:700;font-size:14.5px;margin-top:12px}
.a-l small{font-weight:500;color:var(--muted)}
.a-in{width:100%;min-height:48px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--fg);font:500 16px var(--font)}
textarea.a-in{resize:vertical;line-height:1.4}
.a-in:focus{outline:2px solid var(--accent);outline-offset:0}
.a-err{margin:2px 0 0;color:var(--rouge);font-size:13.5px;font-weight:600}.a-err:empty{display:none}
.a-c{display:flex;align-items:flex-start;gap:10px;font-size:14.5px;margin-top:12px;line-height:1.35}.a-c input{width:20px;height:20px;flex:none;margin:1px 0 0;accent-color:var(--accent)}
.a-cats{display:grid;gap:10px;max-height:330px;overflow:auto;border:1px solid var(--line);border-radius:16px;padding:10px;margin-top:6px}
.a-gt{font:700 11.5px var(--font);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:2px 0 6px}
.a-grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:6px}
.a-cat{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:12px;border:2px solid transparent;background:var(--panel2);color:var(--fg);font:600 13px/1.2 var(--font);text-align:left;cursor:pointer;min-height:44px}
.a-cat .cat-r{width:30px;height:30px}.a-cat .cat-r svg{width:17px;height:17px}
.a-cat[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.a-h{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.a-h select{grid-column:1/-1}.a-h label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.a-n{justify-self:end;color:var(--muted);font-size:12px}
.a-ok{margin-top:16px;width:100%}
.piege{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.code-box{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:12px;padding:14px;border-radius:16px;background:var(--accent-soft)}
.code-box small{flex:1 0 100%;color:var(--muted);font-weight:600}.code-box b{flex:1;font:800 22px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em}.code-box .bt{flex:none;min-height:42px}
.mini{display:grid;gap:8px;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:16px}
.mini label{display:grid;gap:4px;font-weight:600;font-size:14px}.mini input,.mini textarea{min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--fg);font:500 15px var(--font)}
.segs.col{flex-wrap:wrap}.segs.col button{flex:1 1 45%}
.pick #pickMoi{flex:none}
/* photos des lieux : galerie de la fiche, visionneuse, formulaire */
.photos{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:12px -18px 2px;padding:0 18px}.photos::-webkit-scrollbar{display:none}
.ph{position:relative;flex:none;height:132px;min-width:96px;max-width:230px;padding:0;border:0;border-radius:14px;overflow:hidden;background:var(--panel2);cursor:zoom-in}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph-att{position:absolute;left:6px;bottom:6px;font:700 11px var(--font);background:rgba(0,0,0,.62);color:#fff;padding:3px 8px;border-radius:999px}
.visio{position:fixed;inset:0;z-index:95;background:#000;display:grid;place-items:center;touch-action:pan-y}
.visio img{max-width:100%;max-height:calc(100% - 120px);object-fit:contain;user-select:none;-webkit-user-drag:none}
.v-haut{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px 18px;color:#fff;font-weight:700;background:linear-gradient(rgba(0,0,0,.6),transparent)}
.v-haut span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-fermer,.v-nav{border:0;border-radius:50%;width:46px;height:46px;display:grid;place-items:center;background:rgba(255,255,255,.14);color:#fff;cursor:pointer}
.v-nav{position:absolute;top:50%;transform:translateY(-50%)}.v-prec{left:12px}.v-suiv{right:12px}
.v-compte{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);left:0;right:0;text-align:center;color:#e5e7eb;font-size:14px;font-weight:600}
.a-photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.a-photos:empty{display:none}
.a-ph{position:relative;width:86px;height:86px;border-radius:12px;overflow:hidden;background:var(--panel2)}
.a-ph img{width:100%;height:100%;object-fit:cover;display:block}
.a-ph button{position:absolute;top:4px;right:4px;min-width:28px;height:28px;padding:0 6px;border-radius:999px;border:0;background:rgba(0,0,0,.66);color:#fff;display:grid;place-items:center;font:700 11px var(--font);cursor:pointer}
.a-ph button .ic{width:14px;height:14px}
.a-ajph{justify-self:start;margin-top:8px;cursor:pointer;min-height:44px}
.actions.defile{overflow-x:auto;scrollbar-width:none;margin-left:-18px;margin-right:-18px;padding:0 18px 2px}.actions.defile::-webkit-scrollbar{display:none}
.actions.defile .bt{flex:none;white-space:nowrap}.actions.defile .bt.vert{padding:0 22px}.actions.defile .bt.carre{width:50px}
/* ordinateur : la feuille et la recherche à gauche, comme une appli */
@media (min-width:900px){
  .haut{right:auto;width:400px}
  .feuille{left:16px;right:auto;top:84px;bottom:auto;width:400px;max-height:calc(100vh - 100px);border-radius:24px;box-shadow:var(--ombre);padding-bottom:18px}
  .feuille.grande{max-height:calc(100vh - 100px)}
  .poignee{display:none}
  .feuille>.c{padding-top:16px}
  .signaler{bottom:24px;right:24px}
  .panneau{right:auto;width:432px;box-shadow:var(--ombre)}
  #param.panneau{left:auto;right:0}
  .menu-villes{right:auto;left:300px}
  .maplibregl-ctrl-bottom-right{bottom:96px}.maplibregl-ctrl-bottom-left{bottom:4px;left:432px}
  .modal{align-items:center}.m-boite{border-radius:26px}
}
</style>
</head>
<body>
<div id="map" role="application" aria-label="Carte : touchez une porte pour obtenir son adresse"></div>
<header class="haut">
  <div class="barre"><button type="button" class="barre-q" id="barre" aria-label="Rechercher une adresse"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span class="q">Où allez-vous ?</span></button><button type="button" class="ville" id="villeBtn" aria-haspopup="true" aria-expanded="false" aria-label="Changer de ville" hidden><span id="villeNom"></span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></div>
  <button type="button" class="rond" id="btnParam" aria-label="Paramètres"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.4"/><circle cx="10" cy="17" r="2.4"/></svg></button>
</header>
<ul class="menu-villes" id="villeMenu" hidden></ul>
<div class="fabs">
  <div class="fab-zoom" role="group" aria-label="Zoom"><button class="fab" type="button" id="fabPlus" aria-label="Zoomer" title="Zoomer">+</button><button class="fab" type="button" id="fabMoins" aria-label="Dézoomer" title="Dézoomer">−</button></div>
  <button class="fab boussole" type="button" id="fabNord" aria-label="Remettre le nord en haut" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l4 9h-8z" fill="#e5383b" stroke="#e5383b"/><path d="M12 21l-4-9h8z"/></svg></button>
  <button class="fab" type="button" id="fabSat" aria-label="Vue satellite" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 8l9 5 9-5z"/><path d="m3 13 9 5 9-5"/></svg></button>
  <button class="fab" type="button" id="fabLoc" aria-label="Ma position"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4.5 20.3l.7.7L12 18l6.8 3 .7-.7z"/></svg></button>
</div>
<div class="maj" id="maj" role="status" hidden><span id="majTxt"></span><button type="button" id="majGo">Mettre à jour</button><button type="button" class="majx" id="majX" aria-label="Plus tard">×</button></div>
<button class="signaler" type="button" id="btnSignaler" aria-label="Signaler un événement sur la route"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 5 36 33H4z"/><path d="M20 15v11M14.5 20.5h11"/></svg></button>
<section class="feuille" id="feuille" aria-live="polite"><button type="button" class="poignee" id="poignee" aria-label="Agrandir ou réduire"></button><div class="c" id="fc"></div></section>

<section class="panneau" id="recherche" hidden aria-label="Recherche">
  <div class="p-tete">
    <button type="button" class="rbt" id="rRetour" aria-label="Retour"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <form class="champ" id="rForm" role="search" autocomplete="off">
      <input type="search" id="q" placeholder="Adresse, rue, quartier, GN-… ou Plus Code" aria-label="Rechercher" maxlength="120" enterkeyhint="search">
      <button type="button" class="rbt" id="rEffacer" aria-label="Effacer" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/></svg></button>
      <button type="button" class="rbt" id="rMicro" aria-label="Recherche vocale" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    </form>
  </div>
  <div class="p-corps" id="rCorps"></div>
</section>

<section class="panneau" id="param" hidden aria-label="Paramètres">
  <div class="p-tete"><button type="button" class="rbt" id="pRetour" aria-label="Fermer les paramètres"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><div class="p-titre">Paramètres</div></div>
  <div class="p-corps" id="pCorps"></div>
</section>

<div class="modal" id="signal" hidden role="dialog" aria-modal="true" aria-labelledby="sigTitre"><div class="m-boite">
  <h2 id="sigTitre">Signaler<button type="button" class="fermer" id="sigFermer" aria-label="Fermer"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></h2>
  <p id="sigTexte">Ce que vous voyez sur la route : vos itinéraires en tiennent compte. Le signalement reste sur ce téléphone.</p>
  <div class="sig-g" id="sigGrille"></div>
</div></div>
<section class="panneau" id="ajout" hidden aria-label="Ajouter un lieu">
  <div class="p-tete"><button type="button" class="rbt" id="aRetour" aria-label="Fermer"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><div class="p-titre" id="aTitre">Ajouter un lieu</div></div>
  <div class="p-corps" id="aCorps"></div>
</section>
<div class="filtre-cat" id="filtreCat" hidden></div>
<div class="visio" id="visio" hidden role="dialog" aria-modal="true" aria-label="Photos du lieu"><div class="v-haut"><span id="vTitre"></span><button type="button" class="v-fermer" id="vFermer" aria-label="Fermer"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><img id="vImg" alt=""><button type="button" class="v-nav v-prec" id="vPrec" aria-label="Photo précédente"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><button type="button" class="v-nav v-suiv" id="vSuiv" aria-label="Photo suivante"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button><div class="v-compte" id="vCompte"></div></div>
<div class="pick" id="pick" hidden><span id="pickTxt">Touchez la carte</span><button class="bt" type="button" id="pickMoi" hidden>Ma position</button><button class="bt" type="button" id="pickNo">Annuler</button></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="status" id="status"><div><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><clipPath id="logoC"><rect width="64" height="64" rx="16"/></clipPath><g clip-path="url(#logoC)"><rect width="64" height="64" fill="#0d3a28"/><path d="M-4 43 68 29M19 -4 28 68M45 -4 53 68" stroke="#22603f" stroke-width="5.5" stroke-linecap="round" fill="none"/></g><path d="M32 55s15-15.8 15-27a15 15 0 0 0-30 0c0 11.2 15 27 15 27z" fill="#fcd116"/><circle cx="32" cy="28" r="6" fill="#ce1126"/></svg><h3>Itina Geo</h3><p class="hint">Chargement du plan…</p></div></div>

<script src="sdk/conakry-adresses.js"></script>
<script src="sdk/guidage.js"></script>
<script src="sdk/lieux.js"></script>
<script src="lib/guinee.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id),CA=window.ConakryAdresses;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
let toastT;const toast=m=>{const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},3400)};
const fmtD=m=>m<1000?Math.round(m/10)*10+' m':(m/1000).toFixed(m<10000?1:0).replace('.',',')+' km';
/* durée : minutes arrondies d'abord (1 h 59 min 40 s donne « 2 h 00 », jamais « 1 h 60 ») */
const fmtT=s=>{if(s<60)return'1 min';const m=Math.round(s/60);return m<60?m+' min':Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')};
const heure=d=>d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});

function ajouterSignal(type,p,enRoute){

/* zones à éviter pour le calcul des trajets (route coupée ou inondée : jamais ; embouteillage : plus lent) */
const eviterListe=mode=>REG.eviter?actifs().filter(s=>mode!=='pied'||SIGS[s.type].eviter.facteur===Infinity).map(s=>Object.assign({lat:s.lat,lng:s.lng},SIGS[s.type].eviter)):[];
/* signalements le long d'un trajet : à moins de 60 m de la ligne, avec la distance depuis le départ. Route coupée ou inondée :
   le trajet ne la franchit jamais ; elle n'est sur le trajet que s'il passe à 12 m au plus (départ ou arrivée juste avant la coupure) */
function surTrajet(r){
  const L=r.ligne,out=[];if(!L||L.length<2)return out;
  const k=111320*Math.cos(L[0][0]*Math.PI/180);
  for(const s of actifs()){
    let best=Infinity,le=0,cum=0;
    for(let i=1;i<L.length;i++){const ax=L[i-1][1]*k,ay=L[i-1][0]*110574,vx=L[i][1]*k-ax,vy=L[i][0]*110574-ay,l2=vx*vx+vy*vy||1,px=s.lng*k,py=s.lat*110574,t=Math.max(0,Math.min(1,((px-ax)*vx+(py-ay)*vy)/l2)),d=Math.hypot(px-ax-t*vx,py-ay-t*vy),seg=Math.sqrt(l2);
      if(d<best){best=d;le=cum+t*seg}cum+=seg}
    if(best<=(SIGS[s.type].eviter.facteur===Infinity?12:60))out.push({s,le});
  }
  return out.sort((x,y)=>x.le-y.le);
}

/* ---------- itinéraire : comme Waze, le meilleur trajet et un bis, l'heure d'arrivée, les signalements sur le chemin ---------- */
let RT={de:null,deTxt:'',deGps:false,a:null,mode:REG.mode,routes:[],choix:0};

function startRoute(a){

const effacerRoute=()=>{for(const s of['route','route-alt'])if(map.getSource(s))map.getSource(s).setData(FC())};

    ${r?`<div class="actions">${gps?`<button class="bt vert" type="button" id="rGo">${I.aller}Y aller</button><button class="bt" type="button" id="rApercu">${I.apercu}Aperçu</button>`:`<button class="bt vert" type="button" id="rApercu">${I.apercu}Aperçu du trajet</button>`}<button class="bt carre" type="button" id="rPartage" aria-label="Partager l'heure d'arrivée">${I.partager}</button></div>
      ${gps?'':'<p class="info">Départ choisi sur la carte : l\'aperçu montre le trajet étape par étape et le joue en démonstration. Le guidage en direct part de votre position GPS, une fois sur place.</p>'}

const ICT={adresse:I.lieu,voie:I.rue,quartier:I.quartier,commune:I.ville,pluscode:I.code,position:I.gps};
function rendreResultats(){
  const v=$('q').value.trim(),C=$('rCorps');$('rEffacer').hidden=!v;
  if(!v){rendreVide();return}
  let l=ref.chercher(v,{max:10});
  /* à score égal, le plus proche de vous d'abord (comme Waze) */
  const frais=mePos&&Date.now()-mePosT<600000;
  if(frais)l=l.map((r,i)=>({r,i,d:distLL([mePos.lat,mePos.lng],[r.lat,r.lng])})).sort((x,y)=>(y.r.score||0)-(x.r.score||0)||x.d-y.d).map(x=>x.r);
  rList=l;rSel=-1;
  const id=v.toUpperCase(),autre=/^GN-\d{5}-[A-Z0-9]{1,40}-\d{1,5}$/.test(id)&&villeDuCode(id);
  const cat=GL?GL.categorieDe(v):null,le=GL?GL.chercher(ETABS,v,{pres:centreRecherche(),max:cat?30:6}).filter(x=>cat?x.lieu.cat===cat||x.score>=0.85:x.score>=0.85):[];
  const htmlE=le.length?`<h3>${cat?esc(nomPluriel(cat))+' à proximité':'Lieux'}</h3><ul class="liste">${le.map(x=>ligneEtab(x.lieu,0,x.d)).join('')}</ul>${cat?`<div class="actions"><button class="bt" type="button" id="rVoirCat">${I.carte}Voir sur la carte</button></div>`:''}${l.length?'<h3>Adresses</h3>':''}`
    :cat?`<p class="vide">Aucun lieu de cette catégorie n'est encore enregistré. <button class="lien" type="button" id="rAjoutCat">Ajouter un lieu</button></p>`:'';
  C.innerHTML=htmlE+(le.length&&!l.length?'':l.length?`<ul class="liste">${l.map((r,i)=>{const t=r.adresse?r.adresse.ligne1:r.libelle.split(' · ')[0],s=r.adresse?r.adresse.ligne2:r.libelle.split(' · ').slice(1).join(' · ')||r.type;
      return `<li><button type="button" class="ligne" data-i="${i}"><span class="emoji ${r.type==='quartier'||r.type==='commune'?'e-quartier':'e-histo'}">${ICT[r.type]||I.lieu}</span><span class="tx"><b>${esc(t)}</b><small>${esc(s)}${r.limite?' · la rue s\'arrête au n° '+r.limite:r.corrige?' · identifiant mis à jour':''}</small></span>${frais?`<span class="km">${fmtD(distLL([mePos.lat,mePos.lng],[r.lat,r.lng]))}</span>`:''}</button></li>`}).join('')}</ul>`
    :autre&&autre!==VILLE&&aVille(autre)?`<p class="vide">Cet identifiant est une adresse de ${esc(VILLES[autre].nom)}. <a href="${esc(lienVille(autre,'#'+id))}">Ouvrir la carte de ${esc(VILLES[autre].nom)}</a></p>`
    :cat?'':'<p class="vide">Aucun résultat. Essayez « 12 Avenue de la République », une pharmacie, un quartier, l\'identifiant GN-… reçu par WhatsApp ou un Plus Code.</p>');
  C.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>choisirResultat(+b.dataset.i));
  C.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{const x=etab(b.dataset.e);fermerRecherche();if(x)ficheEtab(x)});
  if($('rVoirCat'))$('rVoirCat').onclick=()=>listeCategorie(cat);
  if($('rAjoutCat'))$('rAjoutCat').onclick=()=>ajouterLieu(null,cat);
}
function choisirResultat(i){
  const r=rList[i];if(!r)return;const but=rBut;
  fermerRecherche();
  if(r.type==='quartier'||r.type==='commune'){map.flyTo({center:[r.lng,r.lat],zoom:r.type==='commune'?13.5:15.5,padding:marges()});
    if(but){picking={but};$('pickTxt').textContent='Touchez la carte à l\'adresse exacte';$('pick').hidden=false}return}
  const a=r.adresse||ref.adresse(r.lat,r.lng);
  if(but&&a){definirLieu(but,a);accueil();return}
  if(a)showAddress(a,'liste');else map.flyTo({center:[r.lng,r.lat],zoom:16});
}

$('q').addEventListener('keydown',e=>{
  const items=$('rCorps').querySelectorAll('[data-i]');
  if(e.key==='Escape'){fermerRecherche();return}
  if(!items.length)return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();rSel=(rSel+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items.forEach((b,i)=>b.style.background=i===rSel?'var(--panel2)':'');items[rSel].scrollIntoView({block:'nearest'})}

$('rForm').addEventListener('submit',e=>{e.preventDefault();if(!ref)return;
  const pe=$('rCorps').querySelector('[data-e]');if(pe&&rSel<0&&(!rList.length||!(rList[0].score>=1))){pe.click();return}if(rSel>=0)return choisirResultat(rSel);if(!rList.length)rendreResultats();if(rList.length===1||(rList[0]&&rList[0].score>=1))choisirResultat(0)});
/* recherche vocale (Chrome, Safari) : on dit l'adresse, elle s'écrit */
let ecoute=null;
const arreterMicro=()=>{if(ecoute){try{ecoute.abort()}catch(e){}ecoute=null}$('rMicro').classList.remove('ecoute')};
$('rMicro').onclick=()=>{
  if(ecoute){arreterMicro();return}
  try{const r=new SR();r.lang='fr-FR';r.interimResults=true;r.maxAlternatives=1;
    r.onresult=e=>{$('q').value=[...e.results].map(x=>x[0].transcript).join('').trim();rendreResultats()};
    r.onerror=e=>{toast(e.error==='not-allowed'?'Micro refusé : autorisez-le dans les réglages du navigateur.':'Je n\'ai pas compris : réessayez.')};
    r.onend=()=>{ecoute=null;$('rMicro').classList.remove('ecoute')};
    r.start();ecoute=r;$('rMicro').classList.add('ecoute');toast('Dites l\'adresse…')}catch(e){toast('La recherche vocale ne marche pas sur ce navigateur.')}
};

/* ---------- photos des lieux : vérifiées (espace public du service) ou gardées sur ce téléphone en attendant ----------
   Sur le téléphone, chaque photo est réduite (1600 px, miniature 480 px) et réenregistrée en JPEG : ses informations cachées
   (position GPS, modèle du téléphone) disparaissent. Elles attendent dans IndexedDB jusqu'à l'envoi, même sans réseau. */
let PHOTOS_BASE=null;
const PH_MEM=new Map();let BDD=null;
function bdd(){if(!BDD)BDD=new Promise((ok,ko)=>{try{const r=indexedDB.open('itina-geo',1);r.onupgradeneeded=()=>{r.result.createObjectStore('photos')};r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)}catch(e){ko(e)}});return BDD}
async function phLire(id){try{const d=await bdd();return await new Promise((ok,ko)=>{const q=d.transaction('photos').objectStore('photos').get(id);q.onsuccess=()=>ok(Array.isArray(q.result)?q.result:PH_MEM.get(id)||[]);q.onerror=()=>ko(q.error)})}catch(e){return PH_MEM.get(id)||[]}}
async function phEcrire(id,l){PH_MEM.set(id,l);try{const d=await bdd();await new Promise((ok,ko)=>{const t=d.transaction('photos','readwrite'),s=t.objectStore('photos');if(l&&l.length)s.put(l,id);else s.delete(id);t.oncomplete=()=>ok();t.onerror=()=>ko(t.error)})}catch(e){}}
async function preparerPhoto(f){
  if(f.type&&!/^image\//.test(f.type))throw new Error('« '+f.name+' » n\'est pas une image.');
  if(f.size>30e6)throw new Error('« '+f.name+' » est trop lourde.');
  let img=null;
  try{img=await createImageBitmap(f,{imageOrientation:'from-image'})}catch(e){
    img=await new Promise((ok,ko)=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{URL.revokeObjectURL(u);ok(i)};i.onerror=()=>{URL.revokeObjectURL(u);ko(new Error('« '+f.name+' » : format d\'image non reconnu (essayez une photo JPEG).'))};i.src=u})}
  const L0=img.width,H0=img.height;if(!L0||!H0)throw new Error('Image vide.');
  const vers=(max,q)=>{const k=Math.min(1,max/Math.max(L0,H0)),l=Math.max(1,Math.round(L0*k)),h=Math.max(1,Math.round(H0*k)),c=document.createElement('canvas');c.width=l;c.height=h;
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,l,h);x.drawImage(img,0,0,l,h);return new Promise((ok,ko)=>c.toBlob(b=>b?ok({b,l,h}):ko(new Error('Image impossible à préparer.')),'image/jpeg',q))};
  let g=await vers(1600,.82);if(g.b.size>640*1024)g=await vers(1280,.76);if(g.b.size>640*1024)g=await vers(1024,.7);
  const m=await vers(480,.72);
  if(img.close)img.close();
  return{k:'ph-'+hasardId(8),grande:g.b,mini:m.b,l:g.l,h:g.h};
}
const versBase64=b=>new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]||'');r.onerror=()=>ko(r.error);r.readAsDataURL(b)});
/* envoi des photos d'une de mes fiches (il faut son code) ; sans réseau, elles attendent la prochaine fois */
let envoiPhotos=false;
async function envoyerPhotos(m,suivi){
  if(!CONNECT||DEMO||!m||!m.code||m.statut==='a_envoyer'||m.statut==='retire'||envoiPhotos)return null;
  envoiPhotos=true;let n=0,err=null;const l=await phLire(m.id),a=l.filter(x=>x.etat==='a_envoyer');
  try{for(const x of a){
      if(suivi)suivi(n,a.length);
      try{const {r,j}=await poster('/v1/photo',{id:m.id,code:m.code,grande:await versBase64(x.grande),miniature:await versBase64(x.mini)},90000);
        if(r.status===201&&j&&j.photo){x.etat='envoyee';x.pid=j.photo;n++}
        else if(r.status===400||r.status===413){x.etat='refusee';x.erreur=(j&&j.erreur&&j.erreur.message)||'refusée'}
        else{err=(j&&j.erreur&&j.erreur.message)||'Envoi impossible ('+r.status+').';if(r.status===409||r.status===403)x.etat='refusee';break}
      }catch(e){err='Pas de connexion : les photos partiront plus tard.';break}
      await phEcrire(m.id,l);
    }
    await phEcrire(m.id,l);
  }finally{envoiPhotos=false}
  if(suivi)suivi(n,a.length,err);
  return{n,total:a.length,err};
}
async function envoyerPhotosEnAttente(){
  if(!CONNECT||DEMO)return;
  for(const m of MES.filter(x=>x.ville===VILLE&&x.code&&(x.statut==='en_attente'||x.statut==='publie'))){
    const pub=(ETAB_SERVICE.find(x=>x.id===m.id)||{}).photos||[],l=await phLire(m.id);
    const reste=l.filter(x=>!(x.etat==='envoyee'&&pub.some(p=>p.id===x.pid)));       /* publiées : elles viennent du service */
    if(reste.length!==l.length)await phEcrire(m.id,reste);
    if(reste.some(x=>x.etat==='a_envoyer'))await envoyerPhotos(m);
  }
}
let URLS_PH=[];
async function photosDe(l){
  URLS_PH.forEach(u=>URL.revokeObjectURL(u));URLS_PH=[];
  const out=[],pub=GL.photos(l);
  for(const p of pub){const u=GL.urlPhoto(PHOTOS_BASE,l.id,p);if(u)out.push({src:u,mini:GL.urlPhoto(PHOTOS_BASE,l.id,p,true),l:p.l,h:p.h,pid:p.id})}
  if(MES.some(x=>x.id===l.id))for(const x of await phLire(l.id)){
    if(x.etat==='refusee'||(x.pid&&pub.some(p=>p.id===x.pid)))continue;
    const s=URL.createObjectURL(x.grande),mi=URL.createObjectURL(x.mini);URLS_PH.push(s,mi);
    out.push({src:s,mini:mi,l:x.l,h:x.h,attente:!(DEMO&&x.etat==='publiee'),k:x.k,pid:x.pid,local:true,etat:x.etat});
  }
  return out;
}

async function poster(route,corps,ms){

async function envoyerFiche(f,piege){
  const m={id:'L-local-'+hasardId(8),code:null,ville:VILLE,fiche:f,statut:'en_attente',envoye:Date.now(),local:true};
  if(CONNECT&&!DEMO){
    try{const {r,j}=await poster('/v1/proposer',{fiche:f,piege:piege||undefined});
      if(r.status===201&&j&&j.id){m.id=j.id;m.code=j.code;m.statut=j.statut;delete m.local}
      else if(r.status===409&&j&&j.erreur){return{doublon:j.erreur.existant&&j.erreur.existant.id}}
      else if(r.status===400&&j&&j.erreur&&j.erreur.champs){return{erreurs:j.erreur.champs}}
      else if(j&&j.erreur&&r.status<500){return{message:j.erreur.message}}
      else throw new Error('HTTP '+r.status)}
    catch(e){m.statut='a_envoyer'}                         /* pas de réseau : la fiche partira toute seule plus tard */
  }else if(!DEMO)m.statut='a_envoyer';
  else m.code=codeLocal();

async function envoyerModif(l,f){

  if(r>=5)for(let i=0;i<=48;i++){const t=i/48*2*Math.PI;c.push([mePos.lng+r*Math.cos(t)/k,mePos.lat+r*Math.sin(t)/110574])}

}

    const d=ix&&typeof ix.date==='string'?ix.date:'',d0=ref.info&&ref.info.date||'';
    if(!d||!d0||d<=d0||d===majVue)return;majVue=d;
    const quand=new Date(d);$('majTxt').textContent='Nouveau plan de '+VI.nom+' publié par Guinée Maps'+(isFinite(quand)?' le '+quand.toLocaleDateString('fr-FR',{day:'numeric',month:'long'}):'')+'.';
    $('maj').hidden=false}catch(e){}
}
$('majGo').onclick=()=>location.reload();$('majX').onclick=()=>{$('maj').hidden=true};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)verifierMaj()});
setInterval(verifierMaj,15*60000);setTimeout(verifierMaj,12000);

/* ---------- démarrage ---------- */
accueil();
fetch('data/villes.json').then(r=>r.ok?r.json():null).then(j=>{VLIST=j&&Array.isArray(j.villes)?j.villes:null;menuVilles()}).catch(()=>{});
CA.charger({base:VI.dossier}).then(r=>{
  ref=r;window.__ref=r;
  const go=()=>{addLayers();appliquerAffichage();$('status').hidden=true;accueil();
    replierSources();
    if(!openHash()&&!vue){const b=ref.bbox;sansMarge();map.fitBounds([[b[0],b[1]],[b[2],b[3]]],{padding:marges(),duration:0})}
    drawNums();
    if(GL)chargerConnect().then(chargerEtabs)};
  const essai=()=>{if(map.isStyleLoaded())go();else setTimeout(essai,80)};essai();
}).catch(e=>{
  if(deMemoire){try{localStorage.removeItem(VILLE_MEMO)}catch(x){}if(window.ITINA_DEMO)location.reload();else location.replace('./?ville=conakry');return}
  const absent=/\(404\)/.test(e&&e.message||'');
  erreurDemarrage(absent?'Plan de '+VI.nom+' pas encore publié':'Le plan de '+VI.nom+' ne s\'ouvre pas',
    absent?'Ce plan n\'est pas encore sur ce site'+(DEMO?'.':' (dossier <code>'+esc(VI.dossier)+'</code>). L\'équipe le fabrique avec le <a href="studio.html'+SUFFIXE+'">studio</a>.')
      :'Pas de connexion, ou le plan n\'est pas encore gardé sur cet appareil. Réessayez une fois connecté.'+(e&&e.message?' ('+esc(e.message)+')':''),true)});
window.__itinaGeo={REG,LIEUX,actifs,ajouterSignal,get RT(){return RT},get guide(){return guide},map,
  get ETABS(){return ETABS},get MES(){return MES},get CONNECT(){return CONNECT},ficheEtab:id=>ficheEtab(etab(id)),chargerEtabs,ajouterLieu,phLire,get PHOTOS_BASE(){return PHOTOS_BASE}};
})();
