<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-hTtJ9HslZ5N3OG6MqaIC5pqAfeopHiEfwMWQbomfacY='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://server.arcgisonline.com; connect-src 'self' https://server.arcgisonline.com; worker-src 'self' blob:; child-src blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Choisir une adresse · Conakry Adresses</title>
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="lib/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
<style>
html,body{height:100%;overflow:hidden}
#map{position:fixed;inset:0;background:var(--paper)}
.top{position:fixed;z-index:20;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;right:10px}
.find{display:flex;align-items:center;gap:4px;background:var(--panel);border-radius:999px;box-shadow:0 2px 12px rgba(0,0,0,.25);padding:4px 4px 4px 16px;height:50px}
.find input{border:0;background:transparent;min-height:42px;padding:0;font-size:16px;flex:1;min-width:0}
.sugg{list-style:none;margin:8px 0 0;padding:6px;background:var(--panel);border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.22);max-height:50vh;overflow:auto}
.sugg button{all:unset;box-sizing:border-box;display:flex;flex-direction:column;width:100%;padding:9px 10px;border-radius:10px;cursor:pointer}
.sugg button:hover{background:var(--green-soft)}.sugg small{color:var(--muted);font-size:12px}
.cross{position:fixed;z-index:10;left:50%;top:calc(50% - 40px);width:34px;height:48px;margin:-48px 0 0 -17px;pointer-events:none;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4));transition:transform .15s}
.moving .cross{transform:translateY(-8px)}
.shadow{position:fixed;z-index:9;left:50%;top:calc(50% - 40px);width:10px;height:4px;margin:-2px 0 0 -5px;border-radius:50%;background:rgba(0,0,0,.35);pointer-events:none}
.card{position:fixed;z-index:20;left:0;right:0;bottom:0;background:var(--panel);border-radius:18px 18px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.2);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.eyebrow{font:700 11px var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.card b.l1{display:block;font:800 21px/1.2 var(--display);margin:2px 0}
.l2{color:var(--fg)}.pc{font:600 12px ui-monospace,monospace;color:var(--muted);margin-top:4px}
.actions{display:flex;gap:8px;margin-top:12px}.actions .btn{flex:1}
.loc{position:fixed;z-index:15;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 170px);width:46px;height:46px;border-radius:50%;border:0;background:var(--panel);box-shadow:0 2px 10px rgba(0,0,0,.28);display:grid;place-items:center;cursor:pointer;color:var(--fg)}
.maplibregl-ctrl-bottom-right{bottom:calc(env(safe-area-inset-bottom,0px) + 150px)}
.maplibregl-ctrl-attrib,.maplibregl-ctrl-attrib.maplibregl-compact{background:color-mix(in srgb,var(--panel) 88%,transparent);color:var(--fg)}.maplibregl-ctrl-attrib a{color:var(--fg)}
</style>
</head>
<body>
<div id="map" aria-label="Déplacez la carte pour placer le repère sur la porte"></div>
<div class="shadow" aria-hidden="true"></div>
<svg class="cross" viewBox="0 0 34 48" aria-hidden="true"><path d="M17 47C17 47 32 28 32 16A15 15 0 0 0 2 16C2 28 17 47 17 47z" fill="#c8312a" stroke="#fff" stroke-width="2"/><circle cx="17" cy="16" r="5.5" fill="#fff"/></svg>
<header class="top">
  <form class="find" id="find" role="search" autocomplete="off"><input type="search" id="q" placeholder="Chercher une adresse ou un quartier" aria-label="Chercher une adresse" maxlength="120" enterkeyhint="search"><button class="btn primary" type="submit">OK</button></form>
  <ul class="sugg" id="sugg" hidden></ul>
</header>
<button class="loc" type="button" id="loc" aria-label="Ma position"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
<section class="card" aria-live="polite">
  <div class="eyebrow" id="titre">Adresse</div>
  <b class="l1" id="l1">Chargement…</b>
  <div class="l2" id="l2"></div>
  <div class="pc" id="pc"></div>
  <div class="actions"><button class="btn" type="button" id="annuler" hidden>Annuler</button><button class="btn primary" type="button" id="ok" disabled>Valider cette adresse</button></div>
</section>
<script src="lib/maplibre-gl.js"></script>
<script src="sdk/conakry-adresses.js"></script>
<script>
(()=>{
/* Page à intégrer dans les applis (iframe, WebView) : l'utilisateur place le repère, l'appli reçoit l'adresse.
   Paramètres : ?titre=Prise en charge &origine=https://mon-appli.example (iframe ou fenêtre)
                &retour=monappli://adresse (WebView : schéma propre à l'appli) &lat=&lng= ou &adresse=GN-… */
const $=id=>document.getElementById(id),CA=window.ConakryAdresses,P=new URLSearchParams(location.search);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const titre=(P.get('titre')||'').slice(0,60);if(titre)$('titre').textContent=titre;
/* ville du plan : ?ville=labe (Conakry par défaut) */
const VILLES={conakry:{nom:'Conakry',dossier:'data/',c:[9.53,-13.70]},kindia:{nom:'Kindia',dossier:'data/kindia/',c:[10.05692,-12.86576]},labe:{nom:'Labé',dossier:'data/labe/',c:[11.31823,-12.28332]},mamou:{nom:'Mamou',dossier:'data/mamou/',c:[10.37546,-12.09148]},nzerekore:{nom:'N\'Zérékoré',dossier:'data/nzerekore/',c:[7.75624,-8.8179]},siguiri:{nom:'Siguiri',dossier:'data/siguiri/',c:[11.42282,-9.16852]}};
const VI=VILLES[P.get('ville')]||VILLES.conakry;
/* destinataire de l'adresse : jamais n'importe quel site */
let cible=null;try{const o=P.get('origine');if(o){const u=new URL(o);if(u.protocol==='https:'||u.hostname==='localhost'||u.hostname==='127.0.0.1')cible=u.origin}}catch(e){}
if(!cible&&document.referrer&&window.parent!==window){try{cible=new URL(document.referrer).origin}catch(e){}}
let retour=null;try{const r=P.get('retour');if(r){const u=new URL(r);if(/^[a-z][a-z0-9+.-]*:$/.test(u.protocol)&&!['http:','https:','javascript:','data:','file:','blob:','vbscript:','about:'].includes(u.protocol))retour=u.href}}catch(e){}
const parentWin=window.parent!==window?window.parent:window.opener;
if(parentWin||retour)$('annuler').hidden=false;
const ESRI='https://server.arcgisonline.com/ArcGIS/rest/services/';
const map=new maplibregl.Map({container:'map',attributionControl:false,
  style:{version:8,glyphs:new URL('glyphs/{fontstack}/{range}.pbf',location.href).href.replace('%7Bfontstack%7D','{fontstack}').replace('%7Brange%7D','{range}'),
    sources:{plan:{type:'raster',tiles:[ESRI+'Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}'],tileSize:256,maxzoom:16,attribution:'Fond © Esri'}},
    layers:[{id:'bg',type:'background',paint:{'background-color':css('--paper')}},{id:'plan',type:'raster',source:'plan',paint:{'raster-opacity':.55}}]},
  center:[VI.c[1],VI.c[0]],zoom:15,dragRotate:false,pitchWithRotate:false});
map.touchZoomRotate.disableRotation();
map.addControl(new maplibregl.AttributionControl({compact:true,customAttribution:'Rues © OpenStreetMap'}),'bottom-right');
let ref=null,cur=null;
const FC=f=>({type:'FeatureCollection',features:f||[]});
function layers(){
  map.addSource('voies',{type:'geojson',data:FC(ref.voies.map(v=>({type:'Feature',properties:{m:CA._interne.MAJEUR[v.highway]?1:0,n:v.nom,p:v.statut==='a_nommer'||v.statut==='provisoire'||v.lien?1:0},geometry:{type:'MultiLineString',coordinates:v.segs.map(g=>g.map(p=>[p.lon,p.lat]))}})))});
  const w=add=>['interpolate',['exponential',1.6],['zoom'],12,['case',['==',['get','m'],1],2+add,.7+add],15,['case',['==',['get','m'],1],6+add,3.2+add],17,['case',['==',['get','m'],1],14+add,10+add],19,['case',['==',['get','m'],1],30+add,24+add]];
  map.addLayer({id:'c',type:'line',source:'voies',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':css('--casing'),'line-width':w(2)}});
  map.addLayer({id:'v',type:'line',source:'voies',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':['case',['==',['get','m'],1],css('--major'),css('--street')],'line-width':w(0)}});
  map.addLayer({id:'n',type:'symbol',source:'voies',minzoom:15,layout:{'text-field':['get','n'],'text-font':['NotoSansMedium'],'text-size':11,'symbol-placement':'line','text-max-angle':38,'symbol-spacing':260},paint:{'text-color':['case',['==',['get','p'],1],css('--provisoire'),css('--text')],'text-halo-color':css('--halo'),'text-halo-width':1.5}});
}
function update(){
  if(!ref)return;const c=map.getCenter();cur=ref.adresse(c.lat,c.lng);
  if(!cur){$('l1').textContent='Hors de '+VI.nom;$('l2').textContent='Déplacez la carte vers '+VI.nom+'.';$('pc').textContent='';$('ok').disabled=true;return}
  $('l1').textContent=cur.ligne1;$('l2').textContent=cur.ligne2;$('pc').textContent=(cur.id?cur.id+' · ':'')+cur.plusCodeCourt;$('ok').disabled=false;
}
map.on('movestart',()=>document.body.classList.add('moving'));
map.on('moveend',()=>{document.body.classList.remove('moving');update()});
function envoyer(type,adresse){
  const msg={type,adresse:adresse||null,source:'conakry-adresses',version:CA.version};
  if(parentWin&&cible)parentWin.postMessage(msg,cible);
  /* WebView Android/iOS (.NET MAUI, Flutter…) : l'appli intercepte la navigation vers son schéma */
  if(retour){const u=new URL(retour);u.searchParams.set('statut',type==='conakry-adresse'?'ok':'annule');if(adresse){u.searchParams.set('adresse',JSON.stringify(adresse))}location.href=u.href}
  if(!parentWin&&!retour)navigator.clipboard&&adresse&&navigator.clipboard.writeText(adresse.texte).catch(()=>{});
}
$('ok').onclick=()=>{if(cur){const a=Object.assign({},cur);delete a.pointRue;envoyer('conakry-adresse',a);if(!parentWin&&!retour){$('titre').textContent='Adresse copiée'}}};
$('annuler').onclick=()=>envoyer('conakry-adresse-annulee',null);
/* recherche */
let last=[];
const show=l=>{last=l;const s=$('sugg');if(!$('q').value.trim()){s.hidden=true;return}s.hidden=false;s.innerHTML=l.length?l.map((r,i)=>`<li><button type="button" data-i="${i}"><b>${esc(r.adresse?r.adresse.ligne1:r.libelle)}</b><small>${esc(r.adresse?r.adresse.ligne2:r.type)}</small></button></li>`).join(''):'<li class="hint" style="padding:10px">Aucun résultat.</li>';s.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const r=last[+b.dataset.i];s.hidden=true;$('q').blur();map.jumpTo({center:[r.lng,r.lat],zoom:r.type==='commune'?14:r.type==='quartier'?16:18});update()})};
let t;$('q').addEventListener('input',()=>{clearTimeout(t);t=setTimeout(()=>ref&&show(ref.chercher($('q').value,{max:6})),160)});
$('find').addEventListener('submit',e=>{e.preventDefault();if(!ref)return;const l=ref.chercher($('q').value,{max:6});if(l[0]&&(l.length===1||l[0].score>=1)){map.jumpTo({center:[l[0].lng,l[0].lat],zoom:18});$('sugg').hidden=true;update()}else show(l)});
$('loc').onclick=()=>navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{map.jumpTo({center:[p.coords.longitude,p.coords.latitude],zoom:18});update()},()=>{$('l2').textContent='Position introuvable : autorisez la localisation.'},{enableHighAccuracy:true,timeout:15000});
CA.charger({base:VI.dossier}).then(r=>{
  ref=r;window.__ref=r;
  const go=()=>{layers();
    const id=P.get('adresse'),la=parseFloat(P.get('lat')),ln=parseFloat(P.get('lng'));
    let a=id?ref.position(id):null;
    if(a)map.jumpTo({center:[a.position.lng,a.position.lat],zoom:18});
    else if(isFinite(la)&&isFinite(ln))map.jumpTo({center:[ln,la],zoom:18});
    update();
    if(parentWin&&cible)parentWin.postMessage({type:'conakry-pret',source:'conakry-adresses',version:CA.version},cible)};
  if(map.isStyleLoaded())go();else map.once('load',go);
}).catch(e=>{$('l1').textContent='Plan indisponible';$('l2').textContent=e.message});
})();
</script>
</body>
</html>
